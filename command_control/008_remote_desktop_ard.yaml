---
api_version: 2.0
uuid: 804f5f6d-0405-41ab-be5d-0756acc10f72
name: Remote Desktop via ARD (Apple Remote Desktop)
authors:
- Claude Code
description: |
  Tests Apple Remote Desktop connectivity for C2 remote access
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1021 Remote Services
requirements:
  platforms:
  - os: darwin
args:
- name: ard_host
  description: ARD target hostname or IP
  type: string
  default: 192.168.1.100
- name: ard_port
  description: ARD port
  type: integer
  default: 5900
- name: ard_username
  description: ARD username
  type: string
  default: admin
- name: ard_password
  description: ARD password
  type: string
  default: ''
- name: timeout
  description: Connection timeout
  type: integer
  default: 5
steps:
- name: check_ard_service
  description: Check if ARD service is running/accessible
  inline: |
    timeout {{ .Args.timeout }} bash -c "cat < /dev/null > /dev/tcp/{{ .Args.ard_host }}/{{ .Args.ard_port }}" && echo "ARD port {{ .Args.ard_port }} is open" || echo "ARD port {{ .Args.ard_port }} is closed"
- name: scan_ard_ports
  description: Scan common ARD ports
  inline: |
    echo "Scanning ARD ports on {{ .Args.ard_host }}..."
    for port in 3283 5900 5901; do
      timeout {{ .Args.timeout }} bash -c "cat < /dev/null > /dev/tcp/{{ .Args.ard_host }}/$port" && echo "Port $port: OPEN" || echo "Port $port: CLOSED"
    done
- name: list_ard_agents
  description: List available ARD agents on local network
  inline: |
    if command -v dns-sd &> /dev/null; then
      timeout 5 dns-sd -B _ard._tcp local 2>/dev/null | head -10 || echo "No ARD services found"
    else
      echo "dns-sd not available"
    fi
- name: test_ard_connection
  description: Test ARD connection capability
  inline: |
    echo "Testing ARD connection to {{ .Args.ard_host }}:{{ .Args.ard_port }}"
    echo "Would use: /System/Library/CoreServices/Remote\ Desktop\ Connection.app or similar"
  cleanup:
    inline: |
      pkill -f "Remote Desktop" 2>/dev/null || true
      pkill -f "ard" 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
