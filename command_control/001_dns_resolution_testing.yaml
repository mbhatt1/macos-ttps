---
api_version: 2.0
uuid: c7f99f80-594a-409f-8991-fc59c8356706
name: DNS Resolution Testing
authors:
- Claude Code
description: |
  Tests DNS resolution capabilities as a basic C2 connectivity check
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1071 Application Layer Protocol
  subtechniques:
  - 'T1071.004 Application Layer Protocol: DNS'
requirements:
  platforms:
  - os: darwin
args:
- name: target_domain
  description: Target domain to resolve
  type: string
  default: google.com
- name: dns_server
  description: DNS server to query
  type: string
  default: 8.8.8.8
steps:
- name: resolve_target_domain
  description: Resolve target domain using dig
  inline: dig @{{ .Args.dns_server }} {{ .Args.target_domain }} +short
- name: nslookup_verification
  description: Verify resolution with nslookup
  inline: nslookup {{ .Args.target_domain }} {{ .Args.dns_server }}
  cleanup:
    inline: sudo dscacheutil -flushcache
tests:
- name: dry_run_test
  dry_run: true
