---
api_version: 2.0
uuid: 58b8f7b4-ddf4-48c4-a083-c4ea1b21af09
name: Create LaunchDaemon plist
authors:
- TTPForge
description: |
  Creates a LaunchDaemon plist file in /Library/LaunchDaemons for elevated persistence
mitre:
  tactics:
  - TA0003 Persistence
  techniques:
  - T1543 Create or Modify System Process
  subtechniques:
  - 'T1543.004 Create or Modify System Process: Launch Daemon'
requirements:
  platforms:
  - os: darwin
args:
- name: daemon_name
  description: Name of the LaunchDaemon (without .plist extension)
  type: string
  default: com.apple.system.logger
- name: script_path
  description: Path to the script to execute
  type: string
  default: /usr/local/bin/daemon_script.sh
- name: run_at_load
  description: Run the daemon when loaded
  type: bool
  default: true
- name: start_interval
  description: Interval in seconds to run the script
  type: int
  default: 3600
steps:
- name: create_daemon_script
  create_file: '{{ .Args.script_path }}'
  contents: |
    #!/bin/bash
    echo "LaunchDaemon persistence activated at $(date)" >> /var/log/daemon.log
    # Add system-level malicious payload here
  mode: 493
  cleanup: default
- name: create_launchdaemon_plist
  create_file: /Library/LaunchDaemons/{{ .Args.daemon_name }}.plist
  contents: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Label</key>
        <string>{{ .Args.daemon_name }}</string>
        <key>ProgramArguments</key>
        <array>
            <string>{{ .Args.script_path }}</string>
        </array>
        <key>RunAtLoad</key>
        <{{ run_at_load|lower }}/>>
        <key>StartInterval</key>
        <integer>{{ .Args.start_interval }}</integer>
        <key>StandardOutPath</key>
        <string>/var/log/daemon_stdout.log</string>
        <key>StandardErrorPath</key>
        <string>/var/log/daemon_stderr.log</string>
    </dict>
    </plist>
  mode: 420
  cleanup: default
tests:
- name: dry_run_test
  dry_run: true
