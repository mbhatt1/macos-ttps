---
api_version: 2.0
uuid: 00fd2f94-6c17-4154-be6d-4801b14b6ea2
name: Hide Files with chflags
authors:
- TTPForge
description: |
  Hide files using chflags hidden flag to avoid filesystem visibility
mitre:
  tactics:
  - TA0005 Defense Evasion
  techniques:
  - T1564 Hide Artifacts
  subtechniques:
  - 'T1564.001 Hide Artifacts: Hidden Files and Directories'
requirements:
  platforms:
  - os: darwin
  superuser: false
args:
- name: file_path
  description: Full path to file or directory to hide
  type: string
- name: unhide
  description: Unhide the file
  type: bool
  default: false
steps:
- name: validate_path
  description: Verify file/directory exists
  inline: test -e "{{ .Args.file_path }}"
- name: hide_file
  description: Mark file as hidden using chflags
  inline: chflags hidden "{{ .Args.file_path }}"
- name: unhide_file
  description: Remove hidden flag from file
  inline: chflags nohidden "{{ .Args.file_path }}"
  cleanup:
    inline: chflags nohidden "{{ args.file_path }}"
tests:
- name: dry_run_test
  dry_run: true
