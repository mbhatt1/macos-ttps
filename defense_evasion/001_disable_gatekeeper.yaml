description: |
  Disable Apple's Gatekeeper security feature to allow unsigned applications to run
mitre:
  tactics:
  - TA0005 Defense Evasion
  techniques:
  - T1562 Impair Defenses
  subtechniques:
  - 'T1562.001 Impair Defenses: Disable or Modify Tools'
requirements:
