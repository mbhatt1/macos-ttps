---
api_version: 2.0
uuid: 9800d919-f198-4bd5-a058-4e66bdf50f94
name: Disable Spotlight Indexing
authors:
- TTPForge
description: |
  Disable macOS Spotlight indexing to avoid detection through searches
mitre:
  tactics:
  - TA0005 Defense Evasion
  techniques:
  - T1562 Impair Defenses
  subtechniques:
  - 'T1562.001 Impair Defenses: Disable or Modify Tools'
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: disable
  description: Disable Spotlight indexing
  type: bool
  default: false
- name: target_volume
  description: Target volume to disable Spotlight on
  type: string
  default: /
- name: path
  description: Specific path to exclude from Spotlight
  type: string
  default: ''
steps:
- name: check_spotlight_status
  description: Check Spotlight indexing status
  inline: mdutil -s /
- name: disable_spotlight
  description: Disable Spotlight indexing on target volume
  inline: mdutil -i off "{{ .Args.target_volume }}"
- name: exclude_path
  description: Exclude specific path from Spotlight indexing
  inline: mdutil -E "{{ .Args.path }}"
  cleanup:
    inline: mdutil -i on /
tests:
- name: dry_run_test
  dry_run: true
