---
api_version: 2.0
uuid: 86fd04e4-6826-41d0-a101-b64ee42d5c40
name: Create Hidden Directories
authors:
- TTPForge
description: |
  Create hidden directories using dot prefix to evade filesystem detection
mitre:
  tactics:
  - TA0005 Defense Evasion
  techniques:
  - T1564 Hide Artifacts
  subtechniques:
  - 'T1564.001 Hide Artifacts: Hidden Files and Directories'
requirements:
  platforms:
  - os: darwin
  superuser: false
args:
- name: base_path
  description: Base path for hidden directory
  type: string
  default: null
- name: directory_name
  description: Name of hidden directory (without . prefix)
  type: string
- name: nested_depth
  description: Create nested hidden directories
  type: int
  default: 1
steps:
- name: expand_path
  description: Expand base path with variables
  inline: eval echo "{{ .Args.base_path }}"
- name: create_hidden_dir
  description: Create hidden directory with dot prefix
  inline: mkdir -p "{{ .Args.base_path }}/.{{ .Args.directory_name }}"
- name: create_nested
  description: Create nested hidden directories
  inline: |
    NESTED_PATH="{{ .Args.base_path }}/.{{ .Args.directory_name }}"
    for i in $(seq 1 {{ .Args.nested_depth }}); do
      NESTED_PATH="${NESTED_PATH}/.nested_${i}"
    done
    mkdir -p "${NESTED_PATH}"
- name: list_hidden
  description: List hidden directories in base path
  inline: ls -lah "{{ .Args.base_path }}/" | grep "^\."
  cleanup:
    inline: rm -rf "{{ .Args.base_path }}/.{{ .Args.directory_name }}"
tests:
- name: dry_run_test
  dry_run: true
