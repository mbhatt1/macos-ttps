---
api_version: 2.0
uuid: 7a3f8b2e-4c1d-4e9a-b5f6-8d2e1c3a7b9f
name: System Shutdown
authors:
  - TTPForge
description: |
  Schedule a system shutdown on Linux to demonstrate the T1529 System
  Shutdown/Reboot impact technique. Schedules shutdown with a delay to
  allow cancellation during testing.
mitre:
  tactics:
    - "TA0040 Impact"
  techniques:
    - "T1529 System Shutdown/Reboot"
requirements:
  platforms:
    - os: linux
  superuser: true
steps:
  - name: check_system_uptime
    description: Check current system uptime and boot time
    inline: |
      uptime
      who -b

  - name: schedule_system_shutdown
    description: Schedule system shutdown with 5 minute delay
    inline: |
      shutdown -h +5 "TTPForge: System shutdown scheduled for impact testing"
      echo "Shutdown scheduled in 5 minutes"

  - name: verify_shutdown_scheduled
    description: Verify shutdown has been scheduled
    inline: |
      if [ -f /run/systemd/shutdown/scheduled ]; then
        cat /run/systemd/shutdown/scheduled
      else
        echo "Shutdown is pending"
      fi
    cleanup:
      inline: |
        shutdown -c 2>/dev/null || true
        echo "Scheduled shutdown cancelled"

tests:
  - name: dry_run_test
    dry_run: true
