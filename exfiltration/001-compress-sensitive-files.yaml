---
api_version: 2.0
uuid: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
name: Compress Sensitive Files
authors:
- TTPForge
description: |
  Stages sensitive files by compressing them into a tar archive for easier exfiltration
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1560 Archive Collected Data
  subtechniques:
  - 'T1560.001 Archive Collected Data: Archive via Utility'
requirements:
  platforms:
  - os: darwin
args:
- name: source_path
  description: Path to files or directory to compress
  type: string
  default: ~/Documents
- name: output_archive
  description: Output tar.gz archive path
  type: string
  default: /tmp/.staging/data.tar.gz
- name: exclude_patterns
  description: Patterns to exclude from compression
  type: string
  default: '*.tmp|*.cache'
steps:
- name: Create staging directory
  inline: mkdir -p "$(dirname '{{ .Args.output_archive }}')"
- name: Compress files to archive
  inline: |
    tar czf '{{ .Args.output_archive }}' \
      --exclude='{{ .Args.exclude_patterns }}' \
      '{{ .Args.source_path }}'
- name: Verify archive created
  inline: |
    if [ -f '{{ .Args.output_archive }}' ]; then
      ls -lh '{{ .Args.output_archive }}'
      echo "Archive size: $(du -h '{{ .Args.output_archive }}' | cut -f1)"
    else
      echo "ERROR: Archive creation failed"
      exit 1
    fi
  cleanup:
    inline: |-
      rm -f /tmp/test_archive.tar.gz /tmp/test_docs/doc*.txt
      rmdir /tmp/test_docs 2>/dev/null || true
tests:
- name: dry_run_test
  dry_run: true
