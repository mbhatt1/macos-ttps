---
api_version: 2.0
uuid: 26ec1513-70f7-40aa-a6ca-fd577635aa05
name: Collect Keyboard Input Monitoring
authors:
- TTPForge
description: |
  Collect keyboard input logs and keystroke monitoring artifacts
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1056 Input Capture
  subtechniques:
  - 'T1056.001 Input Capture: Keylogging'
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for keyboard input logs
  type: string
  default: /tmp/keyboard_logs
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Check accessibility permissions database
  inline: |
    sqlite3 /Library/Application\ Support/com.apple.sharedfilelist/com.apple.LSSharedFileList.ApplicationRecentDocuments.sfl2 \
      "SELECT * FROM item LIMIT 20" 2>/dev/null > {{ .Args.output_path }}/recent_apps.txt || echo "No accessibility DB access"
- name: Collect keystroke monitoring apps
  inline: |
    find /Applications -name "*keystroke*" -o -name "*logger*" -o -name "*monitor*" 2>/dev/null > {{ .Args.output_path }}/monitoring_apps.txt || true
- name: Extract accessibility logs
  inline: |
    if [ -f "$HOME/Library/Preferences/com.apple.accessibility.plist" ]; then
      cp "$HOME/Library/Preferences/com.apple.accessibility.plist" "{{ .Args.output_path }}/accessibility.plist" 2>/dev/null || true
    fi
- name: Check Universal Clipboard/Handoff
  inline: |
    defaults read ~/Library/Preferences/com.apple.universalclipboard 2>/dev/null > {{ .Args.output_path }}/clipboard_prefs.txt || true
- name: Collect input history
  inline: |
    find ~/Library -name "*input*" -type f 2>/dev/null | head -20 > {{ .Args.output_path }}/input_files.txt || true
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Keyboard logs cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
