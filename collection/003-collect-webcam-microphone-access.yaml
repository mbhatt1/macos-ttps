---
api_version: 2.0
uuid: cff662d3-cb7d-40c9-94e1-97e3d2e21da0
name: Collect Webcam and Microphone Access Logs
authors:
- TTPForge
description: |
  Collect logs of webcam and microphone access attempts from macOS system
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1125 Video Capture
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for access logs
  type: string
  default: /tmp/camera_mic_access
- name: days_back
  description: Number of days to look back in logs
  type: integer
  default: 7
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Collect camera/mic entitlements
  inline: |
    find /Applications -name "*.app" -exec codesign -d --entitlements :- {} \; 2>/dev/null | grep -i "camera\|microphone\|AVCapture" > {{ .Args.output_path }}/entitlements.txt 2>/dev/null || true
- name: Extract Camera app data
  inline: |
    if [ -d "~/Library/Application Support/FaceTime" ]; then
      cp -r "~/Library/Application Support/FaceTime" "{{ .Args.output_path }}/facetime_data" 2>/dev/null || true
    fi
- name: Collect Zoom camera access logs
  inline: |
    if [ -d "~/Library/Logs/zoom.us" ]; then
      cp -r "~/Library/Logs/zoom.us" "{{ .Args.output_path }}/zoom_logs" 2>/dev/null || true
    fi
- name: Check system privacy database
  inline: |
    sqlite3 ~/Library/Application\ Support/CrashReporter/DiagnosticMessagesHistory.db \
      "SELECT * FROM DiagnosticMessagesMetaData LIMIT 10" 2>/dev/null > {{ .Args.output_path }}/diagnostic_metadata.txt || true
- name: Collect privacy preferences
  inline: |
    if [ -f "~/Library/Preferences/com.apple.privacy.plist" ]; then
      cp "~/Library/Preferences/com.apple.privacy.plist" "{{ .Args.output_path }}/privacy.plist" 2>/dev/null || true
    fi
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Access logs cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
