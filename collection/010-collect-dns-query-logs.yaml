---
api_version: 2.0
uuid: 3cf9bbc7-f6ae-4956-a556-6e296b328884
name: Collect DNS Query Logs
authors:
- TTPForge
description: |
  Collect DNS query logs and DNS cache information from macOS system
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for DNS logs
  type: string
  default: /tmp/dns_logs
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Dump DNS cache
  inline: |
    dscacheutil -cachedump -entries host > {{ .Args.output_path }}/dns_cache_dump.txt 2>/dev/null || echo "No DNS cache data"
- name: Extract system DNS queries
  inline: |
    dscacheutil -statistics > {{ .Args.output_path }}/dns_stats.txt 2>/dev/null || true
- name: Collect mDNSResponder logs
  inline: |
    if [ -f "/var/log/system.log" ]; then
      grep -i "dns\|mDNS" /var/log/system.log > {{ .Args.output_path }}/mdns_system_log.txt 2>/dev/null || true
    fi
- name: Extract resolver configuration
  inline: |
    cat /etc/resolv.conf > {{ .Args.output_path }}/resolv_conf.txt 2>/dev/null || true
    if [ -d "/etc/resolver" ]; then
      cp -r /etc/resolver {{ .Args.output_path }}/ 2>/dev/null || true
    fi
- name: Collect network interface DNS settings
  inline: |
    networksetup -getdnsservers Wi-Fi > {{ .Args.output_path }}/wifi_dns.txt 2>/dev/null || true
    networksetup -getdnsservers Ethernet >> {{ .Args.output_path }}/ethernet_dns.txt 2>/dev/null || true
- name: Extract DNS lookup history
  inline: |
    log show --predicate 'process == "mDNSResponder"' --last 24h > {{ .Args.output_path }}/mdns_last24h.txt 2>/dev/null || true
- name: Collect DNS-related preferences
  inline: |
    defaults read /Library/Preferences/SystemConfiguration/com.apple.dnssd.plist > {{ .Args.output_path }}/dnssd_prefs.txt 2>/dev/null || true
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "DNS logs cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
