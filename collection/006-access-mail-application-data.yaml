---
api_version: 2.0
uuid: d6433af0-25eb-4ac7-a00e-382ce829b355
name: Access Mail Application Data
authors:
- TTPForge
description: |
  Extract and collect data from the macOS Mail application
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1114 Email Collection
  subtechniques:
  - 'T1114.001 Email Collection: Local Email Collection'
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for Mail data
  type: string
  default: /tmp/mail_data
- name: mailbox_filter
  description: Filter mailboxes by name
  type: string
  default: '*'
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Collect Mail database
  inline: |
    mail_path="$HOME/Library/Mail\ Downloads"
    if [ -d "$mail_path" ]; then
      cp -r "$mail_path" "{{ .Args.output_path }}/mail_downloads" 2>/dev/null || true
    fi
- name: Extract V series Mail data
  inline: |
    v_mail_path="$HOME/Library/Mail/V*/MailData"
    if ls "$v_mail_path" 1> /dev/null 2>&1; then
      mkdir -p {{ .Args.output_path }}/mail_v_series
      find "$v_mail_path" -name "*.db" -o -name "*.plist" | xargs -I {} cp {} {{ .Args.output_path }}/mail_v_series/ 2>/dev/null || true
    fi
- name: Collect Mail envelope index
  inline: |
    find ~/Library/Mail* -name "Envelope Index*" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/ 2>/dev/null || true
- name: Extract mailbox account information
  inline: |
    find ~/Library -name "com.apple.mail*" -type f 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/ 2>/dev/null || true
- name: Collect Mail message data
  inline: |
    mkdir -p {{ .Args.output_path }}/messages
    find ~/Library/Mail* -name "*.mbox" -type d 2>/dev/null | head -5 | xargs -I {} cp -r {} {{ .Args.output_path }}/messages/ 2>/dev/null || true
- name: List collected Mail data
  inline: ls -lah {{ .Args.output_path }}/
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Mail data cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
