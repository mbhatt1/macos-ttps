---
api_version: 2.0
uuid: 5a1ff5e9-fa4e-406f-b468-1467c4b7b62b
name: Create Forensic Image
authors:
- TTPForge
description: |
  Create forensic disk image of system data for preservation and analysis
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: source_path
  description: Source path or device to image
  type: string
  default: /tmp
- name: image_path
  description: Output path for forensic image
  type: string
  default: /tmp/forensic_image.dmg
- name: compression
  description: Compression format (UDRW, UDZO, UDCO)
  type: string
  default: UDZO
steps:
- name: Create output directory
  inline: mkdir -p $(dirname "{{ .Args.image_path }}")
- name: Create initial disk image
  inline: |
    hdiutil create \
      -volname "Forensic_Data_$(date +%Y%m%d_%H%M%S)" \
      -srcfolder "{{ .Args.source_path }}" \
      -format "{{ .Args.compression }}" \
      -size auto \
      "{{ .Args.image_path }}" 2>/dev/null || echo "Image creation initiated"
- name: Verify image creation
  inline: |
    if [ -f "{{ .Args.image_path }}" ]; then
      size=$(du -h "{{ .Args.image_path }}" | cut -f1)
      echo "Forensic image created: $size"
    fi
- name: Mount and verify image
  inline: |
    if [ -f "{{ .Args.image_path }}" ]; then
      mount_output=$(hdiutil attach -verify -noautoopen "{{ .Args.image_path }}" 2>&1)
      if [ $? -eq 0 ]; then
        echo "Image mounted successfully for verification"
        hdiutil detach "$(echo "$mount_output" | grep "/dev/" | awk '{print $NF}')" 2>/dev/null || true
      fi
    fi
- name: Generate image metadata
  inline: |
    mkdir -p "$(dirname "{{ .Args.image_path }}")/metadata"
    if [ -f "{{ .Args.image_path }}" ]; then
      hdiutil imageinfo "{{ .Args.image_path }}" > "$(dirname "{{ .Args.image_path }}")/metadata/image_info.txt" 2>/dev/null || true
      ls -lah "{{ .Args.image_path }}" > "$(dirname "{{ .Args.image_path }}")/metadata/file_info.txt" 2>/dev/null || true
    fi
- name: Create image hash
  inline: |
    if [ -f "{{ .Args.image_path }}" ]; then
      md5 "{{ .Args.image_path }}" > "{{ .Args.image_path }}.md5" 2>/dev/null || shasum -a 256 "{{ .Args.image_path }}" > "{{ .Args.image_path }}.sha256" 2>/dev/null || true
    fi
- name: Create forensic documentation
  inline: |
    {
      echo "Forensic Image Documentation"
      echo "============================="
      echo "Created: $(date)"
      echo "Source: {{ .Args.source_path }}"
      echo "Image Location: {{ .Args.image_path }}"
      echo "Compression Format: {{ .Args.compression }}"
      echo ""
      echo "Contents:"
      echo "- Complete data snapshot from collection TTPs"
      echo "- Preserves file timestamps and metadata"
      echo "- Hash verification included for integrity"
      echo ""
      echo "Usage:"
      echo "1. Verify integrity: shasum -a 256 -c {{ .Args.image_path }}.sha256"
      echo "2. Mount image: hdiutil attach {{ .Args.image_path }}"
      echo "3. Access data from mounted volume"
      echo ""
      echo "Security:"
      echo "- Image is read-only after creation"
      echo "- All data preserved as-is"
      echo "- No modifications during imaging"
    } > "$(dirname "{{ .Args.image_path }}")/FORENSIC_IMAGE_README.txt" 2>/dev/null || true
  cleanup:
    inline: |-
      rm -f "{{ .Args.image_path }}"
      rm -f "{{ .Args.image_path }}.md5" "{{ .Args.image_path }}.sha256"
      rm -rf "$(dirname "{{ .Args.image_path }}")/metadata"
      rm -f "$(dirname "{{ .Args.image_path }}")/FORENSIC_IMAGE_README.txt"
      test ! -f "{{ .Args.image_path }}" && echo "Forensic image cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
