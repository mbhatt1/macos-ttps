---
api_version: 2.0
uuid: 83aafd44-2818-460e-a9c3-0cdbdc6058f6
name: Archive Collected Data
authors:
- TTPForge
description: |
  Archive and compress collected data from all collection TTPs
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1560 Archive Collected Data
  subtechniques:
  - 'T1560.001 Archive Collected Data: Archive via Utility'
requirements:
  platforms:
  - os: darwin
args:
- name: source_directory
  description: Source directory containing collected data
  type: string
  default: /tmp
- name: archive_path
  description: Output path for archive
  type: string
  default: /tmp/collections_archive.tar.gz
- name: compression_level
  description: Compression level (1-9)
  type: integer
  default: 6
steps:
- name: Create archive directory
  inline: mkdir -p $(dirname "{{ .Args.archive_path }}")
- name: Archive using tar and gzip
  inline: |
    cd "{{ .Args.source_directory }}" && \
    tar -czf "{{ .Args.archive_path }}" \
      screen_captures/ \
      clipboard_data/ \
      camera_mic_access/ \
      keyboard_logs/ \
      app_data/ \
      mail_data/ \
      messages_data/ \
      slack_data/ \
      browser_history/ \
      dns_logs/ \
      2>/dev/null || echo "Archive created with available data"
- name: Verify archive integrity
  inline: tar -tzf "{{ .Args.archive_path }}" > /dev/null 2>&1 && echo "Archive integrity verified"
- name: Get archive statistics
  inline: |
    if [ -f "{{ .Args.archive_path }}" ]; then
      size=$(du -h "{{ .Args.archive_path }}" | cut -f1)
      count=$(tar -tzf "{{ .Args.archive_path }}" 2>/dev/null | wc -l)
      echo "Archive size: $size, Files: $count"
    fi
- name: Create archive manifest
  inline: |
    tar -tzf "{{ .Args.archive_path }}" > "$(dirname "{{ .Args.archive_path }}")/archive_manifest.txt" 2>/dev/null || echo "Manifest creation attempted"
- name: Calculate archive checksum
  inline: |
    if [ -f "{{ .Args.archive_path }}" ]; then
      md5sum "{{ .Args.archive_path }}" > "$(dirname "{{ .Args.archive_path }}")/archive.md5" 2>/dev/null || shasum -a 256 "{{ .Args.archive_path }}" > "$(dirname "{{ .Args.archive_path }}")/archive.sha256" 2>/dev/null || true
    fi
- name: Optional Create backup archive
  inline: |
    if [ -f "{{ .Args.archive_path }}" ]; then
      cp "{{ .Args.archive_path }}" "{{ .Args.archive_path }}.backup" 2>/dev/null || echo "Backup skipped"
    fi
  cleanup:
    inline: |-
      rm -f "{{ .Args.archive_path }}"
      rm -f "$(dirname "{{ .Args.archive_path }}")/archive_manifest.txt"
      rm -f "$(dirname "{{ .Args.archive_path }}")/archive.md5"
      rm -f "$(dirname "{{ .Args.archive_path }}")/archive.sha256"
      rm -f "$(dirname "{{ .Args.archive_path }}")/archive.md5.backup"

      test ! -f "{{ .Args.archive_path }}" && echo "Archive cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
