---
api_version: 2.0
uuid: 8f4e2a9c-1b3d-4e6f-a8b2-7c5d9e1f3a4b
name: Collect Screen Captures
authors:
- TTPForge
description: |
  Collect screenshots and screen recording artifacts from macOS system
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1113 Screen Capture
requirements:
  platforms:
  - os: darwin
args:
- name: screenshot_dir
  description: Directory to collect screenshots from
  type: string
  default: ~/Library/Caches/com.apple.bird
- name: output_path
  description: Output path for collected screenshots
  type: string
  default: /tmp/screen_captures
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Collect screenshot cache
  inline: find ~/Library/Caches -name "*.png" -o -name "*.jpg" 2>/dev/null | head -20
- name: Copy screenshot files
  inline: |
    if [ -d "{{ .Args.screenshot_dir }}" ]; then
      cp -r "{{ .Args.screenshot_dir }}" "{{ .Args.output_path }}/bird_cache" 2>/dev/null || true
    fi
- name: Collect macOS screen recordings
  inline: find ~/Library/Application\ Support -name "*.mov" -o -name "*.mp4" 2>/dev/null | head -10
- name: List collected items
  inline: ls -lah {{ .Args.output_path }}/ 2>/dev/null || echo "No items collected"
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
