---
api_version: 2.0
uuid: 64ad1c20-8fd6-42c8-b71e-9902b2e1f95c
name: Ransom Note Display
authors:
- TTPForge
description: |
  Displays ransom-style message to user simulating ransomware impact
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1491 Defacement
requirements:
  platforms:
  - os: darwin
  superuser: false
args:
- name: message
  description: Ransom note message to display
  type: string
  default: Your files have been encrypted
- name: title
  description: Dialog window title
  type: string
  default: ALERT
- name: persistent
  description: Keep dialog persistent and difficult to dismiss
  type: boolean
  default: false
steps:
- name: Create ransom note script
  inline: |-
    cat > ~/.ransom_note.sh << 'SCRIPT'
    #!/bin/bash
    osascript << 'AS'
    display alert "ALERT" message "Your files have been encrypted. Contact attackers@example.com. Payment required." buttons {"OK"} default button 1 with icon caution giving up after 600
    AS
    SCRIPT
- name: Make script executable
  inline: chmod +x ~/.ransom_note.sh
- name: Display alert dialog to current user
  inline: osascript -e 'display alert "ALERT" message "Your files have been encrypted" buttons {"OK"} default button 1 with
    icon caution' 2>/dev/null || true
- name: Log ransom event
  inline: 'logger ''TTP: Ransom note displayed to user'''
- name: Optionally set desktop background
  inline: defaults write com.apple.desktop Background '{default = {ImageFilePath = /Library/Desktop\ Pictures/Solid\ Colors/Black.png;}}'
    2>/dev/null || true
  cleanup:
    inline: |-
      rm -f ~/.ransom_note.sh
      killall osascript 2>/dev/null || true
      defaults delete com.apple.desktop Background 2>/dev/null || true
      test ! -f ~/.ransom_note.sh && echo 'Ransom note cleaned up'
tests:
- name: dry_run_test
  dry_run: true
