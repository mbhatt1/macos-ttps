---
api_version: 2.0
uuid: 27e379bb-767f-4585-bbab-8c7b65b5838e
name: Lock Screen
authors:
- TTPForge
description: |
  Locks the macOS screen to deny user access and force authentication
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1531 Account Access Removal
requirements:
  platforms:
  - os: darwin
  superuser: false
args:
- name: immediate
  description: Lock screen immediately without delay
  type: boolean
  default: true
- name: screensaver
  description: Use screensaver to lock instead of security option
  type: boolean
  default: false
steps:
- name: Enable screen lock via security preferences
  inline: defaults write com.apple.screensaver askForPassword -int 1
- name: Set password delay to immediate
  inline: defaults write com.apple.screensaver askForPasswordDelay -int 0
- name: Activate screensaver to lock screen
  inline: open -a ScreenSaverEngine
- name: Verify lock screen is active
  inline: ps aux | grep ScreenSaverEngine | grep -v grep
  cleanup:
    inline: |-
      killall ScreenSaverEngine 2>/dev/null || true
      defaults delete com.apple.screensaver askForPassword 2>/dev/null || true
      ps aux | grep ScreenSaverEngine | grep -v grep || echo "Screen unlocked"
tests:
- name: dry_run_test
  dry_run: true
