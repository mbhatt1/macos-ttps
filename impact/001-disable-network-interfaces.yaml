---
api_version: 2.0
uuid: a9eca8aa-0b00-41d2-936d-2674ded3a29d
name: Disable Network Interfaces
authors:
- TTPForge
description: |
  Disables all active network interfaces on macOS to simulate network isolation attack
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1529 System Shutdown/Reboot
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: interface
  description: Network interface to disable (e.g., en0, en1, all)
  type: string
  default: all
steps:
- name: Get list of active network interfaces
  inline: networksetup -listallhardwareports | grep Device
- name: Disable Wi-Fi
  inline: networksetup -setairportpower Wi-Fi off
- name: Disable Ethernet
  inline: networksetup -setnetworkserviceenabled Ethernet off
- name: Verify interfaces are down
  inline: ifconfig | grep -E "^[a-z]+" | head -5
  cleanup:
    inline: |-
      networksetup -setairportpower Wi-Fi on
      networksetup -setnetworkserviceenabled Ethernet on
      ifconfig en0 | grep -q "UP"
tests:
- name: dry_run_test
  dry_run: true
