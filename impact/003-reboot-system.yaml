---
api_version: 2.0
uuid: bbe69754-9866-457e-9467-b9a54b44bd72
name: Reboot System
authors:
- TTPForge
description: |
  Forces macOS system reboot to simulate denial of service and disrupt operations
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1529 System Shutdown/Reboot
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: delay
  description: Delay before reboot in seconds
  type: integer
  default: 30
- name: force
  description: Force immediate reboot without graceful shutdown
  type: boolean
  default: false
steps:
- name: Log reboot event
  inline: 'logger -s ''TTP: Initiating system reboot'''
- name: Schedule system reboot
  inline: reboot
- name: Verify reboot queued
  inline: sleep 1 && uptime
  cleanup:
    inline: |-
      uptime
      log show --predicate 'eventMessage contains[c] "reboot"' --last 5m 2>/dev/null || echo "Checking logs"
tests:
- name: dry_run_test
  dry_run: true
