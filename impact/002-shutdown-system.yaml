---
api_version: 2.0
uuid: c3a78908-e3d5-4014-a957-6c1e74ab19c9
name: Shutdown System
authors:
- TTPForge
description: |
  Gracefully shuts down the macOS system to simulate denial of service
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1529 System Shutdown/Reboot
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: delay
  description: Delay before shutdown in seconds
  type: integer
  default: 60
- name: message
  description: Message to display before shutdown
  type: string
  default: System will shutdown
steps:
- name: Log shutdown event
  inline: 'logger -s ''TTP: Initiating system shutdown'''
- name: Schedule system shutdown
  inline: shutdown -h +{{ .Args.delay }}
- name: Verify shutdown is scheduled
  inline: sleep 2 && ps aux | grep -i shutdown | grep -v grep
  cleanup:
    inline: |-
      shutdown -c
      ps aux | grep -i shutdown | grep -v grep || echo "Shutdown cancelled"
tests:
- name: dry_run_test
  dry_run: true
