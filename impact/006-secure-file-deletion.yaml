---
api_version: 2.0
uuid: 150eb3e3-81b3-461d-b8ad-b42280fcb7d4
name: Secure File Deletion
authors:
- TTPForge
description: |
  Securely deletes files using overwrite methods to prevent recovery
mitre:
  tactics:
  - TA0040 Impact
  techniques:
  - T1485 Data Destruction
requirements:
  platforms:
  - os: darwin
  superuser: true
args:
- name: target_path
  description: File or directory path to securely delete
  type: string
  default: ~/.temp_delete
- name: passes
  description: Number of overwrite passes (1-7)
  type: integer
  default: 3
- name: method
  description: Deletion method (srm, dd, shred)
  type: string
  default: srm
steps:
- name: Create test file for deletion
  inline: echo 'sensitive data to be destroyed' > ~/.temp_delete
- name: Verify file exists before deletion
  inline: test -f ~/.temp_delete && echo 'File exists'
- name: Secure delete with srm (Gutmann method)
  inline: srm -f -z ~/.temp_delete 2>/dev/null || rm -P ~/.temp_delete 2>/dev/null || true
- name: Verify file is deleted
  inline: test ! -f ~/.temp_delete && echo 'File securely deleted'
- name: Check filesystem for recovery
  inline: find ~ -name 'temp_delete*' 2>/dev/null || echo 'No recovery possible'
  cleanup:
    inline: |-
      rm -f ~/.temp_delete* 2>/dev/null || true
      test ! -f ~/.temp_delete && echo "Cleanup verified"
tests:
- name: dry_run_test
  dry_run: true
