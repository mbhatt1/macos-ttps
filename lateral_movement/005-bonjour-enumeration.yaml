---
api_version: 2.0
uuid: e5f6a7b8-c9da-7bce-e4f5-a6b7c8d9eafb
name: Bonjour Service Enumeration
authors:
  - TTPForge
description: |
  Enumerate Bonjour/mDNS services for network discovery and lateral movement.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1046 Network Service Discovery"

requirements:
  platforms:
    - os: darwin

args:
  - name: service_type
    description: "Bonjour service type to enumerate"
    type: string
    default: "_ssh._tcp"
  - name: broadcast_domain
    description: "Domain to search (local or specific domain)"
    type: string
    default: "local"
  - name: timeout
    description: "Enumeration timeout in seconds"
    type: string
    default: "5"

steps:
  - name: enumerate_ssh_services_via_bonjour
    description: Enumerate SSH services via Bonjour
    inline: |
      dns-sd -B {{ .Args.service_type }} {{ .Args.broadcast_domain }} | head -20 || echo 'Bonjour enumeration initiated'
    cleanup:
      inline: |
        echo "Bonjour enumeration step complete"
  - name: list_all_bonjour_services
    description: List all Bonjour services on network
    inline: |
      dns-sd -B _services._dns-sd._udp {{ .Args.broadcast_domain }} 2>/dev/null | grep -oE '_(\w+)\._\w+' | sort -u || echo 'Checking available services...'

tests:
  - name: dry_run_bonjour_enumeration
    dry_run: true
