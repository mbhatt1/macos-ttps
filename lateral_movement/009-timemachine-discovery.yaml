---
api_version: 2.0
uuid: c9daebf2-4de3-bf0f-c8d9-eafb0c1d2e3f
name: Time Machine Backup Discovery
authors:
  - TTPForge
description: |
  Discover and enumerate Time Machine backup destinations for data access.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1005 Data from Local System"

requirements:
  platforms:
    - os: darwin

args:
  - name: backup_host
    description: "Host IP address with Time Machine backups"
    type: string
    default: "192.168.1.250"
  - name: backup_port
    description: "AFP/SMB port for backup access"
    type: string
    default: "548"
  - name: backup_share
    description: "Backup share name"
    type: string
    default: "TimeMachineBackup"

steps:
  - name: enumerate_time_machine_backups_via_afp
    description: Enumerate Time Machine backups via AFP
    inline: |
      afp_client -h {{ .Args.backup_host }} -p {{ .Args.backup_port }} listshares 2>/dev/null || echo 'Time Machine backup enumeration initiated'
    cleanup:
      inline: |
        echo "Time Machine discovery step complete"
  - name: verify_afp_service_for_backups
    description: Verify AFP service for backups
    inline: |
      nc -w 2 {{ .Args.backup_host }} {{ .Args.backup_port }} < /dev/null && echo 'AFP port accessible' || echo 'AFP port not accessible'

tests:
  - name: dry_run_time_machine_backup_discovery
    dry_run: true
