---
api_version: 2.0
uuid: daebf3a3-fef4-c01a-d9ea-fb0c1d2e3f4a
name: Shared Volume Enumeration
authors:
  - TTPForge
description: |
  Enumerate mounted and accessible shared volumes for lateral movement and data discovery.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1135 Network Share Discovery"

requirements:
  platforms:
    - os: darwin

args:
  - name: enumerate_local
    description: "Enumerate locally mounted volumes"
    type: string
    default: "true"
  - name: enumerate_network
    description: "Enumerate network accessible volumes"
    type: string
    default: "true"
  - name: volume_type
    description: "Type of volumes to enumerate (afp, smb, nfs)"
    type: string
    default: "afp,smb"

steps:
  - name: list_mounted_volumes
    description: List mounted volumes
    inline: |
      mount | grep -E '(afp|smb|nfs)' || df -h | grep -v '^Filesystem'
    cleanup:
      inline: |
        echo "Shared volume enumeration step complete"
  - name: check_for_network_volumes
    description: Check for network volumes
    inline: |
      ls -la /Volumes 2>/dev/null | grep -v '^d' | tail -n +4 || echo 'Checking mounted volumes...'

tests:
  - name: dry_run_shared_volume_enumeration
    dry_run: true
