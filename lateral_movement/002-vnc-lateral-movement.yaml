---
api_version: 2.0
uuid: b2c3d4e5-f6a7-489b-b1c2-d3e4f5a6b7c8
name: VNC Lateral Movement to Neighboring Systems
authors:
  - TTPForge
description: |
  Establish VNC connections to neighboring macOS systems for lateral movement.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1021.005 Remote Services: VNC"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_host
    description: "Target host IP address or hostname for VNC connection"
    type: string
    default: "192.168.1.101"
  - name: vnc_port
    description: "VNC port on target host"
    type: string
    default: "5900"
  - name: vnc_password
    description: "VNC password for authentication"
    type: string
    default: "password123"
  - name: connection_timeout
    description: "Connection timeout in seconds"
    type: string
    default: "10"

steps:
  - name: check_vnc_service_availability
    description: Check VNC service availability on target host
    inline: |
      nc -w 2 {{ .Args.target_host }} {{ .Args.vnc_port }} < /dev/null && echo 'VNC port is open' || echo 'VNC port is closed'
    cleanup:
      inline: |
        echo "VNC lateral movement step complete"
  - name: verify_vnc_protocol_response
    description: Verify VNC protocol response from target
    inline: |
      echo '' | nc -w 3 {{ .Args.target_host }} {{ .Args.vnc_port }} | grep -q 'RFB' && echo 'VNC service detected' || echo 'VNC service not confirmed'

tests:
  - name: dry_run_vnc_connection_test
    dry_run: true
