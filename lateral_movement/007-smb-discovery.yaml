---
api_version: 2.0
uuid: a7b8c9da-ebf1-9de0-a6b7-c8d9eafb0c1d
name: Windows Share Discovery via SMB
authors:
  - TTPForge
description: |
  Discover and enumerate Windows shares accessible via SMB protocol.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1021.002 Remote Services: SMB/Windows Admin Shares"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_host
    description: "Windows/SMB host IP address"
    type: string
    default: "192.168.1.200"
  - name: smb_port
    description: "SMB port"
    type: string
    default: "445"
  - name: smb_user
    description: "SMB username"
    type: string
    default: "guest"
  - name: smb_password
    description: "SMB password"
    type: string
    default: ""

steps:
  - name: enumerate_smb_shares
    description: Enumerate SMB shares on target host
    inline: |
      smbclient -L {{ .Args.target_host }} -U {{ .Args.smb_user }} --no-pass 2>/dev/null | grep -E '^\s+' || echo 'SMB enumeration initiated'
    cleanup:
      inline: |
        echo "SMB discovery step complete"
  - name: verify_smb_service_accessibility
    description: Verify SMB service accessibility
    inline: |
      nc -w 2 {{ .Args.target_host }} {{ .Args.smb_port }} < /dev/null && echo 'SMB port open' || echo 'SMB port closed'

tests:
  - name: dry_run_smb_share_enumeration
    dry_run: true
