---
api_version: 2.0
uuid: f6a7b8c9-dae0-8cdf-f5a6-b7c8d9eafb0c
name: LDAP Directory Enumeration
authors:
  - TTPForge
description: |
  Enumerate LDAP directory services for network movement and credential discovery.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1018 Remote System Discovery"

requirements:
  platforms:
    - os: darwin

args:
  - name: ldap_server
    description: "LDAP server address"
    type: string
    default: "192.168.1.150"
  - name: ldap_port
    description: "LDAP server port"
    type: string
    default: "389"
  - name: base_dn
    description: "LDAP base distinguished name"
    type: string
    default: "dc=example,dc=com"
  - name: ldap_user
    description: "LDAP bind user"
    type: string
    default: "cn=admin,dc=example,dc=com"

steps:
  - name: query_ldap_directory
    description: Query LDAP directory for entries
    inline: |
      ldapsearch -h {{ .Args.ldap_server }} -p {{ .Args.ldap_port }} -b '{{ .Args.base_dn }}' -x 'objectClass=*' 2>/dev/null | head -50 || echo 'LDAP query initiated'
    cleanup:
      inline: |
        echo "LDAP enumeration step complete"
  - name: verify_ldap_service_connectivity
    description: Verify LDAP service connectivity
    inline: |
      nc -w 2 {{ .Args.ldap_server }} {{ .Args.ldap_port }} < /dev/null && echo 'LDAP port open' || echo 'LDAP port closed'

tests:
  - name: dry_run_ldap_enumeration
    dry_run: true
