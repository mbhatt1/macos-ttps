---
api_version: 2.0
uuid: c3d4e5f6-a7b8-59ac-c2d3-e4f5a6b7c8d9
name: Apple Remote Desktop (ARD) Lateral Movement
authors:
  - TTPForge
description: |
  Utilize ARD protocol for lateral movement to macOS systems.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1021.001 Remote Services: Remote Desktop Protocol"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_host
    description: "Target macOS host IP address or hostname"
    type: string
    default: "192.168.1.102"
  - name: ard_port
    description: "ARD listening port"
    type: string
    default: "5900"
  - name: ard_username
    description: "ARD username for authentication"
    type: string
    default: "admin"
  - name: ard_password
    description: "ARD password for authentication"
    type: string
    default: "changeme"

steps:
  - name: enumerate_ard_service
    description: Enumerate ARD service on target host
    inline: |
      nc -w 2 {{ .Args.target_host }} {{ .Args.ard_port }} < /dev/null && echo 'ARD port accessible' || echo 'ARD port not accessible'
    cleanup:
      inline: |
        echo "ARD lateral movement step complete"
  - name: verify_ard_daemon
    description: Verify ARD daemon is running on target
    inline: |
      echo '[CHECK] Scanning for ARD service on {{ .Args.target_host }}' && timeout 5 bash -c 'exec 3<>/dev/tcp/{{ .Args.target_host }}/{{ .Args.ard_port }}; echo "" >&3; cat <&3' 2>/dev/null | head -1

tests:
  - name: dry_run_ard_connection
    dry_run: true
