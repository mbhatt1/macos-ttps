---
api_version: 2.0
uuid: d4e5f6a7-b8c9-6abd-d3e4-f5a6b7c8d9ea
name: Wake-on-LAN for System Discovery
authors:
  - TTPForge
description: |
  Use Wake-on-LAN (WOL) to wake up and identify macOS systems on the network.

mitre:
  tactics:
    - "TA0008 Lateral Movement"
  techniques:
    - "T1018 Remote System Discovery"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_mac_address
    description: "MAC address of target system to wake"
    type: string
    default: "aa:bb:cc:dd:ee:ff"
  - name: broadcast_address
    description: "Broadcast address for WOL packet"
    type: string
    default: "192.168.1.255"
  - name: target_subnet
    description: "Network subnet for WOL broadcast"
    type: string
    default: "192.168.1.0/24"
  - name: wol_port
    description: "Port for WOL (typically 7 or 9)"
    type: string
    default: "9"

steps:
  - name: generate_wol_magic_packet
    description: Generate WOL magic packet for target MAC address
    inline: |
      echo '[INFO] Generating WOL magic packet for {{ .Args.target_mac_address }}' && python3 -c "import socket; mac = '{{ .Args.target_mac_address }}'.replace(':', ''); packet = b'\xff' * 6 + bytes.fromhex(mac) * 16; print(f'Magic packet generated: {len(packet)} bytes')"
    cleanup:
      inline: |
        echo "WOL discovery step complete"
  - name: verify_network_connectivity
    description: Verify network connectivity to broadcast address
    inline: |
      ping -c 1 -W 1 {{ .Args.broadcast_address }} 2>/dev/null && echo 'Broadcast address reachable' || echo 'Broadcast address not reachable'

tests:
  - name: dry_run_wol_magic_packet
    dry_run: true
