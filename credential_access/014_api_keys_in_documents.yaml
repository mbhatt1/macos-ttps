---
api_version: 2.0
uuid: 76df138a-3141-405c-943e-a8d1d8f701b0
name: API Keys in Documents
authors:
- TTPForge
description: |
  Search for API keys and credentials in common document locations
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1552 Unsecured Credentials
  subtechniques:
  - 'T1552.001 Unsecured Credentials: Credentials In Files'
requirements:
  platforms:
  - os: darwin
args:
- name: search_dirs
  description: Directories to search for API keys
  type: string
  default: ~/Documents:~/Downloads:~/.config
- name: output_file
  description: File to store found API keys
  type: string
  default: /tmp/api_keys_found.txt
steps:
- name: Search Documents for API Keys
  inline: grep -r 'api[_-]?key\|api[_-]?secret\|token\|password' ~/Documents 2>/dev/null | grep -E '\.json|\.yaml|\.conf|\.txt'
    | head -20 || echo 'Search complete'
- name: Search Download Folder
  inline: find ~/Downloads -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.env' \) 2>/dev/null | head -10
- name: Check for .env Files
  inline: find ~ -maxdepth 3 -name '.env*' 2>/dev/null | head -10 || echo 'No .env files found'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
