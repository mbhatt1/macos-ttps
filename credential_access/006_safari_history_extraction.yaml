---
api_version: 2.0
uuid: 2430d6d1-300d-4535-94c4-ae184bb42a2c
name: Safari History Extraction
authors:
- TTPForge
description: |
  Extract browsing history from Safari application
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1217 Browser Information Discovery
requirements:
  platforms:
  - os: darwin
args:
- name: output_file
  description: File to store extracted history
  type: string
  default: /tmp/safari_history.txt
- name: limit
  description: Maximum number of history items to extract
  type: string
  default: '100'
steps:
- name: Check Safari Database
  inline: test -f ~/Library/Safari/History.db && echo 'Safari history found'
- name: Extract Safari History
  inline: sqlite3 ~/Library/Safari/History.db 'SELECT url, title, last_visited_time FROM history_items ORDER BY last_visited_time
    DESC LIMIT {{ .Args.limit }};' 2>/dev/null
- name: Save to File
  inline: sqlite3 ~/Library/Safari/History.db 'SELECT url, title, last_visited_time FROM history_items ORDER BY last_visited_time
    DESC LIMIT {{ .Args.limit }};' > {{ .Args.output_file }} 2>/dev/null || true
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
