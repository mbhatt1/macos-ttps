---
api_version: 2.0
uuid: 2d976792-ac5d-4287-8938-ae914a4ffcdd
name: Export Certificates from Keychain
authors:
- TTPForge
description: |
  Export certificates and keys from macOS keychain
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1552 Unsecured Credentials
requirements:
  platforms:
  - os: darwin
args:
- name: output_dir
  description: Directory to store exported certificates
  type: string
  default: /tmp/cert_export
- name: certificate_name
  description: Specific certificate to export (optional)
  type: string
  default: ''
steps:
- name: Create Export Directory
  inline: mkdir -p {{ .Args.output_dir }}
- name: List Certificates
  inline: security find-certificate -a -p login.keychain-db 2>/dev/null | head -50
- name: Export Certificate Identity
  inline: security find-identity -p codesigning login.keychain-db 2>/dev/null
  cleanup:
    inline: rm -rf {{ .Args.output_dir }}
tests:
- name: dry_run_test
  dry_run: true
