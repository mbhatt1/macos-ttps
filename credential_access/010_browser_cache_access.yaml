---
api_version: 2.0
uuid: cf23316d-9cc9-4fc2-99f7-c442cfe4929e
name: Browser Cache Access
authors:
- TTPForge
description: |
  Access and extract data from browser cache files
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1005 Data from Local System
requirements:
  platforms:
  - os: darwin
args:
- name: output_dir
  description: Directory to store extracted cache
  type: string
  default: /tmp/browser_cache
- name: browser
  description: Browser to target (safari, chrome, firefox)
  type: string
  default: safari
steps:
- name: Create Output Directory
  inline: mkdir -p {{ .Args.output_dir }}
- name: Extract Safari Cache
  inline: cp -r ~/Library/Safari/LocalStorage {{ .Args.output_dir }}/safari_storage 2>/dev/null || true
- name: Extract Chrome Cache
  inline: cp -r ~/Library/Application\ Support/Google/Chrome/Default/Cache {{ .Args.output_dir }}/chrome_cache 2>/dev/null
    || true
- name: List Cache Files
  inline: find {{ .Args.output_dir }} -type f 2>/dev/null | head -20
  cleanup:
    inline: rm -rf {{ .Args.output_dir }}
tests:
- name: dry_run_test
  dry_run: true
