---
api_version: 2.0
uuid: 5890ac32-cdc1-4559-9e0a-e52a1473ae5d
name: Enumerate Keychain Items
authors:
- TTPForge
description: |
  Enumerate all items stored in macOS keychain databases
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1555 Credentials from Password Stores
  subtechniques:
  - 'T1555.001 Credentials from Password Stores: Keychain'
requirements:
  platforms:
  - os: darwin
args:
- name: keychain_db
  description: Keychain database to enumerate
  type: string
  default: login.keychain-db
steps:
- name: List All Keychains
  inline: security list-keychains
- name: Enumerate Generic Passwords
  inline: security dump-keychain -d {{ .Args.keychain_db }} 2>/dev/null | grep -E 'class|labl|acct' | head -50
- name: Count Keychain Items
  inline: security dump-keychain -d {{ .Args.keychain_db }} 2>/dev/null | grep -c 'class'
tests:
- name: dry_run_test
  dry_run: true
