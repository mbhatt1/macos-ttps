---
api_version: 2.0
uuid: 8532a19e-f107-48f1-8f73-1a451ab140bd
name: Safari Bookmarks Extraction
authors:
- TTPForge
description: |
  Extract bookmarks from Safari application
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1217 Browser Information Discovery
requirements:
  platforms:
  - os: darwin
args:
- name: output_file
  description: File to store extracted bookmarks
  type: string
  default: /tmp/safari_bookmarks.plist
steps:
- name: Check Safari Bookmarks
  inline: test -f ~/Library/Safari/Bookmarks.plist && echo 'Safari bookmarks found'
- name: Copy Bookmarks File
  inline: cp ~/Library/Safari/Bookmarks.plist {{ .Args.output_file }} 2>/dev/null || true
- name: Extract Bookmark URLs
  inline: plutil -extract 'Children' raw ~/Library/Safari/Bookmarks.plist 2>/dev/null || echo 'Bookmarks extracted'
  cleanup:
    inline: rm -f {{ .Args.output_file }}
tests:
- name: dry_run_test
  dry_run: true
