---
api_version: 2.0
uuid: 9caca395-2df8-4c6e-a27c-0792803965b1
name: Enumerate macOS System Preferences and Configuration
authors:
  - security_team
description: |
  Retrieve system preferences, security settings, firewall configuration, and system
  defaults to assess security posture.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1082 System Information Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get Firewall Status
    inline: |
      defaults read /Library/Preferences/com.apple.alf globalstate 2>/dev/null || echo "Firewall status unavailable"
  - name: Get Screen Lock Status
    inline: |
      defaults read com.apple.screensaver askForPassword 2>/dev/null || echo "Screen lock status unavailable"
  - name: Get System Hostname
    inline: |
      scutil --get ComputerName && scutil --get HostName && scutil --get LocalHostName
  - name: Get Time Zone
    inline: |
      systemsetup -gettimezone
  - name: Get Software Update Info
    inline: |
      softwareupdate -l 2>/dev/null | head -10 || echo "Update info unavailable"
  - name: Get System Language
    inline: |
      defaults read NSGlobalDomain AppleLanguages 2>/dev/null || echo "Language info unavailable"
  - name: Get Bluetooth Status
    inline: |
      defaults read /Library/Preferences/com.apple.Bluetooth 2>/dev/null | grep -i "Enabled" || echo "Bluetooth info unavailable"
tests:
  - name: dry_run
    dry_run: true
