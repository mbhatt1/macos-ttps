---
api_version: 2.0
uuid: 6f93d16e-242a-4191-85f3-3e52702824ff
name: Enumerate macOS Users and Accounts
authors:
  - security_team
description: |
  Identify all local user accounts, their UIDs, home directories, and shell assignments
  on the system.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1087 Account Discovery"
  subtechniques:
    - "T1087.001 Account Discovery: Local Account"
requirements:
  platforms:
    - os: darwin
steps:
  - name: List All Users
    inline: |
      dscl . list /Users
  - name: Get User Information
    inline: |
      dscl . readall /Users UserID RealName
  - name: List Users with UID
    inline: |
      dscl . list /Users UniqueID
  - name: Get User Shells
    inline: |
      dscl . list /Users UserShell
  - name: Get User Home Directories
    inline: |
      dscl . list /Users NFSHomeDirectory
tests:
  - name: dry_run
    dry_run: true
