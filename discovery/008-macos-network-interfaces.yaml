---
api_version: 2.0
uuid: 2cf56f09-602a-4646-93e7-474492ecb982
name: Enumerate macOS Network Interfaces and Configuration
authors:
  - security_team
description: |
  Identify all network interfaces, IP addresses, MAC addresses, and their configuration
  to assess network connectivity.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1016 System Network Configuration Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: List Network Interfaces
    inline: |
      ifconfig
  - name: Get Interface Status
    inline: |
      networksetup -listallhardwareports
  - name: Get IPv4 Configuration
    inline: |
      ifconfig | grep -E "inet |inet6" | grep -v "127.0.0.1"
  - name: Get Mac Addresses
    inline: |
      ifconfig | grep -E "ether|lladdr"
  - name: Get Network Services
    inline: |
      networksetup -listallnetworkservices
tests:
  - name: dry_run
    dry_run: true
