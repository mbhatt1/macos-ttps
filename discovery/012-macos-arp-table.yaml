---
api_version: 2.0
uuid: 3a610404-e268-4645-94aa-36f76c28a1cc
name: Enumerate macOS ARP Table
authors:
  - security_team
description: |
  Retrieve Address Resolution Protocol table to identify MAC address to IP address
  mappings on the local network.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1016 System Network Configuration Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get ARP Table
    inline: |
      arp -a
  - name: Get ARP Entries
    inline: |
      arp -n
  - name: Show ARP Statistics
    inline: |
      netstat -na | grep ESTABLISHED | head -10
  - name: Get Network Neighbors
    inline: |
      ndp -a 2>/dev/null || echo "No IPv6 neighbors"
  - name: Check Duplicate ARP
    inline: |
      arp -a | sort -k3 | uniq -d
tests:
  - name: dry_run
    dry_run: true
