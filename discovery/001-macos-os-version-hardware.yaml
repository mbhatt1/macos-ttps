---
api_version: 2.0
uuid: fd4035a0-ee61-4ee4-b519-94035c880acc
name: Gather macOS OS Version and Hardware Information
authors:
  - security_team
description: |
  Retrieve detailed OS version and hardware information from the system including
  system model, serial number, and hardware overview.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1082 System Information Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get OS Version
    inline: |
      system_profiler SPSoftwareDataType
  - name: Get Hardware Overview
    inline: |
      system_profiler SPHardwareDataType
  - name: Get Model Identifier
    inline: |
      sysctl hw.model
  - name: Get Serial Number
    inline: |
      system_profiler SPHardwareDataType | grep "Serial Number"
  - name: Verify OS Version
    inline: |
      sw_vers -productVersion
  - name: Verify System Model
    inline: |
      sysctl hw.model
tests:
  - name: dry_run
    dry_run: true
