---
api_version: 2.0
uuid: 1d6b557b-9879-4a6e-ab7f-f7437c3ce34d
name: Gather macOS CPU and Memory Information
authors:
  - security_team
description: |
  Retrieve CPU core count, memory capacity, and processor information to understand
  system computational resources.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1082 System Information Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get CPU Information
    inline: |
      system_profiler SPHardwareDataType | grep -E "Processor|Core|Memory"
  - name: Get CPU Count
    inline: |
      sysctl -n hw.ncpu
  - name: Get Physical Memory
    inline: |
      sysctl -n hw.memsize | awk '{printf "%.2f GB\n", $1/1024/1024/1024}'
  - name: Get CPU Frequency
    inline: |
      sysctl -n hw.cpufrequency_max | awk '{printf "%.2f GHz\n", $1/1000000000}'
  - name: Get Memory Stats
    inline: |
      vm_stat | head -20
tests:
  - name: dry_run
    dry_run: true
