---
api_version: 2.0
uuid: 1646f54a-92e4-495b-87ba-979adc2284ac
name: Enumerate macOS Network Routing Table
authors:
  - security_team
description: |
  Retrieve the system routing table to understand network path configuration
  and gateway setup.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1016 System Network Configuration Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get Routing Table
    inline: |
      netstat -rn
  - name: Get IPv4 Routes
    inline: |
      netstat -rn -f inet
  - name: Get IPv6 Routes
    inline: |
      netstat -rn -f inet6
  - name: Get Default Gateway
    inline: |
      netstat -rn | grep default
  - name: Get Route Details
    inline: |
      route -n show
tests:
  - name: dry_run
    dry_run: true
