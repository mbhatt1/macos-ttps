---
api_version: 2.0
uuid: a8e656a4-78cc-4794-818a-5c3936ab0330
name: Gather macOS Disk Usage and Storage Information
authors:
  - security_team
description: |
  Enumerate mounted filesystems, disk space usage, and storage capacity to assess
  available disk resources.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1082 System Information Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get Disk Space Usage
    inline: |
      df -h
  - name: Get Storage Information
    inline: |
      system_profiler SPStorageDataType
  - name: List Mounted Volumes
    inline: |
      mount | grep -v "^/dev/null"
  - name: Get Disk Partition Info
    inline: |
      diskutil list
  - name: Get SMART Status
    inline: |
      diskutil info / | grep -E "Connection|Device Block Size"
tests:
  - name: dry_run
    dry_run: true
