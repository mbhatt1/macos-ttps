---
api_version: 2.0
uuid: 892a6195-9d22-476d-afb0-e5a2829d2ee0
name: Enumerate macOS DNS Configuration
authors:
  - security_team
description: |
  Retrieve DNS resolver configuration, nameservers, and DNS search domains to
  understand name resolution setup.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1016 System Network Configuration Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get DNS Configuration
    inline: |
      cat /etc/resolv.conf
  - name: Get DNS Servers
    inline: |
      networksetup -getdnsservers Wi-Fi 2>/dev/null || echo "Wi-Fi DNS not available"
  - name: Get Search Domains
    inline: |
      networksetup -getsearchdomains Wi-Fi 2>/dev/null || echo "Search domains not available"
  - name: Get All Network DNS
    inline: |
      networksetup -listallnetworkservices | grep -v "asterisk" | while read service; do echo "=== $service ==="; networksetup -getdnsservers "$service" 2>/dev/null; done
  - name: Check mDNS Configuration
    inline: |
      cat /etc/hosts | head -10
tests:
  - name: dry_run
    dry_run: true
