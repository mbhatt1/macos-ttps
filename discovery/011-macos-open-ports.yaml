---
api_version: 2.0
uuid: 0d5bd9c0-4caf-4be7-a201-3278f3e2b143
name: Enumerate macOS Open Ports and Network Listeners
authors:
  - security_team
description: |
  Identify all listening network ports, bound addresses, and associated processes
  to detect active network services.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1049 System Network Connections Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get Listening TCP Ports
    inline: |
      netstat -tlnp
  - name: Get Listening UDP Ports
    inline: |
      netstat -ulmn
  - name: Get All Listening Sockets
    inline: |
      netstat -an | grep LISTEN
  - name: Get Process to Port Mapping
    inline: |
      lsof -iTCP -sTCP:LISTEN -P -n
  - name: Get UDP Listeners
    inline: |
      lsof -iUDP -P -n
tests:
  - name: dry_run
    dry_run: true
