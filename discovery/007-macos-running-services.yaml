---
api_version: 2.0
uuid: 8193dadd-71e9-46a7-bbee-b05e0c0a533e
name: Enumerate macOS Running Services and Daemons
authors:
  - security_team
description: |
  Identify all running system services, daemons, and launchd agents to understand
  system service configuration and startup behavior.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1007 System Service Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: List Launch Daemons
    inline: |
      launchctl list
  - name: Get System Services
    inline: |
      launchctl list | grep -v "^-" | head -20
  - name: List LaunchAgents
    inline: |
      ls -la /Library/LaunchAgents/
  - name: List System LaunchDaemons
    inline: |
      ls -la /Library/LaunchDaemons/
  - name: Check User LaunchAgents
    inline: |
      ls -la ~/Library/LaunchAgents/ 2>/dev/null || echo "No user launch agents"
tests:
  - name: dry_run
    dry_run: true
