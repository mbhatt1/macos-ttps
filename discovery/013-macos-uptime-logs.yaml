---
api_version: 2.0
uuid: 92170b52-d293-4845-81a3-802d1ebddde7
name: Gather macOS System Uptime and System Logs
authors:
  - security_team
description: |
  Retrieve system uptime, boot time, and recent system logs to understand system
  stability and activity.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1082 System Information Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get System Uptime
    inline: |
      uptime
  - name: Get Boot Time
    inline: |
      sysctl -n kern.boottime
  - name: Get Last Boot Records
    inline: |
      log show --predicate 'eventMessage contains[cd] "boot"' --last 7d 2>/dev/null | head -20 || last -1 reboot | head -5
  - name: Get System Log Entries
    inline: |
      log show --predicate 'level == "Error"' --last 1h 2>/dev/null | head -20 || cat /var/log/system.log | tail -20
  - name: Check Crash Reports
    inline: |
      ls -la ~/Library/Logs/DiagnosticMessages/ 2>/dev/null | head -10 || echo "No diagnostic messages"
tests:
  - name: dry_run
    dry_run: true
