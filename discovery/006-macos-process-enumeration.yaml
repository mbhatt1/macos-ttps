---
api_version: 2.0
uuid: 64d0fdbc-3f41-470d-b71a-15a8e1683fc8
name: Enumerate macOS Running Processes
authors:
  - security_team
description: |
  List all currently running processes including process IDs, parent process IDs,
  resource usage, and command line arguments.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1057 Process Discovery"
requirements:
  platforms:
    - os: darwin
steps:
  - name: Get All Running Processes
    inline: |
      ps aux
  - name: Get Process Tree
    inline: |
      ps -ef
  - name: Get Process Count
    inline: |
      ps aux | wc -l
  - name: Get High Memory Processes
    inline: |
      ps aux | sort -k4 -rn | head -10
  - name: Get High CPU Processes
    inline: |
      ps aux | sort -k3 -rn | head -10
tests:
  - name: dry_run
    dry_run: true
