---
api_version: 2.0
uuid: e7bf6771-e20f-4bf7-b5ed-51045772f4bd
name: Enumerate macOS Groups and Group Memberships
authors:
  - security_team
description: |
  Retrieve all local groups, their GIDs, and group membership information to understand
  system access control structure.
mitre:
  tactics:
    - "TA0007 Discovery"
  techniques:
    - "T1069 Permission Groups Discovery"
  subtechniques:
    - "T1069.001 Permission Groups Discovery: Local Groups"
requirements:
  platforms:
    - os: darwin
steps:
  - name: List All Groups
    inline: |
      dscl . list /Groups
  - name: Get Group Information
    inline: |
      dscl . readall /Groups GroupID
  - name: Get Group Members
    inline: |
      dscl . readall /Groups GroupMembership
  - name: Get Admin Group Members
    inline: |
      dscl . read /Groups/admin GroupMembership
  - name: Get Wheel Group Members
    inline: |
      dscl . read /Groups/wheel GroupMembership
tests:
  - name: dry_run
    dry_run: true
