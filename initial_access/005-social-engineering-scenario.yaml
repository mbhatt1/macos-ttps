---
api_version: 2.0
uuid: 1a5f3b8c-9e2d-4f7a-6c1b-3e5d8a2f4c9b
name: Social Engineering Scenario
authors:
  - mbhatt
description: |
  Demonstrates social engineering scenario execution by simulating multi-stage
  manipulation tactics including pretexting, authority impersonation, and
  creating false urgency to manipulate targets into revealing sensitive information.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.004 Phishing: Spearphishing Voice"

requirements:
  platforms:
    - os: darwin

args:
  - name: attacker_persona
    description: "Fictional persona used for impersonation"
    type: string
    default: "John Smith, IT Support Manager"
  - name: target_department
    description: "Department being targeted"
    type: string
    default: "Finance"
  - name: urgency_reason
    description: "Reason for urgent action"
    type: string
    default: "Security audit"
  - name: pretext_story
    description: "Cover story for the request"
    type: string
    default: "We are updating security protocols and need to verify accounts"

steps:
  - name: create_social_engineering_script
    description: Create social engineering engagement script
    inline: |
      mkdir -p /tmp/se_scenarios
      cat > /tmp/se_scenarios/engagement_script.txt << 'SCRIPTEOF'
      SOCIAL ENGINEERING SCENARIO
      ATTACKER PERSONA: {{ attacker_persona }}
      TARGET: {{ target_department }} Department
      OBJECTIVE: Credential harvesting and information disclosure
      PHASE 1: INITIAL CONTACT
      PHASE 2: PRETEXT ESTABLISHMENT - {{ pretext_story }}
      PHASE 3: INFORMATION EXTRACTION
      PHASE 4: CREDENTIAL HARVESTING
      SCRIPTEOF
      echo "Created social engineering script"
    cleanup:
      inline: |
        rm -rf /tmp/se_scenarios

  - name: create_engagement_timeline
    description: Create engagement timeline
    inline: |
      cat > /tmp/se_scenarios/engagement_timeline.txt << 'TIMELINEEOF'
      ENGAGEMENT TIMELINE
      T+0:00 - Initial contact established
      T+0:05 - Pretext story introduced: {{ pretext_story }}
      T+0:08 - Urgency emphasized: {{ urgency_reason }}
      T+0:15 - Request for username
      T+0:18 - Request for password verification
      T+0:25 - Credential confirmation
      T+0:30 - Conversation termination
      TIMELINEEOF
      echo "Created engagement timeline"

  - name: document_attacker_techniques
    description: Document attacker techniques used
    inline: |
      cat > /tmp/se_scenarios/techniques_used.txt << 'TECHEOF'
      SOCIAL ENGINEERING TECHNIQUES EMPLOYED
      1. AUTHORITY IMPERSONATION
      2. URGENCY CREATION
      3. TRUST BUILDING
      4. INFORMATION EXTRACTION
      5. PRETEXTING
      TECHEOF
      echo "Documented techniques"

  - name: log_scenario_execution
    description: Log scenario execution details
    inline: |
      mkdir -p /tmp/se_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/se_logs/scenario_${timestamp}.log << 'LOGEOF'
      Social Engineering Scenario Executed
      Attacker Persona: {{ attacker_persona }}
      Target Department: {{ target_department }}
      Pretext: {{ pretext_story }}
      Urgency Factor: {{ urgency_reason }}
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/se_logs

  - name: verify_scenario_script_created
    description: Verify engagement script was created
    inline: |
      test -f /tmp/se_scenarios/engagement_script.txt && echo "PASS: Engagement script created"

  - name: verify_timeline_created
    description: Verify engagement timeline was created
    inline: |
      test -f /tmp/se_scenarios/engagement_timeline.txt && echo "PASS: Engagement timeline created"

  - name: verify_techniques_documented
    description: Verify techniques were documented
    inline: |
      test -f /tmp/se_scenarios/techniques_used.txt && echo "PASS: Techniques documented"

tests:
  - name: social_engineering_scenario_test
    dry_run: true
