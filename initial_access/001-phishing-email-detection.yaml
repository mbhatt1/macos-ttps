---
api_version: 2.0
uuid: 69c4df6c-8e3b-4f2a-9b1c-7e5d2f4a8c3b
name: Phishing Email Detection
authors:
  - mbhatt
description: |
  Creates and stages a phishing email in Mail.app with spearphishing characteristics
  including a spoofed sender address, urgency-based subject line, and a suspicious
  link. Uses osascript to interact with Mail.app to compose a draft email that
  can be inspected for phishing indicators.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: attacker_email
    description: "Spoofed sender email address"
    type: string
    default: "security-alert@paypa1.com"
  - name: target_user
    description: "Target user email address"
    type: string
    default: "user@company.com"
  - name: phishing_link
    description: "Suspicious link in phishing email"
    type: string
    default: "https://secure-verify-account.malicious-domain.com/login"

steps:
  - name: create_phishing_email_content
    description: Create phishing email body with suspicious characteristics
    inline: |
      mkdir -p /tmp/ttp_phishing
      cat > /tmp/ttp_phishing/email_body.txt << 'EOF'
      URGENT: Your account has been flagged for suspicious activity.

      Dear Customer,

      We have detected unauthorized access to your account. Your account will be
      suspended within 24 hours unless you verify your identity immediately.

      Click here to verify: {{ .Args.phishing_link }}

      If you do not verify within 24 hours, your account will be permanently locked.

      Regards,
      Security Team
      EOF
      echo "[+] Phishing email content created at /tmp/ttp_phishing/email_body.txt"
      cat /tmp/ttp_phishing/email_body.txt

  - name: compose_email_in_mail_app
    description: Use osascript to create a draft phishing email in Mail.app
    inline: |
      EMAIL_BODY=$(cat /tmp/ttp_phishing/email_body.txt)
      osascript << APPLESCRIPT
      tell application "Mail"
        set newMessage to make new outgoing message with properties {subject:"URGENT: Verify Your Account Immediately - Suspicious Activity Detected", content:"${EMAIL_BODY}", visible:true}
        tell newMessage
          make new to recipient at end of to recipients with properties {address:"{{ .Args.target_user }}"}
        end tell
      end tell
      APPLESCRIPT
      echo "[+] Phishing email draft created in Mail.app"

  - name: verify_email_created_in_mail
    description: Verify the email draft was created in Mail.app
    inline: |
      RESULT=$(osascript -e 'tell application "Mail" to get subject of every outgoing message')
      echo "[+] Current Mail.app outgoing messages: ${RESULT}"
      echo "${RESULT}" | grep -q "URGENT" && echo "[+] PASS: Phishing email draft found in Mail.app"

  - name: inspect_email_properties
    description: Inspect the phishing email properties for indicators
    inline: |
      osascript << 'APPLESCRIPT'
      tell application "Mail"
        set msgList to every outgoing message
        repeat with msg in msgList
          if subject of msg contains "URGENT" then
            log "Subject: " & subject of msg
            log "Content preview: " & (text 1 thru 200 of content of msg)
            log "Recipient: " & (address of to recipient 1 of msg)
          end if
        end repeat
      end tell
      APPLESCRIPT
      echo "[+] Email properties inspected for phishing indicators"
    cleanup:
      inline: |
        osascript << 'APPLESCRIPT'
        tell application "Mail"
          set msgList to every outgoing message
          repeat with msg in msgList
            if subject of msg contains "URGENT: Verify Your Account" then
              delete msg
            end if
          end repeat
        end tell
        APPLESCRIPT
        rm -rf /tmp/ttp_phishing
        echo "[+] Cleanup: Draft email deleted and temp files removed"

tests:
  - name: phishing_email_detection_test
    dry_run: true
