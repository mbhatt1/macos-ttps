---
api_version: 2.0
uuid: 4d8e6c1f-7a3b-5e0c-9f2d-3a6b7c1e4f2a
name: Pretexting Phone Calls
authors:
  - mbhatt
description: |
  Demonstrates pretexting phone call execution where attackers use false pretenses
  to manipulate victims into divulging sensitive information. Includes caller ID
  spoofing, script development, and social engineering tactics.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.004 Phishing: Spearphishing Voice"

requirements:
  platforms:
    - os: darwin

args:
  - name: attacker_role
    description: "False role assumed by attacker"
    type: string
    default: "IT Support Technician"
  - name: company_name
    description: "Company being impersonated"
    type: string
    default: "ABC Technology Solutions"
  - name: target_person
    description: "Target of the call"
    type: string
    default: "Robert Martinez, Systems Administrator"
  - name: spoofed_number
    description: "Caller ID number being spoofed"
    type: string
    default: "+1-555-XXX-HELP"

steps:
  - name: develop_pretexting_script
    description: Develop pretexting phone call script
    inline: |
      mkdir -p /tmp/pretexting
      cat > /tmp/pretexting/call_script.txt << 'SCRIPTEOF'
      PRETEXTING PHONE CALL SCRIPT
      ATTACKER ROLE: {{ attacker_role }}
      IMPERSONATED COMPANY: {{ company_name }}
      TARGET: {{ target_person }}
      CALLER ID: {{ spoofed_number }}
      OBJECTIVE: Credential harvesting and system access information
      SCRIPTEOF
      echo "Created pretexting call script"
    cleanup:
      inline: |
        rm -rf /tmp/pretexting

  - name: develop_recovery_tactics
    description: Develop recovery tactics for objection handling
    inline: |
      cat > /tmp/pretexting/recovery_tactics.txt << 'TACTICEOF'
      PRETEXTING RECOVERY TACTICS
      If Target Questions Authority: Provide spoofed callback number
      If Target Refuses Password: Offer password reset alternative
      If Target Becomes Suspicious: Acknowledge good security practice
      TACTICEOF
      echo "Created recovery tactics"

  - name: create_caller_id_spoofing_setup
    description: Create caller ID spoofing setup documentation
    inline: |
      cat > /tmp/pretexting/caller_id_setup.txt << 'SPOOFEOF'
      CALLER ID SPOOFING CONFIGURATION
      SPOOFED IDENTITY: {{ company_name }} IT Support
      SPOOFED NUMBER: {{ spoofed_number }}
      LEGAL NOTE: Caller ID spoofing is illegal in many jurisdictions
      This is for AUTHORIZED security testing and training only.
      SPOOFEOF
      echo "Created spoofing setup documentation"

  - name: create_call_tracking_log
    description: Create call tracking log
    inline: |
      mkdir -p /tmp/pretexting_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/pretexting_logs/call_log_${timestamp}.txt << 'LOGEOF'
      PRETEXTING CALL LOG
      Target: {{ target_person }}
      Attacker Role: {{ attacker_role }}
      Spoofed Company: {{ company_name }}
      Caller ID Used: {{ spoofed_number }}
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/pretexting_logs

  - name: verify_call_script_created
    description: Verify call script was created
    inline: |
      test -f /tmp/pretexting/call_script.txt && echo "PASS: Call script created"

  - name: verify_recovery_tactics_documented
    description: Verify recovery tactics were documented
    inline: |
      test -f /tmp/pretexting/recovery_tactics.txt && echo "PASS: Recovery tactics documented"

  - name: verify_spoofing_setup_documented
    description: Verify spoofing setup was documented
    inline: |
      test -f /tmp/pretexting/caller_id_setup.txt && echo "PASS: Spoofing setup documented"

tests:
  - name: pretexting_phone_calls_test
    dry_run: true
