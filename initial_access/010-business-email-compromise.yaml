---
api_version: 2.0
uuid: 6fa08e3b-9c5d-7f2a-1e4b-8d6c9f3e2a1b
name: Business Email Compromise
authors:
  - mbhatt
description: |
  Demonstrates Business Email Compromise (BEC) attack execution where attackers
  compromise or spoof executive emails to conduct fraud. Includes account takeover,
  email manipulation, and fraudulent transaction authorization.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.002 Phishing: Spearphishing Link"

requirements:
  platforms:
    - os: darwin

args:
  - name: compromised_email
    description: "Email account being compromised/spoofed"
    type: string
    default: "cfo@company.com"
  - name: compromised_person_name
    description: "Name of executive whose email is compromised"
    type: string
    default: "Patricia Anderson, Chief Financial Officer"
  - name: compromised_department
    description: "Department being impersonated"
    type: string
    default: "Finance/Accounting"
  - name: target_payment_processor
    description: "Target responsible for processing payments"
    type: string
    default: "accounts_payable@company.com"

steps:
  - name: create_account_compromise_scenario
    description: Create account compromise scenario and timeline
    inline: |
      mkdir -p /tmp/bec_attack
      cat > /tmp/bec_attack/compromise_timeline.txt << 'TIMELINEEOF'
      BUSINESS EMAIL COMPROMISE TIMELINE
      ATTACK OBJECTIVE: Fraudulent wire transfer and vendor redirection
      COMPROMISED ACCOUNT: {{ compromised_email }}
      EXECUTIVE: {{ compromised_person_name }}
      DAY 1: Initial account compromise via phishing
      DAY 2: Email account fortification with forwarding rules
      DAY 3: Surveillance and intelligence gathering
      DAY 4: Initial test transaction
      DAY 5-7: Larger fraudulent transactions
      DAY 8: Discovery and response
      TIMELINEEOF
      echo "Created compromise timeline"
    cleanup:
      inline: |
        rm -rf /tmp/bec_attack

  - name: create_bec_email_templates
    description: Create BEC email templates for fraud
    inline: |
      cat > /tmp/bec_attack/bec_email_templates.txt << 'EMAILEOF'
      BUSINESS EMAIL COMPROMISE EMAIL TEMPLATES
      TEMPLATE 1: URGENT PAYMENT REQUEST
      From: {{ compromised_email }}
      To: {{ target_payment_processor }}
      Subject: URGENT - Vendor Payment Required Today
      TEMPLATE 2: VENDOR ACCOUNT CHANGE
      TEMPLATE 3: EMERGENCY TRANSFER
      TEMPLATE 4: AUTHORIZATION OVERRIDE
      EMAILEOF
      echo "Created BEC email templates"

  - name: create_post_compromise_actions
    description: Create post-compromise actions documentation
    inline: |
      cat > /tmp/bec_attack/post_compromise_actions.txt << 'ACTIONSEOF'
      POST-COMPROMISE PERSISTENCE AND EXPLOITATION
      PHASE 1: Account Fortification
      PHASE 2: Intelligence Gathering
      PHASE 3: Fraudulent Transaction Execution
      PHASE 4: Covering Tracks
      ACTIONSEOF
      echo "Created post-compromise actions"

  - name: create_incident_response_log
    description: Create incident response log
    inline: |
      mkdir -p /tmp/bec_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/bec_logs/incident_${timestamp}.log << 'LOGEOF'
      BUSINESS EMAIL COMPROMISE INCIDENT LOG
      Target Account: {{ compromised_email }}
      Target Executive: {{ compromised_person_name }}
      Attack Type: Account Compromise and Fraud
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/bec_logs

  - name: verify_bec_timeline_created
    description: Verify BEC timeline was created
    inline: |
      test -f /tmp/bec_attack/compromise_timeline.txt && echo "PASS: BEC timeline created"

  - name: verify_email_templates_created
    description: Verify email templates were created
    inline: |
      test -f /tmp/bec_attack/bec_email_templates.txt && echo "PASS: Email templates created"

  - name: verify_post_compromise_actions_documented
    description: Verify post-compromise actions were documented
    inline: |
      test -f /tmp/bec_attack/post_compromise_actions.txt && echo "PASS: Post-compromise actions documented"

tests:
  - name: business_email_compromise_test
    dry_run: true
