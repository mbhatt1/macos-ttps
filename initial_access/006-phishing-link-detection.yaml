---
api_version: 2.0
uuid: 2b6c4a9d-5e1f-4b8a-7d3c-1f4a8e2b5d6c
name: Phishing Link Detection
authors:
  - mbhatt
description: |
  Performs active reconnaissance and analysis of a target URL to identify phishing
  indicators. Uses DNS resolution, SSL certificate inspection, HTTP redirect tracing,
  and WHOIS domain age analysis to evaluate whether a URL is potentially malicious.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.002 Phishing: Spearphishing Link"

requirements:
  platforms:
    - os: darwin

args:
  - name: target_url
    description: "URL to analyze for phishing indicators"
    type: string
    default: "https://example.com"

steps:
  - name: resolve_dns_for_target
    description: Resolve DNS records for the target domain
    inline: |
      mkdir -p /tmp/ttp_linkanalysis
      DOMAIN=$(echo "{{ .Args.target_url }}" | sed -E 's|https?://||' | sed 's|/.*||' | sed 's|:.*||')
      echo "[+] Analyzing domain: ${DOMAIN}"
      echo "=== DNS Resolution ===" > /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] A Records:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      dig +short A ${DOMAIN} 2>/dev/null | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] MX Records:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      dig +short MX ${DOMAIN} 2>/dev/null | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] NS Records:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      dig +short NS ${DOMAIN} 2>/dev/null | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] DNS resolution complete"

  - name: check_ssl_certificate
    description: Check SSL certificate details for the target domain
    inline: |
      DOMAIN=$(echo "{{ .Args.target_url }}" | sed -E 's|https?://||' | sed 's|/.*||' | sed 's|:.*||')
      echo "=== SSL Certificate Analysis ===" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] Checking SSL certificate for ${DOMAIN}:443..."
      CERT_INFO=$(echo | openssl s_client -connect ${DOMAIN}:443 -servername ${DOMAIN} 2>/dev/null | openssl x509 -noout -subject -issuer -dates -serial 2>/dev/null || echo "No SSL certificate found or connection failed")
      echo "${CERT_INFO}" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] Certificate Subject Alternative Names:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo | openssl s_client -connect ${DOMAIN}:443 -servername ${DOMAIN} 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | tee -a /tmp/ttp_linkanalysis/analysis.txt || echo "Could not retrieve SAN" | tee -a /tmp/ttp_linkanalysis/analysis.txt

  - name: trace_url_redirects
    description: Follow URL redirects and record the redirect chain
    inline: |
      echo "=== URL Redirect Analysis ===" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] Tracing redirects for {{ .Args.target_url }}..." | tee -a /tmp/ttp_linkanalysis/analysis.txt
      curl -Ls -o /dev/null -w "Final URL: %{url_effective}\nHTTP Code: %{http_code}\nRedirects: %{num_redirects}\nTotal Time: %{time_total}s\n" "{{ .Args.target_url }}" 2>/dev/null | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] Full redirect chain:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      curl -Ls -D - -o /dev/null "{{ .Args.target_url }}" 2>/dev/null | grep -i "^location:" | tee -a /tmp/ttp_linkanalysis/analysis.txt || echo "No redirects detected" | tee -a /tmp/ttp_linkanalysis/analysis.txt

  - name: check_whois_domain_info
    description: Check WHOIS information for domain age and registrar details
    inline: |
      DOMAIN=$(echo "{{ .Args.target_url }}" | sed -E 's|https?://||' | sed 's|/.*||' | sed 's|:.*||')
      echo "=== WHOIS Domain Analysis ===" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      echo "[+] WHOIS lookup for ${DOMAIN}:" | tee -a /tmp/ttp_linkanalysis/analysis.txt
      whois ${DOMAIN} 2>/dev/null | grep -iE "(creation date|registrar|expir|name server|registrant|updated)" | head -20 | tee -a /tmp/ttp_linkanalysis/analysis.txt || echo "WHOIS lookup failed or not available" | tee -a /tmp/ttp_linkanalysis/analysis.txt

  - name: generate_analysis_report
    description: Generate final analysis report with all findings
    inline: |
      echo ""
      echo "========================================="
      echo "[+] PHISHING LINK ANALYSIS REPORT"
      echo "========================================="
      echo "[+] Target URL: {{ .Args.target_url }}"
      echo ""
      cat /tmp/ttp_linkanalysis/analysis.txt
      echo ""
      echo "[+] PASS: URL analysis complete - review findings above"
    cleanup:
      inline: |
        rm -rf /tmp/ttp_linkanalysis
        echo "[+] Cleanup: Analysis files removed"

tests:
  - name: phishing_link_detection_test
    dry_run: true
