---
api_version: 2.0
uuid: 7a2b9e1f-4c6d-4e3a-8b5c-1f9d2e4a7c3b
name: Malicious Attachment Analysis
authors:
  - mbhatt
description: |
  Creates a real executable payload disguised as a document file using the .command
  extension. Sets macOS quarantine extended attributes, inspects the file type with
  the file command, and checks Gatekeeper assessment using spctl to evaluate how
  macOS would handle the attachment.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: attachment_name
    description: "Name of malicious attachment disguised as a document"
    type: string
    default: "Invoice_2025.command"

steps:
  - name: create_disguised_executable_payload
    description: Create a bash script payload disguised with a document-like name
    inline: |
      mkdir -p /tmp/ttp_attachments
      cat > /tmp/ttp_attachments/{{ .Args.attachment_name }} << 'PAYLOAD'
      #!/bin/bash
      # Payload disguised as a document
      # In a real attack this would execute arbitrary commands
      whoami
      hostname
      sw_vers
      system_profiler SPHardwareDataType 2>/dev/null | head -20
      curl -s http://ifconfig.me 2>/dev/null || echo "No network"
      PAYLOAD
      echo "[+] Created disguised executable payload: /tmp/ttp_attachments/{{ .Args.attachment_name }}"

  - name: set_executable_permissions_and_quarantine
    description: Set executable permissions and quarantine extended attributes
    inline: |
      chmod +x /tmp/ttp_attachments/{{ .Args.attachment_name }}
      xattr -w com.apple.quarantine "0081;$(printf '%x' $(date +%s));Safari;$(uuidgen)" /tmp/ttp_attachments/{{ .Args.attachment_name }}
      echo "[+] Set executable permission and quarantine xattr on payload"
      ls -la /tmp/ttp_attachments/{{ .Args.attachment_name }}

  - name: inspect_file_type
    description: Use file command to inspect the true file type of the payload
    inline: |
      echo "[+] File type analysis:"
      file /tmp/ttp_attachments/{{ .Args.attachment_name }}
      echo ""
      echo "[+] File extension: {{ .Args.attachment_name }}"
      echo "[+] Actual type: Bash script (executable)"

  - name: check_gatekeeper_assessment
    description: Check Gatekeeper assessment of the unsigned payload
    inline: |
      echo "[+] Gatekeeper assessment:"
      spctl --assess --type execute /tmp/ttp_attachments/{{ .Args.attachment_name }} 2>&1 || true
      echo ""
      echo "[+] Code signature check:"
      codesign -dvvv /tmp/ttp_attachments/{{ .Args.attachment_name }} 2>&1 || true

  - name: verify_quarantine_xattr
    description: Verify quarantine extended attribute is set on the payload
    inline: |
      echo "[+] Extended attributes on payload:"
      xattr -l /tmp/ttp_attachments/{{ .Args.attachment_name }}
      xattr -p com.apple.quarantine /tmp/ttp_attachments/{{ .Args.attachment_name }} && echo "[+] PASS: Quarantine attribute is set"
    cleanup:
      inline: |
        rm -rf /tmp/ttp_attachments
        echo "[+] Cleanup: Removed payload files"

tests:
  - name: malicious_attachment_analysis_test
    dry_run: true
