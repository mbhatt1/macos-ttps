---
api_version: 2.0
uuid: 7a2b9e1f-4c6d-4e3a-8b5c-1f9d2e4a7c3b
name: Malicious Attachment Analysis
authors:
  - mbhatt
description: |
  Demonstrates malicious attachment analysis by creating and analyzing suspicious
  file attachments commonly used in phishing campaigns. Simulates detection of
  dangerous file types and embedded macros.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: attachment_name
    description: "Name of malicious attachment"
    type: string
    default: "Invoice_2025.docm"
  - name: attachment_type
    description: "File extension indicating macro-enabled document"
    type: string
    default: "docm"
  - name: sender_email
    description: "Email address sending attachment"
    type: string
    default: "accounting@trustedcompany.com"
  - name: target_user
    description: "Target recipient"
    type: string
    default: "finance@company.com"

steps:
  - name: create_suspicious_attachment
    description: Create suspicious attachment file
    inline: |
      mkdir -p /tmp/suspicious_attachments
      cat > /tmp/suspicious_attachments/{{ attachment_name }} << 'DOCEOF'
      [Content_Types].xml
      <?xml version="1.0"?>
      <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
      <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
      </Types>
      DOCEOF
      echo "Created suspicious attachment: {{ attachment_name }}"
    cleanup:
      inline: |
        rm -rf /tmp/suspicious_attachments

  - name: analyze_attachment_metadata
    description: Analyze attachment metadata and risk level
    inline: |
      file /tmp/suspicious_attachments/{{ attachment_name }}
      ls -lah /tmp/suspicious_attachments/{{ attachment_name }}
      echo "Attachment Risk Analysis:"
      echo "  - File Type: {{ attachment_type }}"
      echo "  - Risk Level: HIGH"
      echo "  - Contains Macros: Likely"
      echo "  - Sender: {{ sender_email }}"

  - name: log_attachment_analysis
    description: Log attachment analysis results
    inline: |
      mkdir -p /tmp/attachment_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/attachment_logs/analysis_${timestamp}.log << 'LOGEOF'
      Attachment Analysis Report
      Filename: {{ attachment_name }}
      Sender: {{ sender_email }}
      Recipient: {{ target_user }}
      File Type: {{ attachment_type }}
      Status: SUSPICIOUS - Macro-enabled document
      Action: Quarantine
      LOGEOF
      echo "Analysis logged"
    cleanup:
      inline: |
        rm -rf /tmp/attachment_logs

  - name: verify_attachment_created
    description: Verify attachment file exists
    inline: |
      test -f /tmp/suspicious_attachments/{{ attachment_name }} && echo "PASS: Attachment file exists"

  - name: verify_file_type_detection
    description: Verify file type was analyzed
    inline: |
      file /tmp/suspicious_attachments/{{ attachment_name }} | grep -q "." && echo "PASS: File type analyzed"

  - name: verify_analysis_logs_created
    description: Verify analysis logs were created
    inline: |
      test -d /tmp/attachment_logs && [ $(ls -1 /tmp/attachment_logs | wc -l) -gt 0 ] && echo "PASS: Analysis logs created"

tests:
  - name: malicious_attachment_analysis_test
    dry_run: true
