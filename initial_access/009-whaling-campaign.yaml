---
api_version: 2.0
uuid: 5e9f7d2a-8b4c-6f1e-0a3d-4c7e8f2a1b5d
name: Whaling Campaign
authors:
  - mbhatt
description: |
  Demonstrates whaling campaign (phishing targeting C-level executives) execution
  with highly sophisticated social engineering. Includes executive-level targeting,
  advanced reconnaissance, and financial crime scenarios.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: executive_name
    description: "Name of C-level executive being targeted"
    type: string
    default: "James Richardson, CEO"
  - name: company_name
    description: "Target company name"
    type: string
    default: "GlobalTech Corporation"
  - name: business_context
    description: "Current business activity or announcement"
    type: string
    default: "pending acquisition by larger corporation"
  - name: attack_vector
    description: "Primary attack vector"
    type: string
    default: "urgent wire transfer request"

steps:
  - name: conduct_executive_level_reconnaissance
    description: Conduct executive-level reconnaissance
    inline: |
      mkdir -p /tmp/whaling
      cat > /tmp/whaling/executive_profile.txt << 'PROFILEEOF'
      EXECUTIVE WHALING TARGET PROFILE
      PRIMARY TARGET: {{ executive_name }}
      COMPANY: {{ company_name }}
      Business Context: {{ business_context }}
      PROFILEEOF
      echo "Created executive profile"
    cleanup:
      inline: |
        rm -rf /tmp/whaling

  - name: develop_whaling_attack_scenario
    description: Develop whaling attack scenario and plan
    inline: |
      cat > /tmp/whaling/whaling_attack_plan.txt << 'PLANEOF'
      WHALING CAMPAIGN ATTACK PLAN
      CAMPAIGN OBJECTIVE: {{ attack_vector }}
      TARGET: {{ executive_name }}
      BUSINESS CONTEXT: {{ business_context }}
      PHASE 1: RECONNAISSANCE
      PHASE 2: SPOOFING INFRASTRUCTURE
      PHASE 3: SOCIAL ENGINEERING CONTENT
      PHASE 4: DELIVERY AND EXECUTION
      PLANEOF
      echo "Created whaling attack plan"

  - name: create_fake_acquisition_documents
    description: Create fake acquisition documents
    inline: |
      cat > /tmp/whaling/acquisition_agreement.txt << 'DOCEOF'
      CONFIDENTIAL ACQUISITION AGREEMENT
      Company: {{ company_name }}
      Buyer: Sterling Capital Partners, Inc.
      This is a simulated document for security testing purposes.
      DOCEOF
      echo "Created fake acquisition documents"

  - name: create_campaign_timeline
    description: Create campaign timeline and execution log
    inline: |
      mkdir -p /tmp/whaling_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/whaling_logs/campaign_${timestamp}.log << 'LOGEOF'
      WHALING CAMPAIGN EXECUTION LOG
      Target: {{ executive_name }}
      Company: {{ company_name }}
      Attack Vector: {{ attack_vector }}
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/whaling_logs

  - name: verify_executive_profile_created
    description: Verify executive profile was created
    inline: |
      test -f /tmp/whaling/executive_profile.txt && echo "PASS: Executive profile created"

  - name: verify_attack_plan_created
    description: Verify attack plan was created
    inline: |
      test -f /tmp/whaling/whaling_attack_plan.txt && echo "PASS: Attack plan created"

  - name: verify_fake_documents_created
    description: Verify fake documents were created
    inline: |
      test -f /tmp/whaling/acquisition_agreement.txt && echo "PASS: Fake acquisition documents created"

tests:
  - name: whaling_campaign_test
    dry_run: true
