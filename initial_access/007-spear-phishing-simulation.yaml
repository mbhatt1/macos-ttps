---
api_version: 2.0
uuid: 3c7d5b0e-6f2a-4e9b-8a1d-2c5e7f1a3d8b
name: Spear Phishing Simulation
authors:
  - mbhatt
description: |
  Demonstrates spear phishing simulation with highly targeted attacks using
  specific victim information. Includes personalized content, contextual details,
  and advanced social engineering to increase success rate.

mitre:
  tactics:
    - "TA0001 Initial Access"
  techniques:
    - "T1566 Phishing"
  subtechniques:
    - "T1566.001 Phishing: Spearphishing Attachment"

requirements:
  platforms:
    - os: darwin

args:
  - name: victim_name
    description: "Name of targeted individual"
    type: string
    default: "Sarah Johnson"
  - name: victim_title
    description: "Job title of target"
    type: string
    default: "Finance Director"
  - name: victim_company
    description: "Company where victim works"
    type: string
    default: "TechCorp Industries"
  - name: sender_name
    description: "Spoofed sender identity"
    type: string
    default: "David Chen, CEO"
  - name: specific_project
    description: "Real project victim is working on"
    type: string
    default: "Q1 2025 Budget Allocation"

steps:
  - name: gather_intelligence_on_target
    description: Gather intelligence on target individual
    inline: |
      mkdir -p /tmp/spear_phishing
      cat > /tmp/spear_phishing/target_profile.txt << 'PROFILEEOF'
      TARGET INTELLIGENCE PROFILE
      Primary Target: {{ victim_name }}
      Title: {{ victim_title }}
      Company: {{ victim_company }}
      Reports To: {{ sender_name }}
      Current Major Project: {{ specific_project }}
      PROFILEEOF
      echo "Created target profile"
    cleanup:
      inline: |
        rm -rf /tmp/spear_phishing

  - name: create_spear_phishing_email
    description: Create spear phishing email with personalized content
    inline: |
      cat > /tmp/spear_phishing/spear_phishing_email.txt << 'EMAILEOF'
      From: {{ sender_name }} <david.chen@techcorp-industries.com>
      To: {{ victim_name }} <sarah.johnson@techcorp.com>
      Subject: URGENT: {{ specific_project }} - Budget Revision Required

      Hi {{ victim_name }},

      I need your immediate assistance with a confidential matter regarding the
      {{ specific_project }} budget allocation.

      Please click the link below and sign in with your TechCorp credentials:
      https://secure-techcorp-document-portal.com/verify-credentials

      David Chen
      Chief Executive Officer
      TechCorp Industries
      EMAILEOF
      echo "Created spear phishing email"

  - name: create_context_specific_landing_page
    description: Create context-specific landing page
    inline: |
      cat > /tmp/spear_phishing/landing_page.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html>
      <head><title>TechCorp Secure Document Portal</title></head>
      <body>
        <h1>TechCorp Secure Document Portal</h1>
        <p>Project: {{ specific_project }}</p>
        <p>Requested By: {{ sender_name }}, CEO</p>
        <form action="/portal/authenticate" method="POST">
          <input type="email" name="email" placeholder="your.email@techcorp.com" required>
          <input type="password" name="password" placeholder="Your TechCorp password" required>
          <button type="submit">Access Confidential Documents</button>
        </form>
      </body>
      </html>
      HTMLEOF
      echo "Created spear phishing landing page"

  - name: create_execution_plan
    description: Create spear phishing execution plan
    inline: |
      cat > /tmp/spear_phishing/execution_plan.txt << 'PLANEOF'
      SPEAR PHISHING EXECUTION PLAN
      PHASE 1: TIMING - Send at 4:55 PM
      PHASE 2: DELIVERY - Spoofed email from CEO
      PHASE 3: EXPLOITATION - Credential capture via landing page
      PHASE 4: POST-COMPROMISE - Use captured credentials
      PLANEOF
      echo "Created execution plan"

  - name: log_spear_phishing_setup
    description: Log spear phishing campaign setup
    inline: |
      mkdir -p /tmp/spear_logs
      timestamp=$(date +%Y%m%d_%H%M%S)
      cat > /tmp/spear_logs/campaign_${timestamp}.log << 'LOGEOF'
      Spear Phishing Campaign Initiated
      Target: {{ victim_name }} ({{ victim_title }})
      Company: {{ victim_company }}
      Sender Spoofed: {{ sender_name }}
      Campaign Theme: {{ specific_project }}
      LOGEOF
    cleanup:
      inline: |
        rm -rf /tmp/spear_logs

  - name: verify_target_profile_created
    description: Verify target profile was created
    inline: |
      test -f /tmp/spear_phishing/target_profile.txt && echo "PASS: Target profile created"

  - name: verify_spear_phishing_email_created
    description: Verify spear phishing email was created
    inline: |
      test -f /tmp/spear_phishing/spear_phishing_email.txt && echo "PASS: Spear phishing email created"

  - name: verify_landing_page_created
    description: Verify landing page was created
    inline: |
      test -f /tmp/spear_phishing/landing_page.html && echo "PASS: Landing page created"

tests:
  - name: spear_phishing_simulation_test
    dry_run: true
